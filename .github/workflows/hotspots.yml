name: Daily Hotspots Refresh

on:
  schedule:
    # 每天北京时间 8:00 跑（即 UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch hotspots from public APIs
        run: node .github/scripts/fetch-hotspots.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh hotspots"
          file_pattern: "_data/hotspots.json"
