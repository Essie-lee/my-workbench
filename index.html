          </div>
          <button class="btn sm outline block" data-action="speak" data-t="${encodeURIComponent(w.word)}" data-l="${L.tts}" style="margin-top:10px">🔊 发音</button>
          ${st.flipped?`<div style="margin-top:10px;padding:14px;background:var(--panel-ins);border-radius:var(--radius-sm)">
            <div style="font-size:18px;font-weight:700;color:var(--accent)">${esc(w.meaning)}</div>
            <div style="font-size:13px;color:var(--ink-2);margin-top:8px;font-style:italic">「${esc(w.example||'')}」</div>
          </div>`:''}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn sm outline" data-action="flash-flip" style="flex:1">${st.flipped?'收起':'翻转'}</button>
          <button class="btn sm grad green" data-action="flash-know" style="flex:1.3">✅ 认识</button>
          <button class="btn sm outline" data-action="flash-unknow" style="flex:1.3">📌 不认识</button>
        </div>`;
    }
    // ============ 精听跟读（对标每日英语听力：单句精听 + 跟读打分）============
    let listenState = null;
    function renderStudyListen() {
      const L = LANG[curLang || 'english'];
      const sentences = [];
      (L.articles||[]).forEach(a=>a.paras.forEach(p=>sentences.push(p.en)));
      (L.vocabulary||[]).forEach(w=>{ if(w.example) sentences.push(w.example); });
      if (!sentences.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无听力句</div></div>'; return; }
      if (!listenState || listenState.done) {
        const day = Math.floor(Date.now()/86400000);
        const pick = [];
        for (let i=0;i<5;i++) pick.push(sentences[(day+i*7)%sentences.length]);
        listenState = { pick, idx:0, revealed:false, result:null, done:false };
      }
      const st = listenState, s = st.pick[st.idx];
      $('langBody').innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>精听 ${st.idx+1}/${st.pick.length}</span><button class="btn sm outline" data-action="listen-play" style="margin:0">🔊 盲听</button></div>
          <div style="margin:14px 0;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.6">
            ${st.revealed?esc(s):'<span style="color:var(--muted)">先盲听，再点「显示原文」</span>'}
          </div>
          ${st.revealed?`<button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(s)}" data-l="${L.tts}" style="width:100%;justify-content:center;margin-bottom:8px">🔊 跟读示范</button>`:''}
          <div style="display:flex;gap:8px">
            ${!st.revealed?`<button class="btn sm" data-action="listen-reveal" style="flex:1">显示原文</button>`:`<button class="btn sm" data-action="listen-record" style="flex:1">🎤 我开始跟读</button>`}
          </div>
          ${st.result?`<div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.5">${st.result}</div>`:''}
          <button class="btn sm outline" data-action="listen-next" style="margin-top:10px;width:100%;justify-content:center">下一句 →</button>
        </div>
        <div class="card-sub" style="text-align:center;margin-top:6px">跟读使用浏览器语音识别，部分手机/PWA 可能不支持；不支持时可用「显示原文 + 跟读示范」替代练习。</div>`;
    }
    // ============ 情景对话（吃 dialogues 数据：韩/粤最有价值的真实语料）============
    let dialogState = null;
    function renderStudyDialog() {
      const L = LANG[curLang || 'english'];
      const list = (L.dialogues||[]);
      if (!list.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无对话语料</div></div>'; return; }
      if (!dialogState || dialogState.done) {
        const day = Math.floor(Date.now()/86400000);
        const pick = [];
        for (let i=0;i<6;i++) pick.push(list[(day+i*5)%list.length]);
        dialogState = { pick, idx:0, revealed:false, result:null, done:false };
      }
      const st = dialogState, d = st.pick[st.idx];
      const isHan = curLang==='korean';
      $('langBody').innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>情景对话 ${st.idx+1}/${st.pick.length}</span><span>${isHan?'🇰🇷 韩语':'🇭🇰 粤语'}</span></div>
          <div style="margin:14px 0;font-size:20px;font-weight:700;text-align:center;line-height:1.5">${esc(d.ko)}</div>
          ${st.revealed?`<div style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px">${esc(d.mp||'')}</div>
          <div style="text-align:center;font-size:15px;color:var(--primary);margin-bottom:10px">${esc(d.zh)}</div>`:''}
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <button class="btn sm" data-action="dialog-play" style="flex:1;justify-content:center">🔊 听原声</button>
            ${st.revealed?'':'<button class="btn sm outline" data-action="dialog-reveal" style="flex:1;justify-content:center">显示拼音/含义</button>'}
          </div>
          ${st.revealed?`<button class="btn sm" data-action="dialog-record" style="width:100%;justify-content:center;margin-bottom:8px">🎤 我跟读这句</button>`:''}
          ${st.result?`<div style="padding:10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.5">${st.result}</div>`:''}
          <button class="btn sm outline" data-action="dialog-next" style="margin-top:8px;width:100%;justify-content:center">下一句 →</button>
        </div>
        <div class="card-sub" style="text-align:center;margin-top:6px">${isHan?'罗马音参考，跟读练语感':'粤拼 Jyutping 参考，跟读练九声六调'}</div>`;
    }
    function startAssess() {
      const L = LANG[curLang];
      let step = 0; let score = 0;
      const q = L.assessment;
      openModal(`<h3>📝 ${L.name} 水平测评</h3><div id="aq"></div>
        <div class="modal-actions"><button class="btn" id="anext">下一题</button></div>`);
      renderQ();
      function renderQ(){
        const item = q[step];
        $('aq').innerHTML = `<p style="margin-bottom:12px;font-weight:600">${step+1}/${q.length}. ${item.q}</p>` +
          item.o.map((o,i)=>`<div class="opt" data-s="${item.s[i]}" data-o="${o}">${o}</div>`).join('');
        $('aq').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
          $('aq').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
          el.classList.add('sel');
        });
        $('anext').textContent = step===q.length-1 ? '查看结果' : '下一题';
      }
      $('anext').onclick = () => {
        const sel = $('aq').querySelector('.opt.sel');
        if (!sel) { alert('请选择一个答案'); return; }
        score += +sel.dataset.s;
        if (step < q.length-1) { step++; renderQ(); }
        else {
          const max = q.length*3; const ratio = score/max;
          const idx = Math.min(L.levels.length-1, Math.floor(ratio * L.levels.length));
          if (typeof state.lang[curLang] !== 'object' || state.lang[curLang] === null) state.lang[curLang] = { level: null, progress: {} };
          state.lang[curLang].level = idx; save();
          openModal(`<h3>🎯 测评结果</h3>
            <p style="margin-bottom:10px">你的 ${L.name} 水平约为：</p>
            <div class="card-title" style="font-size:20px;color:var(--primary)">${L.levels[idx]}</div>
            <p class="card-sub" style="margin-top:10px">${L.plan[idx].g}</p>
            <div class="modal-actions"><button class="btn" data-action="modal-close">开始学习</button></div>`);
          renderLangBody();
        }
      };
    }

    // ===================== 运动 =====================

    // ---- 3D 肌肉模型 ----
    let muscleScene=null, muscleRenderer=null, muscleCamera=null, muscleMeshes={}, muscleSelected=null, muscleAnimId=null;
    let muscleDragging=false, muscleRotY=0, muscleRotX=-0.15, muscleTargetRotY=0, muscleTargetRotX=-0.15, muscleZoom=5;
    let musclePinching=false, musclePinchDist=0;
    let muscleViewSide='front';
    let threeReady = typeof window.THREE !== 'undefined';
    if (threeReady) { /* 已加载 */ } else {
      window.addEventListener('three-ready', ()=>{ threeReady=true; });
    }

    function initMuscleModel(container) {
      if (!threeReady || !window.THREE) {
        container.innerHTML = '<div class="muscle-fallback">💪<span>3D 模型加载中…<br>若长时间无显示，可能是网络问题</span></div>';
        // 5秒后重试
        setTimeout(()=>{ if(threeReady && currentView==='sport') initMuscleModel(container); }, 2000);
        return;
      }
      // 清理旧的
      disposeMuscleModel();
      const THREE = window.THREE;
      // 同步探测 WebGL 是否可用：不可用则降级显示，避免在无 GPU / 受限环境下卡死或抛错
      let webglOK = false;
      try { const _c = document.createElement('canvas'); webglOK = !!(window.WebGLRenderingContext && (_c.getContext('webgl') || _c.getContext('experimental-webgl'))); } catch(_) { webglOK = false; }
      if (!webglOK) {
        container.innerHTML = '<div class="muscle-fallback">💪<span>当前环境不支持 3D 模型<br>训练打卡功能不受影响</span></div>';
        return;
      }
      muscleScene = new THREE.Scene();
      muscleCamera = new THREE.PerspectiveCamera(35, container.clientWidth/container.clientHeight, 0.1, 100);
      muscleCamera.position.set(0, 0.3, 5);
      try {
        muscleRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
        muscleRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        muscleRenderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(muscleRenderer.domElement);
      } catch(e) {
        container.innerHTML = '<div class="muscle-fallback">💪<span>3D 模型初始化失败<br>训练打卡功能不受影响</span></div>';
        return;
      }

      // 光源
      const amb = new THREE.AmbientLight(0xffffff, 0.7);
      muscleScene.add(amb);
      const dir = new THREE.DirectionalLight(0xffffff, 0.6);
      dir.position.set(2, 3, 4);
      muscleScene.add(dir);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dir2.position.set(-2, 1, -3);
      muscleScene.add(dir2);

      const muscleGroup = new THREE.Group();
      muscleScene.add(muscleGroup);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const flesh = isDark ? 0x8a6a52 : 0xc9a07a;
      const neutral = isDark ? 0x4a4a4a : 0x999999;
      const matMuscle = ()=> new THREE.MeshLambertMaterial({ color:flesh, emissive:0x000000, transparent:true, opacity:0.92 });
      const matNeutral = ()=> new THREE.MeshLambertMaterial({ color:neutral, transparent:true, opacity:0.6 });

      // 辅助：创建肌肉 Mesh
      function mkMuscle(geo, x, y, z, id, ry=0) {
        const m = new THREE.Mesh(geo, matMuscle());
        m.position.set(x, y, z);
        if (ry) m.rotation.y = ry;
        m.userData.muscleId = id;
        muscleMeshes[id] = m;
        muscleGroup.add(m);
        return m;
      }
      function mkNeutral(geo, x, y, z) {
        const m = new THREE.Mesh(geo, matNeutral());
        m.position.set(x, y, z);
        muscleGroup.add(m);
        return m;
      }

      const Seg = 12; // 低分段

      // 头部
      mkNeutral(new THREE.SphereGeometry(0.22, Seg, Seg), 0, 2.15, 0);
      // 颈部
      mkNeutral(new THREE.CylinderGeometry(0.08, 0.1, 0.15, Seg), 0, 1.92, 0);

      // 胸肌 chest
      mkMuscle(new THREE.BoxGeometry(0.52, 0.38, 0.2), 0, 1.55, 0.12, 'chest');
      // 背阔肌 back
      mkMuscle(new THREE.BoxGeometry(0.52, 0.45, 0.2), 0, 1.5, -0.12, 'back');

      // 三角肌 shoulder (左右)
      mkMuscle(new THREE.SphereGeometry(0.16, Seg, Seg), 0.33, 1.72, 0.05, 'shoulder');
      mkMuscle(new THREE.SphereGeometry(0.16, Seg, Seg), -0.33, 1.72, 0.05, 'shoulder', 0); // 同 id

      // 肱二头肌 biceps (左右臂前方)
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.28, Seg, Seg), 0.42, 1.4, 0.08, 'biceps');
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.28, Seg, Seg), -0.42, 1.4, 0.08, 'biceps');
      // 肱三头肌 triceps (左右臂后方)
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.28, Seg, Seg), 0.42, 1.4, -0.08, 'triceps');
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.28, Seg, Seg), -0.42, 1.4, -0.08, 'triceps');

      // 前臂 forearm (左右)
      mkMuscle(new THREE.CapsuleGeometry(0.055, 0.25, Seg, Seg), 0.46, 0.95, 0.04, 'forearm');
      mkMuscle(new THREE.CapsuleGeometry(0.055, 0.25, Seg, Seg), -0.46, 0.95, 0.04, 'forearm');

      // 腹直肌 abs
      mkMuscle(new THREE.BoxGeometry(0.32, 0.5, 0.16), 0, 1.0, 0.1, 'abs');
      // 腹斜肌 oblique (左右侧)
      mkMuscle(new THREE.BoxGeometry(0.1, 0.4, 0.16), 0.22, 1.0, 0.08, 'oblique');
      mkMuscle(new THREE.BoxGeometry(0.1, 0.4, 0.16), -0.22, 1.0, 0.08, 'oblique');

      // 臀大肌 glute
      mkMuscle(new THREE.SphereGeometry(0.18, Seg, Seg), 0.13, 0.55, -0.1, 'glute');
      mkMuscle(new THREE.SphereGeometry(0.18, Seg, Seg), -0.13, 0.55, -0.1, 'glute');

      // 股四头肌 quad (左右腿前方)
      mkMuscle(new THREE.CapsuleGeometry(0.1, 0.5, Seg, Seg), 0.13, 0.05, 0.06, 'quad');
      mkMuscle(new THREE.CapsuleGeometry(0.1, 0.5, Seg, Seg), -0.13, 0.05, 0.06, 'quad');
      // 腘绳肌 hamstring (左右腿后方)
      mkMuscle(new THREE.CapsuleGeometry(0.09, 0.45, Seg, Seg), 0.13, 0.05, -0.06, 'hamstring');
      mkMuscle(new THREE.CapsuleGeometry(0.09, 0.45, Seg, Seg), -0.13, 0.05, -0.06, 'hamstring');

      // 小腿肌 calf (左右)
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.25, Seg, Seg), 0.13, -0.75, -0.03, 'calf');
      mkMuscle(new THREE.CapsuleGeometry(0.07, 0.25, Seg, Seg), -0.13, -0.75, -0.03, 'calf');

      // 脚、手等中性填充
      mkNeutral(new THREE.BoxGeometry(0.08, 0.15, 0.2), 0.46, 0.72, 0.08);  // 手
      mkNeutral(new THREE.BoxGeometry(0.08, 0.15, 0.2), -0.46, 0.72, 0.08);
      mkNeutral(new THREE.BoxGeometry(0.12, 0.05, 0.22), 0.13, -1.2, 0.02);  // 脚
      mkNeutral(new THREE.BoxGeometry(0.12, 0.05, 0.22), -0.13, -1.2, 0.02);

      // 交互事件
      const canvas = muscleRenderer.domElement;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function getNDC(e) {
        const rect = canvas.getBoundingClientRect();
        const isTouch = e.touches && e.touches.length;
        const cx = isTouch ? e.touches[0].clientX : e.clientX;
        const cy = isTouch ? e.touches[0].clientY : e.clientY;
        return { x: ((cx-rect.left)/rect.width)*2-1, y: -((cy-rect.top)/rect.height)*2+1, cx, cy };
      }

      let dragStartX=0, dragStartY=0, dragMoved=false;

      function onPointerDown(e) {
        const p = getNDC(e);
        dragStartX = p.cx; dragStartY = p.cy; dragMoved = false;
        if (e.touches && e.touches.length===2) {
          musclePinching = true;
          musclePinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        } else {
          muscleDragging = true;
        }
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (musclePinching && e.touches && e.touches.length===2) {
          const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
          const delta = d - musclePinchDist;
          muscleZoom = Math.max(2.5, Math.min(8, muscleZoom - delta * 0.01));
          musclePinchDist = d;
          e.preventDefault();
          return;
        }
        if (muscleDragging) {
          const p = getNDC(e);
          const dx = p.cx - dragStartX, dy = p.cy - dragStartY;
          if (Math.abs(dx)+Math.abs(dy) > 4) dragMoved = true;
          muscleTargetRotY += dx * 0.008;
          muscleTargetRotX = Math.max(-1.2, Math.min(1.2, muscleTargetRotX + dy * 0.008));
          dragStartX = p.cx; dragStartY = p.cy;
          e.preventDefault();
        }
      }

      function onPointerUp(e) {
        if (!dragMoved && !musclePinching) {
          // 点击：Raycaster 检测
          const p = getNDC(e.changedTouches ? { clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY } : e);
          const rect = canvas.getBoundingClientRect();
          mouse.x = ((p.cx-rect.left)/rect.width)*2-1;
          mouse.y = -((p.cy-rect.top)/rect.height)*2+1;
          raycaster.setFromCamera(mouse, muscleCamera);
          const meshes = Object.values(muscleMeshes);
          const hits = raycaster.intersectObjects(meshes, false);
          if (hits.length > 0) {
            const id = hits[0].object.userData.muscleId;
            if (id) { highlightMuscle(id); updateMuscleInfo(id); }
          }
        }
        muscleDragging = false; musclePinching = false;
      }

      function onWheel(e) {
        muscleZoom = Math.max(2.5, Math.min(8, muscleZoom + e.deltaY * 0.003));
        e.preventDefault();
      }

      canvas.addEventListener('touchstart', onPointerDown, { passive:false });
      canvas.addEventListener('touchmove', onPointerMove, { passive:false });
      canvas.addEventListener('touchend', onPointerUp, { passive:false });
      canvas.addEventListener('mousedown', onPointerDown);
      canvas.addEventListener('mousemove', (e)=>{ if(muscleDragging) onPointerMove(e); });
      canvas.addEventListener('mouseup', onPointerUp);
      canvas.addEventListener('mouseleave', ()=>{ muscleDragging=false; musclePinching=false; });
      canvas.addEventListener('wheel', onWheel, { passive:false });

      // 渲染循环
      function animate() {
        muscleAnimId = requestAnimationFrame(animate);
        // 平滑过渡
        muscleRotY += (muscleTargetRotY - muscleRotY) * 0.15;
        muscleRotX += (muscleTargetRotX - muscleRotX) * 0.15;
        const group = muscleScene.children.find(c=>c.type==='Group');
        if (group) { group.rotation.y = muscleRotY; group.rotation.x = muscleRotX; }
        muscleCamera.position.z += (muscleZoom - muscleCamera.position.z) * 0.15;
        muscleRenderer.render(muscleScene, muscleCamera);
      }
      animate();

      // 响应式
      function onResize() {
        if (!muscleRenderer || !muscleCamera || !container) return;
        const w = container.clientWidth, h = container.clientHeight;
        muscleCamera.aspect = w/h;
        muscleCamera.updateProjectionMatrix();
        muscleRenderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);
      // 存储引用以便 dispose
      muscleScene.userData.onResize = onResize;
    }

    function highlightMuscle(id) {
      const THREE = window.THREE;
      if (!THREE) return;
      // 清除所有高亮
      Object.values(muscleMeshes).forEach(m => {
        m.material.emissive.setHex(0x000000);
        m.material.opacity = 0.92;
      });
      if (muscleSelected === id) { muscleSelected = null; return; }
      muscleSelected = id;
      // 高亮所有同 id 的 mesh
      Object.values(muscleMeshes).forEach(m => {
        if (m.userData.muscleId === id) {
          const c = MUSCLES[id] ? MUSCLES[id].color : '#ff6600';
          m.material.emissive.setStyle(c);
          m.material.emissiveIntensity = 0.5;
          m.material.opacity = 1.0;
        }
      });
    }

    function updateMuscleInfo(id) {
      const info = $('muscleInfo');
      if (!info) return;
      const m = MUSCLES[id];
      if (!m) { info.innerHTML = '<div class="m-name">点击肌肉查看详情</div><div class="m-ex">点击 3D 模型上的肌肉部位，查看名称和锻炼动作</div>'; return; }
      info.innerHTML = `<div class="m-name">📌 ${m.name}</div><div class="m-ex">常见锻炼动作：${m.exercises.join(' · ')}</div>`;
    }

    function setMuscleView(side) {
      muscleViewSide = side;
      if (side==='back') { muscleTargetRotY = Math.PI; }
      else { muscleTargetRotY = 0; }
      // 更新按钮状态
      document.querySelectorAll('.muscle-toolbar button').forEach(b=>b.classList.toggle('active', b.dataset.side===side));
    }

    function disposeMuscleModel() {
      if (muscleAnimId) { cancelAnimationFrame(muscleAnimId); muscleAnimId = null; }
      if (muscleScene && muscleScene.userData.onResize) {
        window.removeEventListener('resize', muscleScene.userData.onResize);
      }
      if (muscleRenderer) {
        const canvas = muscleRenderer.domElement;
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
        muscleRenderer.dispose();
        muscleRenderer = null;
      }
      if (muscleScene) {
        muscleScene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
        muscleScene = null;
      }
      muscleMeshes = {}; muscleSelected = null;
      muscleDragging = false; musclePinching = false;
    }

    // ---- 训练记录 ----
    function calc1RM(weight, reps) {
      const r = +reps;
      if (!r || r <= 0) return weight;
      return Math.round(weight * (1 + r / 30) * 10) / 10;
    }

    function getTodaySets(sportId, exName) {
      const d = today();
      if (!state.sport.setsLog[d] || !state.sport.setsLog[d][sportId]) return [];
      const exData = state.sport.setsLog[d][sportId].find(e => e.exName === exName);
      return exData ? exData.sets : [];
    }

    function getLastSetWeight(sportId, exName) {
      // 找最近一次记录的重量
      const dates = Object.keys(state.sport.setsLog).sort().reverse();
      for (const d of dates) {
        if (!state.sport.setsLog[d][sportId]) continue;
        const ex = state.sport.setsLog[d][sportId].find(e => e.exName === exName);
        if (ex && ex.sets && ex.sets.length) return ex.sets[ex.sets.length - 1].weight;
      }
      return 20; // 默认建议重量
    }

    function saveSet(date, sportId, exName, weight, reps) {
      if (!state.sport.setsLog[date]) state.sport.setsLog[date] = {};
      if (!state.sport.setsLog[date][sportId]) state.sport.setsLog[date][sportId] = [];
      let ex = state.sport.setsLog[date][sportId].find(e => e.exName === exName);
      if (!ex) { ex = { exName, sets: [] }; state.sport.setsLog[date][sportId].push(ex); }
      ex.sets.push({ weight, reps, ts: Date.now() });
      save();

      // PR 检测
      const est1RM = calc1RM(weight, reps);
      if (!state.sport.pr[exName] || est1RM > state.sport.pr[exName]) {
        state.sport.pr[exName] = est1RM;
        save();
        toast(`🏆 PR！${exName} 估算 1RM = ${est1RM}kg`);
      }
    }

    function renderStrengthLog(sport) {
      const todaySets = state.sport.setsLog[today()]?.[sport.id] || [];
      const html = sport.exercises.map((ex, ei) => {
        const sets = todaySets.find(s => s.exName === ex.name)?.sets || [];
        const lastW = getLastSetWeight(sport.id, ex.name);
        const pr = state.sport.pr[ex.name];
        const m = MUSCLES[ex.muscle];
        const setsHtml = sets.map((s, si) => `<span class="tag gray" style="margin:2px">${si+1}. ${s.weight}kg×${s.reps}</span>`).join('');
        return `<div class="ex-set-row" id="exRow${ei}">
          <div style="flex:1;min-width:120px">
            <div style="font-weight:600;font-size:14px">${ex.name} ${pr?`<span class="ex-pr-badge">PR ${pr}kg</span>`:''}</div>
            <div style="font-size:11px;color:var(--muted)">${m?m.name:''} · ${ex.sets}×${ex.reps} · 休${ex.rest}</div>
          </div>
          <div class="ex-set-log" style="flex:1;min-width:100px">${setsHtml || '<span style="color:var(--muted)">尚未记录</span>'}</div>
          <div id="setInput${ei}" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">
            <input class="ex-set-input" id="setW${ei}" type="number" placeholder="重量kg" value="${lastW}" />
            <span style="color:var(--muted)">×</span>
            <input class="ex-set-input" id="setR${ei}" type="number" placeholder="次数" />
            <button class="btn sm" data-action="save-set" data-sid="${sport.id}" data-ex="${encodeURIComponent(ex.name)}" data-ei="${ei}">✅</button>
            <button class="btn sm ghost" data-action="cancel-set" data-ei="${ei}">取消</button>
          </div>
          <button class="btn sm outline" data-action="add-set" data-ei="${ei}" id="addBtn${ei}">➕ 记录</button>
        </div>`;
      }).join('');
      return `<div style="margin:8px 0">${html}</div>`;
    }

    function renderHeatmap() {
      // 近7天每个肌肉群训练组数
      const muscleCounts = {};
      Object.keys(MUSCLES).forEach(k => muscleCounts[k] = 0);
      const days = [];
      for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate()-i); days.push(dateStr(d)); }
      days.forEach(d => {
        const log = state.sport.setsLog[d];
        if (!log) return;
        Object.entries(log).forEach(([sid, exs]) => {
          const sport = SPORTS.find(s => s.id === sid);
          if (!sport || !sport.exercises) return;
          exs.forEach(ex => {
            const def = sport.exercises.find(e => e.name === ex.exName);
            if (def && muscleCounts[def.muscle] !== undefined) {
              muscleCounts[def.muscle] += (ex.sets?.length || 0);
            }
          });
        });
      });
      const max = Math.max(...Object.values(muscleCounts), 1);
      return Object.entries(MUSCLES).map(([id, m]) => {
        const cnt = muscleCounts[id];
        const intensity = cnt / max;
        const opacity = cnt === 0 ? 0.2 : 0.3 + intensity * 0.7;
        return `<div class="heat-dot" data-action="heat-muscle" data-id="${id}" style="background:${m.color};opacity:${opacity}" title="${m.name}: ${cnt}组">${m.short}</div>`;
      }).join('');
    }

    function renderWeekLogV2() {
      const start = new Date(); start.setDate(start.getDate() - ((start.getDay()+6)%7)); start.setHours(0,0,0,0);
      const days = [];
      for (let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const k=dateStr(d); days.push({k, log:state.sport.log[k], setsLog:state.sport.setsLog[k], label:(d.getMonth()+1)+'/'+d.getDate()}); }
      if (!days.some(d=>(d.log && Object.keys(d.log).length) || (d.setsLog && Object.keys(d.setsLog).length))) return '<div class="empty">本周还没有运动记录</div>';
      return days.map(d=>{
        const items = [];
        if (d.log) Object.entries(d.log).forEach(([id,m])=>{ const sp=SPORTS.find(s=>s.id===id); if(!sp) return; const txt = typeof m==='object'&&m ? (m.min?m.min+'分':'')+(m.note?' · '+m.note:'') : (m?m+'分':''); items.push(`${sp.icon} ${sp.name} ${txt}`); });
        if (d.setsLog) Object.entries(d.setsLog).forEach(([sid, exs])=>{
          const sp = SPORTS.find(s=>s.id===sid); if(!sp) return;
          const totalSets = exs.reduce((sum, e) => sum + (e.sets?.length||0), 0);
          if (totalSets) items.push(`${sp.icon} ${sp.name} ${totalSets}组`);
        });
        if (!items.length) return `<div class="item" style="padding:8px 0;opacity:.5"><span class="tag gray" style="margin-right:8px">${d.label}</span>休息</div>`;
        return `<div class="item" style="padding:8px 0"><span class="tag primary" style="margin-right:8px">${d.label}</span>${items.join(' · ')}</div>`;
      }).join('');
    }

      for (let i=0;i<7;i++){
        const d=new Date(start); d.setDate(d.getDate()+i); const k=dateStr(d);
        let vol = 0;
        if (state.sport.log[k]) vol += Object.values(state.sport.log[k]).reduce((a,b)=>a+(+b||0),0)/10; // 有氧分钟/10 做 scale
        if (state.sport.setsLog[k]) Object.values(state.sport.setsLog[k]).forEach(exs=>exs.forEach(e=>vol += (e.sets?.length||0)));
        days.push({ label: k.slice(5), value: Math.round(vol*10)/10 });
      }
      return days;

    function svgBars(data, color) {
      const w=600,h=150,pad=20,n=data.length; if(!n) return '';
      const max=Math.max(...data.map(d=>d.value),1);
      const slot=(w-2*pad)/n, bw=slot*0.55;
      const bars=data.map((d,i)=>{ const v=+d.value; const bh=max?(h-2*pad)*(v/max):0; const x=pad+slot*i+(slot-bw)/2; const y=h-pad-bh;
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="4" fill="${color}"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${h-5}" font-size="10" fill="#9a9a92" text-anchor="middle">${d.label}</text>`;}).join('');
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e8e2"/>${bars}</svg>`;
    }

    // ===================== 读书 =====================
    // ===================== 读书 · 养成辅助 =====================
    function bookStreak() {
      if (!state.books || !state.books.log) return 0;
      let s = 0;
      // 今天没打卡也不算断（今天还没结束）；从昨天起算
      let i = (state.books.log[today()] && state.books.log[today()].done) ? 0 : 1;
      for (; i < 400; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const k = dateStr(d);
        if (state.books.log[k] && state.books.log[k].done) s++;
        else break;
      }
      return s;
    }
    function bookYearDone() {
      if (!state.books) return 0;
      const y = String(new Date().getFullYear());
      return state.books.shelf.filter(b => b.status === 'done' && b.doneDate && b.doneDate.startsWith(y)).length;
    }
    function bookMonthDone() {
      if (!state.books) return 0;
      const m = monthKey();
      return state.books.shelf.filter(b => b.status === 'done' && b.doneDate && b.doneDate.startsWith(m)).length;
    }
    function bookReadingCount() {
      return state.books ? state.books.shelf.filter(b => b.status === 'reading').length : 0;
    }
    function bookWeekDays() {
      if (!state.books || !state.books.log) return 0;
      const now = new Date();
      const dow = (now.getDay() + 6) % 7; // 0=周一
      let c = 0;
      for (let i = 0; i <= dow; i++) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const k = dateStr(d);
        if (state.books.log[k] && state.books.log[k].done) c++;
      }
      return c;
    }
    function bookHeatmap() {
      // 自适应范围：没数据时只显示近期；有数据从首次读书那周向前展开；同时按卡片宽度自动铺满
      const logs = Object.keys(state.books.log || {}).filter(k => state.books.log[k] && state.books.log[k].done).sort();
      let dataWeeks = 3;
      if (logs.length) {
        const earliest = new Date(logs[0]);
        const weeksSince = Math.ceil((Date.now() - earliest.getTime()) / (7 * 86400000));
        dataWeeks = Math.min(30, Math.max(3, weeksSince + 1));
      }
      // 小方格固定 18px，靠"显示更多周"把热力图铺满卡片宽度（手机 ~14 周、平板封顶 26 周避免溢出）
      const avail = (window.innerWidth || 390) - 56;
      const weeksForWidth = Math.max(3, Math.min(26, Math.floor((avail - 16) / (18 + 4))));
      const startWeeksAgo = Math.max(dataWeeks, weeksForWidth);
      const WEEKS = startWeeksAgo, DAYS = WEEKS * 7;
      // 与「读书」页紫色主题统一：空=浅线，热度=由浅到深的紫色阶（深浅主题自动适配）
      const lvColor = ['var(--line-2)','var(--purple-soft)','color-mix(in srgb, var(--purple) 45%, var(--purple-soft))','color-mix(in srgb, var(--purple) 70%, var(--purple-soft))','var(--purple)'];
      const wdLabel = ['一','二','三','四','五','六','日'];
      const todayKey = today();
      // build 7×WEEKS grid: col 0 = oldest week (LEFT), col WEEKS-1 = newest (RIGHT) — like GitHub
      let grid = [];
      for (let row = 0; row < 7; row++) grid[row] = [];
      let monthLabels = [];
      let lastMonth = -1;
      for (let col = 0; col < WEEKS; col++) {
        for (let row = 0; row < 7; row++) {
          // col 0 → oldest days, col WEEKS-1 → newest days
          const idx = col * 7 + row;
          const offset = DAYS - 1 - idx;
          if (offset < 0) { grid[row].push(''); continue; }
          const d = new Date(); d.setDate(d.getDate() - offset);
          const k = dateStr(d);
          const rec = state.books.log[k];
          let lvl = 0;
          if (rec && rec.done) {
            const m = rec.min || 0;
            lvl = m >= 60 ? 4 : m >= 30 ? 3 : m >= 15 ? 2 : 1;
          }
          if (row === 0 && d.getMonth() !== lastMonth) {
            lastMonth = d.getMonth();
            monthLabels.push({ col, label: (d.getMonth()+1)+'月' });
          }
          const isToday = (k === todayKey);
          const base = `width:18px;height:18px;border-radius:4px;box-sizing:border-box;display:block`;
          const cellStyle = isToday
            ? `${base};background:${lvColor[lvl]};border:1.5px solid var(--purple);box-shadow:0 0 0 2px color-mix(in srgb,var(--purple) 28%, transparent)`
            : `${base};background:${lvColor[lvl]};border:1px solid var(--line)`;
          grid[row].push(`<div title="${k}${isToday?' (今天)':''}${rec&&rec.done?(' · 读 '+rec.min+' 分钟'):''}" style="${cellStyle}"></div>`);
        }
      }
      // month label row (aligned above their columns)
      let mlCells = '';
      for (let c = 0; c < WEEKS; c++) {
        const ml = monthLabels.find(m=>m.col===c);
        mlCells += `<div style="font-size:10px;color:var(--muted);text-align:left;padding-left:1px;overflow:hidden;white-space:nowrap">${ml?ml.label:''}</div>`;
      }
      // body rows with weekday labels on the left
      const rowsHtml = grid.map((cells, ri) =>
        `<div style="display:flex;align-items:center;gap:4px"><span style="width:16px;font-size:10px;color:var(--muted);text-align:right;flex-shrink:0;line-height:1">${wdLabel[ri]}</span><div style="display:grid;grid-template-columns:repeat(${WEEKS},18px);gap:4px">${cells.join('')}</div></div>`
      ).join('');
      return `<div style="width:fit-content;margin:0 auto"><div>${rowsHtml}</div>${mlCells?`<div style="display:grid;grid-template-columns:repeat(${WEEKS},18px);gap:4px;margin-top:6px;margin-left:20px">${mlCells}</div>`:''}<div style="font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px"><span style="width:13px;height:13px;border-radius:3px;background:var(--line-2);border:1.5px solid var(--purple);display:inline-block"></span> 紫框 = 今天（${todayKey}）</div></div>`;
    }
    function bookGoalRing() {
      const total = state.books.goal.yearTarget || 24;
      const done = bookYearDone();
      const pct = Math.min(100, Math.round(done / total * 100));
      return `<div style="display:flex;align-items:center;gap:14px;margin-top:6px">
        <div style="width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--green) ${pct * 3.6}deg, var(--line-2) 0);display:grid;place-items:center;flex-shrink:0">
          <div style="width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center">

      </div>`;
    }
    function bookShelfCard(b) {
      const statusLabel = { want: '想读', reading: '在读', done: '读完' }[b.status];
      const initial = b.title.replace(/[《》]/g,'').slice(0,1);

          <div class="br-actions">

            ${b.status !== 'want' ? `<button class="btn sm outline" data-action="book-status" data-id="${b.id}" data-s="want" style="padding:4px 9px;font-size:12px">↩ 想读</button>` : ''}
            ${b.status !== 'reading' ? `<button class="btn sm ${b.status === 'want' && !(b.builtin||b.text) ? 'grad purple' : 'outline'}" data-action="book-status" data-id="${b.id}" data-s="reading" style="padding:4px 9px;font-size:12px">📖 在读</button>` : ''}
            ${b.status !== 'done' ? `<button class="btn sm outline" data-action="book-status" data-id="${b.id}" data-s="done" style="padding:4px 9px;font-size:12px">✓ 读完</button>` : `<span class="tag purple" style="font-size:11px;align-self:center">✓ 已读完</span>`}
          </div>
        </div>
      </div>`;
    }

    // ===================== 读书 · 内置阅读器 =====================
    let _reader = null;
    let _readerFont = 17;
    function bookItemParas(it){
      if (it && it.builtin && window.BUILTIN_BOOKS){
        const b = window.BUILTIN_BOOKS.find(x=>x.id===it.builtin);
        if (b && b.paras) return b.paras;
        // 元数据在但正文未加载（books-data.js 覆盖加载时补 paras）
      }
      if (it && it.text){
        return it.text.split(/\n{1,}/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
      }
      return [];
    }
    function bookItemMeta(it){
      if (it && it.builtin && window.BUILTIN_BOOKS){
        const b = window.BUILTIN_BOOKS.find(x=>x.id===it.builtin);
        if (b) return { title: b.title, author: b.author, year: b.year };
      }
      return { title: it.title, author: it.author||'佚名', year: it.year||'' };
    }
    function finalizeReader(){
      if (!_reader) return;
      try { clearInterval(_reader.timer); } catch(e){}
      const mins = Math.min(240, Math.max(1, Math.round((Date.now()-_reader.start)/60000)));
      const log = state.books.log[today()];
      if (log){ log.done = true; log.min = Math.min(600, (log.min||0) + mins); }
      save();
      _reader = null;
    }
    function scrollReaderTo(off){
      const sc = $('readerScroll'); if (!sc || !_reader) return;
      let acc = 0, target = 0;
      for (let i=0;i<_reader.paras.length;i++){
        if (acc >= off){ target = i; break; }
        acc += _reader.paras[i].length + 1;
      }

    function currentReaderOffset(){
      const sc = $('readerScroll'); if (!sc || !_reader) return _reader ? (_reader.item.pos||0) : 0;
      const cont = sc.getBoundingClientRect();
      const ps = sc.querySelectorAll('p[data-pi]');
      let cur = 0;
      for (let i=0;i<ps.length;i++){ if (ps[i].getBoundingClientRect().top - cont.top <= 30) cur = i; else break; }
      let off = 0;
      for (let i=0;i<cur;i++) off += _reader.paras[i].length + 1;
      const rp = ps[cur].getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (cont.top + 30 - rp.top) / (rp.height || 1)));
      off += Math.round(_reader.paras[cur].length * frac);
      return off;
    }

      _reader.item.progress = pct;
      const bar = $('readerBar'), lbl = $('readerPct');

    // EPUB reader: unzip → find content documents → extract text
    async function readEpubText(file){
      try {
        const ab = await file.arrayBuffer();
        const ds = new DecompressionStream('inflate');
        // manual ZIP parse for EPUB
        const view = new DataView(ab);
        const str = (o,l)=>String.fromCharCode(...new Uint8Array(ab,o,l));
        // find EOCD
        let eocd = ab.byteLength - 22;
        while(eocd>=0 && view.getUint32(eocd)!==0x06054b50) eocd--;
        if(eocd<0) throw new Error('无效 EPUB 文件');
        const cdOffset = view.getUint32(eocd+16,true);
        const cdSize = view.getUint32(eocd+12,true);
        const cdCount = view.getUint16(eocd+10,true);
        let entries=[];
        let off=cdOffset;
        for(let i=0;i<cdCount&&off<ab.byteLength;i++){
          if(view.getUint32(off)!==0x02014b50) break;
          const meth=view.getUint16(off+10,true);
          const csize=view.getUint32(off+20,true);
          const usize=view.getUint32(off+24,true);
          const nlen=view.getUint16(off+28,true);
          const elen=view.getUint16(off+30,true);
          const clen=view.getUint16(off+32,true);
          const name=str(off+46,nlen);
          const loff=view.getUint32(off+42,true);
          entries.push({name,meth,csize,usize,loff,nlen,elen});
          off+=46+nlen+elen+clen;
        }
        const htmlEntries=entries.filter(e=>e.name.match(/\.x?html?$/i)&&!e.name.includes('toc.')&&!e.name.includes('ncx'));
        htmlEntries.sort((a,b)=>a.name.localeCompare(b.name));
        let texts=[];
        for(const e of htmlEntries.slice(0,200)){
          try{
            const d=new DataView(ab,e.loff,e.csize);
            if(e.meth===0||e.meth===8){
              const comp=new Uint8Array(ab,e.loff,e.csize);
              let decomp;
              if(e.meth===8 &&typeof DecompressionStream!=='undefined'){
                const blob=new Blob([comp],{type:'application/octet-stream'});
                decomp=await blob.stream().pipeThrough(new DecompressionStream('inflate')).toArrayBuffer();
              } else { decomp=comp.buffer; }
              const dec=new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(decomp));
              texts.push(dec.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());
            }
          }catch(_){}
        }
        return texts.join('\n\n').slice(0,500000)||'';
      } catch(e){ throw new Error('EPUB 解析失败（'+e.message+'），请尝试导出为 .txt 后再导入'); }
    }
    async function readPdfText(file){
      try {
        const ab = await file.arrayBuffer();
        const text = await new Promise((resolve)=>{
          const workerCode = `
            self.onmessage=function(e){
              const v=new DataView(e.data);
              let out='',pos=0,end=e.data.byteLength;
              while(pos<end){
                if(v.getUint8(pos)===0x28&&v.getUint8(pos+1)===0x66&&v.getUint8(pos+2)===0x6A){
                  pos+=3;const len=v.getUint32(pos);pos+=4;
                  const s=String.fromCharCode(...new Uint8Array(e.data,pos,len));out+=s+' ';pos+=len;
                }else{pos++;}
              }
              self.postMessage(out);
            };`;
          try{
            const blob=new Blob([workerCode],{type:'application/javascript'});
            const w=new Worker(URL.createObjectURL(blob));
            w.onmessage=e=>resolve(e.data||'');
            w.onerror=()=>resolve('');
            w.postMessage(ab);
            setTimeout(()=>{w.terminate();resolve('');},8000);
          } catch(_){ resolve(''); }
        });
        return text.replace(/\s+/g,' ').trim().slice(0,500000)||'';
      } catch(_){ throw new Error('PDF 提取受限，建议用在线工具转为 .txt 后导入，或直接粘贴正文'); }
    }
    async function readDocxText(file){
      try {
        const ab = await file.arrayBuffer();
        const v=new DataView(ab);
        const str=(o,l)=>String.fromCharCode(...new Uint8Array(ab,o,l));
        let eocd=ab.byteLength-22;
        while(eocd>=0&&v.getUint32(eocd)!==0x06054b50) eocd--;
        if(eocd<0) throw new Error('');
        const cdOff=v.getUint32(eocd+16,true),cdSz=v.getUint32(eocd+12,true),cnt=v.getUint16(eocd+10,true);
        let off=cdOff;
        for(let i=0;i<cnt&&off<ab.byteLength;i++){
          if(v.getUint32(off)!==0x02014b50) break;
          const name=str(off+46,v.getUint16(off+28,true));
          const loff=v.getUint32(off+42,true),csize=v.getUint32(off+20,true);
          if(name.endsWith('document.xml')){
            const dec=new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(ab,loff,csize));
            return dec.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,500000);
          }
          off+=46+v.getUint16(off+28,true)+v.getUint16(off+30,true)+v.getUint16(off+32,true);
        }
        return '';
      } catch(_){ throw new Error('DOCX 解析失败，请尝试另存为 .txt 或复制正文后粘贴'); }
    }

        const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=title,author_name,first_publish_year,cover_i,key,ia`, { cache: 'no-cache' });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d = await r.json();
        return d.docs || [];

        toast('Open Library 不可用,已切换为离线兜底书单');
        return OFFLINE_BOOKS.filter(b => b.t.includes(q) || b.a.includes(q) || q === '经典').slice(0, 12);

    // ===================== 拍摄计划 =====================
    function renderShoot() {
      // 防御性初始化（结构变更时重新播种，兼容旧数据）
      if (!Array.isArray(state.shoot) || !(state.shoot[0] && 'week' in state.shoot[0])) {
        state.shoot = SHOOT_PLAN.map((s,i)=>({ id:'s'+i, ...s, done:false })); save();
      }
      if (!Array.isArray(state.shootDaily) || state.shootDaily.length !== SHOOT_DAILY.length) {
        state.shootDaily = SHOOT_DAILY.map((s,i)=>({ id:'d'+i, ...s, done:false })); save();
      }
      const total = state.shoot.length;
      const done = state.shoot.filter(s=>s.done).length;
      const dTotal = state.shootDaily.length;
      const dDone = state.shootDaily.filter(s=>s.done).length;
      const weeks = SHOOT_WEEKS.map(w => ({ wk:w.wk, items: state.shoot.filter(s => s.week === w.wk) }));
      // 每日分解的周名从 SHOOT_WEEKS / 数据本身推导，避免与计划文案脱节
      const dailyWeeks = [];
      state.shootDaily.forEach(s => { if (s.wk && dailyWeeks.indexOf(s.wk) < 0) dailyWeeks.push(s.wk); });
      const dOrder = SHOOT_WEEKS.map(w => w.wk).filter(wk => dailyWeeks.indexOf(wk) >= 0)
        .concat(dailyWeeks.filter(wk => SHOOT_WEEKS.every(w => w.wk !== wk)));
      const allTotal = total + dTotal, allDone = done + dDone;
      const sRate = allTotal ? Math.round(allDone / allTotal * 100) : 0;
      // 本周聚焦：第一个还有未完成每日任务的周
      let focusWk = null, focusItems = [];
      for (const wk of dOrder) {
        const un = state.shootDaily.filter(s => s.wk === wk && !s.done);
        if (un.length) { focusWk = wk; focusItems = un.slice(0, 3); break; }
      }
      const shootRow = (s, act) => `<div class="item ${s.done?'done':''}">
        <div class="check" data-action="${act}" data-id="${s.id}" role="checkbox" aria-checked="${s.done}" aria-label="${s.t}">${s.done?'✓':''}</div>
        <div class="item-body"><div class="item-title">${s.t}</div><div class="item-desc">${s.d}</div>
          <span class="tag teal">${s.tag}</span></div></div>`;
      const weekFold = (title, items, act, openIt) => {
        const dn = items.filter(s=>s.done).length;
        const pc = items.length ? Math.round(dn/items.length*100) : 0;
        return `<details class="fold"${openIt?' open':''}>
          <summary><span>${title}</span><span class="st-count">${dn}/${items.length}</span></summary>
          <div class="progress teal" style="margin:6px 0 2px"><span style="width:${pc}%"></span></div>
          ${items.map(s=>shootRow(s,act)).join('')}
        </details>`;
      };
      let mOpen = true, dOpen = true;
      $('main').innerHTML = `
        <div class="hero">
          <div class="hero-greet">
            <div class="hero-hi">📷 已完成 <b>${allDone}</b> / ${allTotal} 项</div>
            <div class="hero-date">iPhone 15 Pro + 富士 X-M5 · 每天 5–15 分钟</div>
          </div>
          <div class="hero-ring" style="--p:${sRate}" role="img" aria-label="拍摄计划完成率 ${sRate}%"><span>${sRate}%</span></div>
          <div class="hero-line">主线任务 <b>${done}/${total}</b> · 每日分解 <b>${dDone}/${dTotal}</b></div>
        </div>

        <div class="section-title" data-c="teal" style="margin-top:14px">本周聚焦<span class="st-count">${focusWk ? focusWk.split(' · ')[0] : '已完成'}</span></div>
        <div class="card tint tint-teal soft-teal">
          ${focusWk ? `
            <div class="card-title" style="margin:0 0 2px">🎯 ${focusWk}</div>
            <div class="card-sub" style="margin-bottom:6px">接下来这几件，随手就能练：</div>
            ${focusItems.map(s=>shootRow(s,'shoot-daily-done')).join('')}

    function renderBill() {

                <div class="budget-side-row">
                  <span class="side-label">已用预算</span>
                  <span class="side-value ${over?'over-num':overForecast?'warn-text':''}">${budgetPct}%</span>
                </div>
              </div>
            </div>
            <div class="budget-bar-wrap">
              <div class="budget-bar-bg"><div class="budget-bar-fill ${over?'over':overForecast?'warn':''}" style="width:${budgetPct}%"></div></div>

        <div class="section-title" data-c="green">快速记账</div>

          <div class="card-sub" style="margin:0 0 10px">3 秒记一笔 · 先选收支，再填金额</div>

          </div>
        </div>

        <div class="section-title">本月流水<span class="st-count">${flows.length} 笔</span></div>

    }
    // ===================== 益智游戏（新版） =====================
    const GAME_DIFF_LABEL = { easy:'简单', medium:'中等', hard:'困难' };
    function gameDiff() { return (state.gameDiff && GAME_DIFF_LABEL[state.gameDiff]) ? state.gameDiff : 'easy'; }

    function renderGame() {
      if (sudokuState && sudokuState._t) clearInterval(sudokuState._t);
      if (crosswordState && crosswordState._t) clearInterval(crosswordState._t);
      if (!state.gameHistory || typeof state.gameHistory !== 'object') { state.gameHistory = {}; save(); }
      if (!state.gameDiff) state.gameDiff='easy';
      if (!gameType) gameType = dailyGameType();
      const names={memory:'🃏 记忆翻牌', guess:'🔢 猜数字', sudoku:'🔢 数独', crossword:'📝 英文填字'};
      const todayKey = today();

      const diff = state.gameDiff;
      const gCount = Object.keys(his).length;
      $('main').innerHTML = `
        <div class="hero">
          <div class="hero-greet">

          <button role="tab" aria-selected="${gameType==='memory'}" class="${gameType==='memory'?'active':''}" data-action="gtype" data-t="memory">🃏 记忆翻牌</button>

          <button role="tab" aria-selected="${gameType==='sudoku'}" class="${gameType==='sudoku'?'active':''}" data-action="gtype" data-t="sudoku">🧩 数独</button>
          <button role="tab" aria-selected="${gameType==='crossword'}" class="${gameType==='crossword'?'active':''}" data-action="gtype" data-t="crossword">📝 英文填字</button>

            <button class="diff-pill ${diff==='medium'?'on':''}" role="tab" aria-selected="${diff==='medium'}" data-action="gdiff" data-d="medium">中等</button>
            <button class="diff-pill ${diff==='hard'?'on':''}" role="tab" aria-selected="${diff==='hard'}" data-action="gdiff" data-d="hard">困难</button>

        </div>
        <div class="card" id="gameArea"></div>
        <div class="section-title" data-c="green">今日战绩<span class="st-count">${gCount}</span></div>
        <div class="card">${gCount
          ? Object.entries(his).map(([k,v])=>`<div class="item" style="padding:8px 0"><span class="tag green" style="margin-right:8px">${k}</span>${v}</div>`).join('')
          : '<div class="empty-box"><div class="eb-ic">🎲</div><div class="eb-t">今天还没玩过</div><div class="card-sub">挑一个上面的游戏，5 分钟换换脑子</div></div>'}</div>`;
      renderGameArea();
    }
    function logGame(name, result){ const k=today(); (state.gameHistory[k]=state.gameHistory[k]||{})[name]=result; save(); }
    function renderGameArea() {
      const area = $('gameArea'); if(!area) return;
      if (gameType==='memory') return renderMemory(area);
      if (gameType==='guess') return renderGuess(area);
      if (gameType==='sudoku') return renderSudoku(area);
      if (gameType==='crossword') return renderCrossword(area);
    }
    function renderMemory(area){
      const pairs = { easy:6, medium:8, hard:10 }[gameDiff()];
      const pool = ['🍎','🎹','🏊','🌟','📚','🍊','🌸','🐱','⚽','🍔','🌈','🚀','🎁','⭐','🐶','🍉','🌻','🍇'];
      const emo = pool.slice(0, pairs);
      let cards = emo.concat(emo).map((e,i)=>({e,i})).sort(()=>Math.random()-0.5);
      let flipped=[], matched=0, lock=false;
      area.innerHTML = `<div class="game-board" style="grid-template-columns:repeat(${pairs<=6?3:4},1fr)">${cards.map(c=>`<div class="cell" data-e="${c.e}">？</div>`).join('')}</div><p class="muted" style="font-size:13px;text-align:center" id="mstat">点击翻开两张配对（共 ${emo.length} 对）</p>`;
      area.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{
        if(lock||c.classList.contains('flip')||flipped.length===2) return;
        c.classList.add('flip'); c.textContent=c.dataset.e; flipped.push(c);
        if(flipped.length===2){ lock=true; if(flipped[0].dataset.e===flipped[1].dataset.e){ matched++; flipped=[]; lock=false; if(matched===emo.length){ $('mstat').textContent='🎉 全部配对完成！'; logGame('记忆翻牌','完成'); } } else { setTimeout(()=>{ flipped.forEach(x=>{x.classList.remove('flip');x.textContent='？';}); flipped=[]; lock=false; },700); } }
      });
    }
    function renderGuess(area){
      const cfg = { easy:{max:50,tries:7}, medium:{max:100,tries:8}, hard:{max:200,tries:10} }[gameDiff()];
      const target = Math.floor(Math.random()*cfg.max)+1; let tries=0;
      area.innerHTML = `<p class="muted" style="font-size:13px;margin-bottom:8px">我想好了一个 1-${cfg.max} 的数字，在 ${cfg.tries} 次内猜中它。</p>
        <div class="row"><input class="input" id="gnum" type="number" placeholder="你的猜测" style="flex:1"/><button class="btn" id="gbtn">猜</button></div>
        <p id="gmsg" class="muted" style="font-size:13px;margin-top:8px"></p>`;
      $('gbtn').onclick=()=>{ const v=+$('gnum').value; if(!v)return; tries++;
        if(v===target){ $('gmsg').textContent=`🎉 猜对了！用了 ${tries} 次`; logGame('猜数字',`${tries}次猜中(${GAME_DIFF_LABEL[gameDiff()]})`); }
        else { $('gmsg').textContent = v>target?'大了 ↓':'小了 ↑'; if(tries>=cfg.tries){ $('gmsg').textContent=`次数用完，答案是 ${target}`; logGame('猜数字','未猜中'); } }
      };
    }

    // ---------- 数独 ----------
    let sudokuState=null;
    function sgOk(b,r,c,n){ for(let i=0;i<9;i++){ if(b[r][i]===n||b[i][c]===n) return false; } const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3; for(let i=0;i<3;i++)for(let j=0;j<3;j++) if(b[br+i][bc+j]===n) return false; return true; }
    function sgSolve(b){ for(let r=0;r<9;r++)for(let c=0;c<9;c++){ if(b[r][c]===0){ const ns=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5); for(const n of ns){ if(sgOk(b,r,c,n)){ b[r][c]=n; if(sgSolve(b)) return true; b[r][c]=0; } } return false; } } return true; }

    function sgGenerate(diff){ const givens={easy:42,medium:34,hard:28}[diff]; const sol=Array.from({length:9},()=>Array(9).fill(0)); sgSolve(sol); const pz=sol.map(r=>r.slice()); const cells=[]; for(let i=0;i<81;i++) cells.push(i); cells.sort(()=>Math.random()-0.5); let removed=0; const target=81-givens; for(let i=0;i<cells.length && removed<target;i++){ const r=Math.floor(cells[i]/9), c=cells[i]%9; if(pz[r][c]===0) continue; const bak=pz[r][c]; pz[r][c]=0; if(sgCount(pz.map(x=>x.slice()),2)!==1){ pz[r][c]=bak; } else removed++; } return { pz, sol }; }

    // 本地压缩图片：缩到最长边 ≤ maxDim，转 JPEG(0.82)，避免 localStorage 配额被原始照片撑爆
    function diaryCompressImg(file, maxDim, cb) {
      if (!file || !/^image\//.test(file.type)) { cb(null); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            let { width, height } = img;
            const scale = Math.min(1, maxDim / Math.max(width, height));
            const w = Math.max(1, Math.round(width * scale)), h = Math.max(1, Math.round(height * scale));
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            cb(cv.toDataURL('image/jpeg', 0.82));
          } catch (_) { cb(null); }
        };
        img.onerror = () => cb(null);
        img.src = reader.result;
      };
      reader.onerror = () => cb(null);
      reader.readAsDataURL(file);
    }

        }
        case 'toggle-task': { const g=t.dataset.g,id=t.dataset.id; const it=state.daily[g].find(x=>x.id===id);
          if(it){ it.done=!it.done; save(); currentView==='home'?renderHome():renderDaily(); } break; }
        case 'del-task': { const g=t.dataset.g,id=t.dataset.id;

          renderStudySafe();

        case 'day-sport': { const day=+t.dataset.day; const dn=['一','二','三','四','五','六','日'][day-1]; const opts=SPORTS.map(s=>`<button class="btn sm outline" data-action="set-day-sport" data-day="${day}" data-id="${s.id}" style="margin:4px">${s.icon} ${s.name}</button>`).join('')+`<button class="btn sm outline" data-action="set-day-sport" data-day="${day}" data-id="rest" style="margin:4px">💤 休息</button>`; openModal(`<h3>周${dn} 安排哪个项目？</h3><div style="display:flex;flex-wrap:wrap">${opts}</div><div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button></div>`); break; }

          break;
        }
        case 'save-extra-sport': {
          const id=$('extraSport').value, min=+$('extraMin').value, note=($('extraNote').value||'').trim();
          if(!min||min<=0){ toast('请输入有效的时长'); break; }

          // 同一项目追加合并
          const prev = state.sport.log[today()][id];
          if (typeof prev==='object'&&prev) { prev.min=(prev.min||0)+min; if(note) prev.note=(prev.note?prev.note+' · ':'')+note; prev.ts=Date.now(); }

          save(); const sp=SPORTS.find(s=>s.id===id); toast(`✅ 已补记 ${sp.icon} ${min}分钟${note?' · '+note:''}`);

        }
        case 'muscle-tab': { setMuscleView(t.dataset.side); break; }
        case 'sport-tabs': { state._sportTab = t.dataset.stab; renderSport(); break; }
        case 'heat-muscle': { const id=t.dataset.id; highlightMuscle(id); updateMuscleInfo(id); break; }
        case 'add-set': { const ei=t.dataset.ei; const row=document.getElementById('setInput'+ei); const btn=document.getElementById('addBtn'+ei); if(row){ row.style.display='flex'; btn.style.display='none'; setTimeout(()=>{ const inp=document.getElementById('setR'+ei); if(inp) inp.focus(); },50);} break; }
        case 'cancel-set': { const ei=t.dataset.ei; const row=document.getElementById('setInput'+ei); const btn=document.getElementById('addBtn'+ei); if(row){ row.style.display='none'; btn.style.display=''; } break; }
        case 'save-set': { const sid=t.dataset.sid, ex=decodeURIComponent(t.dataset.ex), ei=t.dataset.ei; const w=+document.getElementById('setW'+ei).value, r=+document.getElementById('setR'+ei).value; if(!w||w<=0||!r||r<=0){ toast('请输入有效的重量和次数'); break; } saveSet(today(), sid, ex, w, r); toast(`✅ ${ex}: ${w}kg×${r} 已记录`); renderSport(); break; }
        case 'save-profile': { state.health.profile.height=$('hHeight').value; state.health.profile.goalWeight=$('hGoal').value; save(); toast('已保存基础数据'); break; }
        case 'save-record': { const d=today(); state.health.records[d]={ sleep:$('recSleep').value, weight:$('recWeight').value, mood:+$('recMood').value, exercise:$('recEx').value, note:$('recNote').value, bedtime:$('recBedtime').value, wake:$('recWake').value, quality:+$('recQuality').value||0, awake:+$('recAwake').value||0 }; save(); toast('✅ 今日健康记录已保存'); break; }
        case 'save-topic': { const tt=t.dataset.t; if(state.topicSaved.includes(tt)) state.topicSaved=state.topicSaved.filter(x=>x!==tt); else state.topicSaved.push(tt); save(); renderTopic(); break; }
        case 'add-topic': {

          if (itemsEl) itemsEl.innerHTML = items.map((it,i) => `<div class="video-card" style="background:var(--bg)">

              <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center">
                <span class="tag gray">🔥 ${(it.hot/10000).toFixed(0)} 万</span>
                <a href="${esc(it.url)}" data-action="open-link" data-url="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:12px;text-decoration:none">查看 →</a>
                <button class="btn sm ${(state.topicSaved||[]).includes(it.title)?'outline':'grad pink'}" data-action="save-topic" data-t="${esc(it.title)}" style="padding:3px 10px;font-size:12px">${(state.topicSaved||[]).includes(it.title)?'★ 已存':'⭐ 存灵感'}</button>

          }

        case 'check-trans': {
          const i = +t.dataset.i;
          const data = JSON.parse(decodeURIComponent(t.dataset.key));
          const userInput = document.getElementById('ti'+i).value.trim();
          const ans = data.answer.replace(/[.!?。！？,，;；]+$/g,'').replace(/\s+/g,' ').trim().toLowerCase();
          const ua = userInput.replace(/[.!?。！？,，;；]+$/g,'').replace(/\s+/g,' ').trim().toLowerCase();
          const result = document.getElementById('tres'+i);
          if (!userInput) { result.innerHTML = '<span style="color:var(--red-ink)">请先输入翻译</span>'; break; }
          // 智能核对：完全一致或 80% 相似算正确
          const exact = ua === ans;
          const sim = (function(a, b){
            if (a === b) return 1;
            const setA = new Set(a.split(/\s+/)); const setB = new Set(b.split(/\s+/));
            const inter = [...setA].filter(x => setB.has(x)).length;
            return inter / Math.max(setA.size, setB.size);
          })(ua, ans);
          if (exact || sim >= 0.8) {

          // 跳外部链接（抖音/小红书/B站/豆瓣等）
          // 关键修复：PWA standalone 下不能用 window.location.href 替换整个页面，
          // 否则页面栈被替换、丢失返回按钮，且抖音/小红书 webview 会白屏拦截。
          // 正确做法：始终用新窗口打开，并保留 PWA 自身页面（可返回）。
          const url = t.dataset.url;
          if (!url) break;
          openExternal(url);
          break;
        }
        case 'open-platform': {
          const u = t.dataset.u;
          if (u) window.location.href = u;
          break;
        }
        case 'open-avatar': openAvatarModal(); break;
        case 'pick-avatar': {
          const k = t.dataset.k;
          if (k && AVATARS[k]) {
            state.avatar = k;
            save();
            renderDrawerAvatar();
            closeAvatarModal();
            closeDrawer(); // 自动关闭抽屉,避免头像被 modal 半透明遮罩"压"住
            if (currentView === 'me') renderMe(); // 「我」视图头像即时刷新
            toast(`已切换为${AVATARS[k].name} · 桌面图标需重新添加 PWA 才能同步`);
          }
          break;
        }
        case 'close-avatar': closeAvatarModal(); break;
        // ===== 日记模块（排版小动物） =====
        case 'diary-animal': { diarySel = t.dataset.k; renderDiaryPreview(); break; }
        case 'diary-mood': { diaryMood = t.dataset.m; renderDiaryPreview(); break; }
        case 'diary-save': {
          if (!state.diary) state.diary = { entries: [] };
          const title = ($('dTitle') ? $('dTitle').value : '').trim();
          const body = ($('dBody') ? $('dBody').value : '').trim();
          const date = ($('dDate') ? $('dDate').value : today()) || today();
          if (!title && !body && !diaryPhotos.length) { toast('写点什么再保存吧 🐾'); break; }
          if (diaryEditId) {
            const e = state.diary.entries.find(x => x.id === diaryEditId);
            if (e) { e.date = date; e.title = title; e.body = body; e.animal = diarySel; e.mood = moodEmoji(diaryMood); e.photos = diaryPhotos.slice(); e.ts = Date.now(); }
            diaryEditId = null; diaryPhotos = [];
            save(); toast('已更新这一页 ✏️'); renderDiary();
          } else {
            state.diary.entries.push({ id: uid(), date, title, body, animal: diarySel, mood: moodEmoji(diaryMood), photos: diaryPhotos.slice(), ts: Date.now() });
            diaryPhotos = [];
            save(); toast('已收进纸箱 📦'); renderDiary();
          }
          break;
        }
        case 'diary-del': {
          if (state.diary) state.diary.entries = state.diary.entries.filter(x => x.id !== t.dataset.id);
          save(); renderDiary(); break;
        }
        case 'diary-edit': {
          const e = state.diary && state.diary.entries.find(x => x.id === t.dataset.id);
          if (e) { diaryEditId = e.id; diarySel = e.animal; diaryMood = moodKey(e.mood); renderDiary(); }
          break;
        }
        case 'diary-toggle': {
          const id = t.dataset.id;
          if (diaryOpen.has(id)) diaryOpen.delete(id); else diaryOpen.add(id);
          const det = document.getElementById('ddet-' + id);
          if (det) det.style.display = diaryOpen.has(id) ? 'block' : 'none';
          t.classList.toggle('open', diaryOpen.has(id));
          break;
        }
        case 'diary-expand-all': {
          const entries = (state.diary && state.diary.entries) || [];
          if (diaryOpen.size === entries.length && entries.length) diaryOpen.clear();
          else entries.forEach(e => diaryOpen.add(e.id));
          entries.forEach(e => {
            const det = document.getElementById('ddet-' + e.id);
            const row = document.querySelector('.diary-row[data-id="' + e.id + '"]');
            if (det) det.style.display = diaryOpen.has(e.id) ? 'block' : 'none';
            if (row) row.classList.toggle('open', diaryOpen.has(e.id));
          });
          const btn = document.querySelector('[data-action="diary-expand-all"]');
          if (btn) btn.textContent = (diaryOpen.size === entries.length && entries.length) ? '收起全部' : '展开全部';
          break;
        }
        case 'diary-cancel': { diaryEditId = null; diaryPhotos = []; renderDiary(); break; }
        case 'diary-add-photo': { const fi = $('diaryFile'); if (fi) fi.click(); break; }
        case 'diary-del-photo': { diaryPhotos.splice(+t.dataset.i, 1); renderDiaryThumbs(); break; }
        case 'diary-photo': {
          const e = state.diary && state.diary.entries.find(x => x.id === t.dataset.id);
          const i = +t.dataset.i;
          if (e && e.photos && e.photos[i]) {
            openModal(`<div style="position:relative">
              <button class="icon-btn" data-action="modal-close" style="position:absolute;top:-12px;right:-12px;background:var(--red);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;z-index:2" aria-label="关闭">✕</button>
              <img src="${e.photos[i]}" alt="日记照片" style="width:100%;border-radius:12px;display:block;background:#000" />
            </div>`);
          }
          break;
        }
        case 'modal-close': closeModal(); break;
      }
      } catch(err) {
        console.error('click-handler action error:', err);
        try { toast('该操作未生效：' + (err && err.message ? err.message : err) + '（可刷新页面，或在「更多 → 设置」重置数据）'); } catch(_) {}
      }
    });

    function exportData(){
      const fname = '我的工作台数据-' + new Date().toISOString().slice(0,10) + '.json';
      const text = JSON.stringify(state);
      // 优先：真正下载为文件（桌面 / 安卓 Chrome 可用）
      try {
        const blob = new Blob([text], {type:'application/json'});
        if (window.navigator && navigator.msSaveOrOpenBlob) { navigator.msSaveOrOpenBlob(blob, fname); toast('已导出：'+fname); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(_){} }, 2000);
        toast('已导出：'+fname+'（若未自动下载，可长按链接「存储到文件」）');
        return;
      } catch(e) { /* 落到剪贴板兜底 */ }
      // 兜底：复制到剪贴板（移动端 Safari / 受限环境）
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function(){ toast('已复制数据到剪贴板，可存为 '+fname); },
            function(){ legacyCopy(text); });
          return;
        }
      } catch(_) {}
      legacyCopy(text);
    }
    function legacyCopy(text){
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); toast('已复制数据到剪贴板，可存为 .json 文件'); }
      catch(_) { alert('导出失败：请改用桌面浏览器下载备份'); }
      ta.remove();
    }
    function importData(file){
      if (!file) return;
      const r = new FileReader();
      r.onload = () => { try {
        const s = JSON.parse(r.result);
        if (!s || typeof s !== 'object' || Array.isArray(s)) throw new Error('不是有效的工作台备份');
        if (!confirm('导入会覆盖当前全部数据，确定继续？\n（建议先导出当前数据做好备份）')) return;
        Object.assign(state, defaultState(), s); normalizeState(state); save(); toast('✅ 导入成功，已恢复数据'); navigate(currentView);
      } catch(e){ toast('导入失败：' + (e.message || '文件格式错误')); } };
      r.onerror = () => { toast('读取文件失败，导入取消'); };
      r.readAsText(file);
    }

    function rename(){
      openModal(`<h3>给工作台起个名字</h3>
        <input class="input" id="renameInput" value="${esc(state.wbName||'')}" placeholder="例如：我的成长工作台" aria-label="工作台名称" style="margin:12px 0" />
        <div class="modal-actions"><button class="btn subtle" data-action="modal-close">取消</button><button class="btn grad" data-action="rename-confirm">保存</button></div>`);
      const inp = document.getElementById('renameInput');
      if (inp) { inp.focus(); inp.select(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const b = document.querySelector('[data-action="rename-confirm"]'); if (b) b.click(); } }); }
    }
    function applyRename(){
      const inp = document.getElementById('renameInput');
      const n = inp ? inp.value.trim() : '';
      if (n) { state.wbName = n; save(); const pt = $('pageTitle'); if (pt) pt.textContent = n; const dn = $('drawerName'); if (dn) dn.textContent = n; }
      closeModal();
      if (currentView === 'me') renderMe();
    }

    // 渲染抽屉顶部头像
    function renderDrawerAvatar(){
      const key = state.avatar || 'cat';
      const av = $('drawerAvatar');
      if (av) { av.innerHTML = avatarSVG(key); av.style.background = 'transparent'; }
      const an = $('drawerAvatarName');
      if (an) an.textContent = avatarName(key);
    }
    function openAvatarModal(){
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.id = 'avatarModalMask';
      mask.innerHTML = `
        <div class="modal">
          <h3>选一只小动物陪你</h3>
          <div class="card-sub" style="margin-bottom:14px">点一下切换,会出现在抽屉头像和顶部 banner 上</div>
          <div class="av-picker">
            ${Object.entries(AVATARS).map(([k,v])=>`
              <div class="av-pick ${state.avatar===k?'sel':''}" data-action="pick-avatar" data-k="${k}">
                <div class="av-circle">${v.svg}</div>
                <div class="av-name">${v.name}</div>
              </div>`).join('')}
          </div>
          <div class="modal-actions">
            <button class="btn subtle" data-action="close-avatar">取消</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      mask.addEventListener('click', e => { if (e.target === mask) closeAvatarModal(); });
    }
    function closeAvatarModal(){
      const m = $('avatarModalMask');
      if (m) m.remove();
    }
    $('pageTitle').addEventListener('click', rename);
    $('drawerName').addEventListener('click', rename);

    // ===================== 深色模式（v14 新增：此前样式已写好但无切换入口） =====================
    function applyTheme(mode) {
      const root = document.getElementById('htmlRoot');
      const btn = $('themeBtn');
      if (mode === 'dark') { root.setAttribute('data-theme', 'dark'); if (btn) btn.textContent = '☀️'; }
      else { root.removeAttribute('data-theme'); if (btn) btn.textContent = '🌗'; }
      try { localStorage.setItem('growth-os-theme', mode); } catch (_) {}
    }
    // 首次：优先用 localStorage，否则跟随系统
    (function initTheme() {
      let saved;
      try { saved = localStorage.getItem('growth-os-theme'); } catch (_) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    })();
    if ($('themeBtn')) {
      $('themeBtn').addEventListener('click', () => {
        const isDark = document.getElementById('htmlRoot').getAttribute('data-theme') === 'dark';
        applyTheme(isDark ? 'light' : 'dark');
        toast(isDark ? '已切换到浅色' : '已切换到深色');
      });
    }
    // 跟随系统变化（用户未手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        let saved; try { saved = localStorage.getItem('growth-os-theme'); } catch (_) {}
        if (!saved) applyTheme(e.matches ? 'dark' : 'light');
      });
    }

    // ===================== 初始化 =====================
    installModuleSwitch();
    warmVoices();
    $('menuBtn').addEventListener('click', openDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    $('importFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
    $('topDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
    $('pageTitle').textContent = state.wbName;
    $('drawerName').textContent = state.wbName;
    renderDrawerAvatar();
    // 初始化用户钢琴练习曲目（用默认真实经典曲目填充，之后可自由编辑/添加）
    if (!state.pianoEx) {
      state.pianoEx = {};
      PIANO_STAGES.forEach(s => { state.pianoEx[s.id] = s.ex.map(e => ({ id: uid(), title: e.title, desc: e.desc })); });
      save();
    }
    window.state = state;
    // 启动时拉取今日热点（GitHub Actions 每天自动生成 _data/hotspots.json）
    prefetchHotspots();
    // 启动时根据 URL hash 直接跳到对应模块（修打开 #book 还是首页的 bug）
    const startView = (location.hash || '#home').slice(1);
    navigate(VIEWS[startView] ? startView : 'home');
  </script>
</body>
</html>
