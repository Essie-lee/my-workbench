    --red:#ff6b6f; --gold:#ffc861; --gold-soft:rgba(217,154,28,.18);
    --teal:#34d0e0; --teal-soft:rgba(14,165,183,.18);
    --radius:8px; --radius-sm:6px;
    --shadow:0 2px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.18);
  }
  /* 浅色主题：与主工作台设计令牌保持一致（主色 #3b6fff / 金 #d99a1c） */
  :root.pmod-light{
    --bg:#f3f2f1; --panel:rgba(255,255,255,.72); --panel-2:#faf9f8; --line:#e1dfdd;
    --ink:#201f1e; --muted:#8a8886; --primary:#3b6fff; --primary-2:#2f5fe6;
    --primary-hover:#2f5fe6; --primary-pressed:#2750c9; --primary-soft:#e9f0ff;
    --green:#18a558; --green-soft:#d6f3e6;
    --red:#e5484d; --gold:#d99a1c; --gold-soft:#fbf0d6;
    --teal:#0ea5b7; --teal-soft:#d6f3f6;
    --radius:8px; --radius-sm:6px;
    --shadow:0 2px 4px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  :root.pmod-light body{background:transparent;color:var(--ink)}
  :root.pmod-light .piano-shell{background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 92%,var(--line)));border-color:var(--line)}
  :root.pmod-light .chip.on{background:rgba(59,111,255,.12);border-color:var(--primary);color:var(--primary)}
  :root.pmod-light .btn.ghost.on{background:rgba(59,111,255,.14);border-color:var(--primary);color:var(--primary)}
  :root.pmod-light .stage .std{color:#5a5a5a}
  :root.pmod-light .ex .e{color:#444}
  :root.pmod-light .toast{background:#fff;color:#201f1e;border-color:#e1dfdd;box-shadow:0 8px 30px rgba(0,0,0,.14)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    color:var(--ink); font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; padding:4px 0 16px;
  }
  .wrap{max-width:100%;margin:0}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
  header.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap}

  .card{background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:18px;
    -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
  .card-title{font-weight:600;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .card-sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
  .section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin:20px 6px 10px;display:flex;align-items:center;gap:8px}
  .section-title::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}

  /* 控制条 */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);padding:7px 12px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--primary);color:#fff}
  .btn{background:var(--primary);color:#fff;border:1px solid transparent;border-radius:var(--radius-sm);
    padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.1s;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .btn:hover{background:var(--primary-hover)}
  .btn:active{transform:scale(.98);background:var(--primary-pressed)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s}
  .btn.ghost:hover{background:rgba(127,127,127,.12)}
  .btn.ghost.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .btn.green{background:var(--green)}
  .btn.green:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .slider{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  input[type=range]{accent-color:var(--primary)}

  /* 钢琴 */
  .piano-shell{position:relative;margin-top:14px;padding:14px 12px 12px;border-radius:var(--radius);
    background:linear-gradient(180deg,#23262f,#15171d);border:1px solid var(--line);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .piano-shell::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%)}
  .piano{position:relative;display:flex;height:190px;user-select:none;touch-action:none;min-width:max(100%,520px)}
  .wkey{flex:1;background:linear-gradient(180deg,#fdfdfd,#e9ecf2);border:1px solid #c9ced8;
    border-radius:0 0 7px 7px;margin:0 1px;position:relative;display:flex;flex-direction:column;
    justify-content:flex-end;align-items:center;padding-bottom:8px;cursor:pointer;z-index:1;transition:background .05s}
  .wkey.active{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 28%,#fdfdfd),color-mix(in srgb,var(--primary) 48%,#e9ecf2))}
  .wkey.target{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 22%,#fff),color-mix(in srgb,var(--gold) 48%,#fff8e1))}
  .wkey.targetL{background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 22%,#fff),color-mix(in srgb,var(--teal) 45%,#e0f7f5));box-shadow:inset 0 0 0 2px var(--teal)}
  .bkey{position:absolute;top:0;width:4.2%;height:62%;background:linear-gradient(180deg,#2a2d34,#05070b);
    border:1px solid #000;border-radius:0 0 5px 5px;transform:translateX(-50%);z-index:3;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;transition:background .05s}
  .bkey.active{background:linear-gradient(180deg,var(--primary),var(--primary-pressed))}
  .bkey.target{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 75%,#000),color-mix(in srgb,var(--gold) 50%,#000))}
  .bkey.targetL{background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 65%,#000),color-mix(in srgb,var(--teal) 40%,#000));box-shadow:0 0 12px var(--teal)}
  .nbox.lhand{background:var(--primary-soft);border-color:var(--primary)}
  .klabel{font-size:10px;font-weight:700;color:#5a6172;pointer-events:none}
  .bkey .klabel{color:#cfd4df;font-size:9px}
  .keymap{font-size:9px;color:#babfcb;opacity:.7;margin-top:2px;pointer-events:none}

  /* 跟弹 */
  .song-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .song-tools{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
  .song-select{flex:1;min-width:150px;max-width:340px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;font-family:inherit}
  .song-hint{font-size:12px;color:var(--muted);margin-top:6px}
  .btn.mini{padding:6px 10px;font-size:12px}
  .chip{padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink);font-size:13px;cursor:pointer;transition:.15s}
  .chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
  .chip small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
  .notestrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:34px}
  .nbox{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);transition:.12s}
  .nbox.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .nbox.cur{background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#fff));color:color-mix(in srgb,var(--gold) 55%,#000);border-color:var(--gold);transform:scale(1.12)}
  .nbox.err{animation:shake .3s;border-color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .follow-stat{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
  .fstat{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:8px 14px;text-align:center;min-width:78px}
  .fstat .n{font-size:18px;font-weight:800}
  .fstat .l{font-size:11px;color:var(--muted)}
  .result{margin-top:12px;padding:14px;border-radius:12px;background:var(--primary-soft);border:1px solid var(--primary);display:none}
  .result.show{display:block}
  .stars{font-size:24px;letter-spacing:4px;color:var(--gold)}

  /* 节拍器 */
  .metro{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .beat-dots{display:flex;gap:8px}
  .bdot{width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}
  .bdot.on{background:var(--primary);border-color:var(--primary);box-shadow:0 0 10px var(--primary)}
  .bdot.strong.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}

  /* 阶段/打卡 */
  .progress{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .progress>span{display:block;height:100%;background:var(--primary);border-radius:999px}
  .cal{display:flex;gap:6px;margin-top:10px}
  .cal .day{flex:1;text-align:center}
  .cal .dnum{width:34px;height:34px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
  .cal .day.on .dnum{background:var(--primary);color:#fff;border-color:transparent}
  .cal .dlbl{font-size:10px;color:var(--muted);margin-top:4px}
  .stage{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel-2);margin-bottom:10px}
  .stage.cur{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .stage.locked{opacity:.55}
  .stage .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stage .ttl{font-weight:800;font-size:14.5px}
  .stage .goal{color:var(--muted);font-size:12.5px;margin:6px 0}
  .stage .std{font-size:12.5px;color:var(--ink-3)}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tag.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .ex{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .ex .e{font-size:13px;margin:4px 0;color:var(--ink-3)}
  .ex .e b{color:var(--ink)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2a2f3a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;
    border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:24px;line-height:1.8}
  a{color:var(--primary-2)}
  /* ===== 乐理高亮与卡片 ===== */
  .wkey.lit{background:linear-gradient(180deg,var(--teal-soft),color-mix(in srgb,var(--teal) 45%,var(--teal-soft)));box-shadow:inset 0 0 0 2px var(--teal)}
  .bkey.lit{background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 65%,#000),color-mix(in srgb,var(--teal) 40%,#000));box-shadow:0 0 12px var(--teal)}
  .theory-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  .mini{font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  .note-pill{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;padding:7px 5px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);margin:4px 3px}
  .note-pill b{font-size:15px}
  .note-pill small{font-size:10px;color:var(--muted)}
  .chord-card{display:inline-block;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:4px;cursor:pointer;min-width:84px;transition:.15s}
  .chord-card:hover{border-color:var(--primary)}
  .chord-card b{font-size:14px}
  .chord-card small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
  .opt{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);transition:.15s}
  .opt:hover{border-color:var(--primary)}
  .info{font-size:13px;color:var(--ink-2);margin-top:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;line-height:1.7}
  .info b{color:var(--ink-1)}
  /* 嵌入工作台模式：隐藏独立页面的标题栏和页脚，与主界面融合 */
  header.top{display:none}
  footer{display:none}
  /* 阶段路线图统一由外层「钢琴练习」页渲染（可编辑/增删自定义曲目），
     此处隐藏 iframe 内重复的「进阶路线进度 / 当前阶段 / 全部阶段」，避免重复与不一致 */
  #pmodRoadmap, #pmodCurStage, #pmodAllStage, #curStage, #allStage{display:none !important}

  /* ===================== 日记模块（排版小动物） ===================== */
  .diary-animals{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .diary-chip{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; cursor:pointer; font-size:13px; transition:.15s; text-align:left; }
  .diary-chip:hover{ filter:brightness(.98); transform:translateY(-1px); }
  .diary-chip.on{ box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .diary-list{ display:flex; flex-direction:column; gap:10px; }
  @media (max-width:720px){ .diary-list{ grid-template-columns:1fr; } .diary-animals{ grid-template-columns:1fr; } }
  .diary-entry{ display:flex; flex-direction:column; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>🎹 钢琴练习</h1>
      <div class="sub">真正能弹、能跟练、带节拍器的练习台 · 数据本地保存</div>
    </div>
    <span class="badge" id="todayBadge">今天还没练</span>
  </header>

  <!-- 键盘 + 控制 -->
  <div class="card">
    <div class="card-title">🎹 钢琴键盘</div>
    <div class="card-sub">鼠标点/滑键即响；电脑键盘 A W S E D F T G Y H U J K… 对应琴键。先弹起来，再抠细节。</div>
    <div class="toolbar">
      <div class="seg" id="labelSeg">
        <button data-label="name" class="on">音名 C/D/E</button>
        <button data-label="solfege">唱名 do/re/mi</button>
      </div>
      <div class="slider">音量
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" style="width:90px">
      </div>
      <button class="btn ghost" id="showMapBtn">⌨ 键位</button>
    </div>
    <div class="piano-shell">
      <div class="piano" id="piano"></div>
    </div>
  </div>

  <!-- 跟弹练习 -->
  <div class="card">
    <div class="card-title">🎯 跟弹练习</div>
    <div class="card-sub">选一首，先听「示范」，再点「开始跟弹」照着弹。弹对自动前进，弹完给评测。</div>
    <div class="song-tools">
      <select id="songSelect" class="song-select" aria-label="选择曲目"></select>
      <button class="btn ghost mini" id="songToggle">🎵 全部曲目 (18)</button>
    </div>
    <div class="song-row" id="songRow" style="display:none"></div>
    <div class="song-hint" id="songHint"></div>
    <div class="toolbar">
      <button class="btn ghost" id="demoBtn">▶ 示范</button>
      <button class="btn green" id="followBtn">🎯 开始跟弹</button>
      <button class="btn ghost" id="dualBtn">🤲 双手：关</button>
      <button class="btn ghost" id="resetFollowBtn" style="display:none">↺ 重置</button>
    </div>
    <div class="notestrip" id="notestrip"></div>
    <div class="follow-stat" id="followStat" style="display:none">
      <div class="fstat"><div class="n" id="fsIdx">0/0</div><div class="l">进度</div></div>
      <div class="fstat"><div class="n" id="fsOk">0</div><div class="l">弹对</div></div>
      <div class="fstat"><div class="n" id="fsErr">0</div><div class="l">弹错</div></div>
      <div class="fstat"><div class="n" id="fsTime">0s</div><div class="l">用时</div></div>
    </div>
    <div class="result" id="result"></div>
  </div>

  <!-- 乐理小课堂 -->
  <div class="card">
    <div class="card-title">📚 乐理小课堂</div>
    <div class="card-sub">看懂"为什么这么弹"。点一下，键盘亮起来、声音响起来——学和练在一起。</div>
    <div class="seg" id="theorySeg" style="margin-top:10px">
      <button data-t="scale" class="on">音阶</button>
      <button data-t="chord">和弦</button>
      <button data-t="rhythm">节奏</button>
      <button data-t="staff">识谱</button>
      <button data-t="quiz">小测验</button>
    </div>
    <div id="theoryPanel" style="margin-top:12px"></div>
  </div>

  <!-- 节拍器 -->
  <div class="card">
    <div class="card-title">⏱ 节拍器</div>
    <div class="card-sub">练琴必备。跟着滴答稳住速度，再慢慢提速。</div>
    <div class="metro" style="margin-top:12px">
      <button class="btn" id="metroBtn">▶ 开始</button>
      <div class="slider">速度 <span id="bpmVal">90</span> BPM
        <input type="range" id="bpm" min="40" max="220" value="90" style="width:140px">
      </div>
      <div class="slider">拍号
        <select id="beats" style="background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px">
          <option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="6">6/8</option>
        </select>
      </div>
      <div class="beat-dots" id="beatDots"></div>
    </div>
  </div>

  <!-- 练习计划（嵌入工作台时隐藏：阶段路线图统一由外层页面渲染，避免重复） -->
  <div class="card" id="pmodRoadmap">
    <div class="card-title">🗺 进阶路线</div>
    <div class="card-sub">5 阶段循序渐进；练到「过关标准」点「标记掌握」解锁下一阶段。</div>
    <div class="progress" style="margin-top:10px"><span id="stageProg" style="width:0%"></span></div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:6px" id="stagePct">0% 已掌握</div>
  </div>

  <!-- 手动打卡已移除：与工作台「钢琴练习」页上方的打卡卡片合并，避免重复。跟弹练习仍会自动记时。 -->

  <div class="section-title" id="pmodCurStage">当前阶段</div>
  <div id="curStage"></div>
  <div class="section-title" id="pmodAllStage">全部阶段</div>
  <div id="allStage"></div>

  <footer>
    优化版钢琴练习模块 · 纯前端零依赖，可直接替换原工作台的 <code>renderPiano()</code>。<br>
    音频由 Web Audio 实时合成，无需任何音频文件。数据保存在本浏览器 localStorage。
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 音频引擎 ===================== */
let audioCtx=null, masterGain=null;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext||window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseFloat(document.getElementById('vol').value);
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
// 音名 -> 频率
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteToFreq(note){
  const m = note.match(/^([A-G])(#|b)?(\d)$/);
  let s = SEMI[m[1]]; if(m[2]==='#') s++; else if(m[2]==='b') s--;
  const oct = +m[3];
  const midi = s + (oct+1)*12;          // C4 = 60
  return 440*Math.pow(2,(midi-69)/12);
}
// 钢琴音色：加性和声 + 平滑包络（attack 防爆音，release 自然收尾）
const activeVoices={};
function playNote(freq, dur, vol){
  ensureAudio();
  const D = dur||0.7;
  const V = (vol==null?1:vol);
  const t0 = audioCtx.currentTime;
  const master = audioCtx.createGain(); master.connect(masterGain);
  const peak=0.8*V, sus=peak*0.72;
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.linearRampToValueAtTime(peak, t0+0.008);
  master.gain.linearRampToValueAtTime(sus, t0+0.03);
  if(D>0.12){ master.gain.setValueAtTime(sus, t0+Math.max(0.04,D-0.09)); master.gain.linearRampToValueAtTime(0.0001, t0+D); }
  const partials=[[1,1],[2,0.5],[3,0.26],[4,0.13],[5,0.07],[6,0.035]];
  partials.forEach(p=>{
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=freq*p[0];
    const g=audioCtx.createGain(); g.gain.value=p[1];
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+D+0.05);
  });
}
// 持续音：用户按住时保持延音，松开自然收尾（实现连音 / legato）
function startHold(note){
  ensureAudio();
  const t0=audioCtx.currentTime;
  const master=audioCtx.createGain(); master.connect(masterGain);
  master.gain.setValueAtTime(0.0001,t0);
  master.gain.linearRampToValueAtTime(0.8,t0+0.008);
  master.gain.linearRampToValueAtTime(0.62,t0+0.04);
  const partials=[[1,1],[2,0.5],[3,0.26],[4,0.13],[5,0.07],[6,0.035]];
  const oscs=[];
  partials.forEach(p=>{
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=noteToFreq(note)*p[0];
    const g=audioCtx.createGain(); g.gain.value=p[1];
    o.connect(g); g.connect(master); o.start(t0); oscs.push(o);
  });
  const keys=Object.keys(activeVoices);
  if(keys.length>=14) releaseVoice(keys[0]);   // 复音上限，防卡顿
  activeVoices[note]={master,oscs};
}
function releaseVoice(note){
  const v=activeVoices[note]; if(!v) return;
  const t=audioCtx.currentTime;
  v.master.gain.cancelScheduledValues(t);
  v.master.gain.setValueAtTime(Math.max(0.0001,v.master.gain.value), t);
  v.master.gain.linearRampToValueAtTime(0.0001, t+0.09);
  v.oscs.forEach(o=>{ try{o.stop(t+0.12);}catch(e){} });
  delete activeVoices[note];
}
function noteOffAll(){ Object.keys(activeVoices).forEach(releaseVoice); }

const WHITE_OCTS = [4,5];                 // 生成 C4..B5 + C6
const whiteNotes=[], blackList=[];        // blackList: {note, afterWhiteIdx}
let wi=0;
WHITE_OCTS.forEach(oct=>{ ['C','D','E','F','G','A','B'].forEach(n=>{ whiteNotes.push(n+oct); wi++; }); });

// 黑键：C D F G A 之后有黑键
const blackAfterWhite = {C:1,D:1,F:1,G:1,A:1};
whiteNotes.forEach((n,i)=>{
  const nm=n[0], oct=+n.slice(1);
  if(blackAfterWhite[nm] && i < whiteNotes.length-1) blackList.push({note:nm+'#'+oct, afterIdx:i});
});
const SOLFEGE={C:'do',D:'re',E:'mi',F:'fa',G:'sol',A:'la',B:'si'};
let labelMode='name';

function buildPiano(){
  const piano=document.getElementById('piano'); piano.innerHTML='';
  const w=100/whiteNotes.length;
  whiteNotes.forEach((n,i)=>{
    const k=document.createElement('div'); k.className='wkey'; k.dataset.note=n;
    k.style.flex='1 1 0';
    const lab=labelMode==='name'? n[0] : SOLFEGE[n[0]];
    k.innerHTML=`<span class="klabel">${lab}</span><span class="keymap" data-km="${n}"></span>`;
    piano.appendChild(k);
  });
  blackList.forEach(b=>{
    const k=document.createElement('div'); k.className='bkey'; k.dataset.note=b.note;
    k.style.left=((b.afterIdx+1)*w)+'%';
    const nm=b.note[0], oct=+b.note.slice(2);
    const lab=labelMode==='name'? nm+'#' : SOLFEGE[nm]+'♯';
    k.innerHTML=`<span class="klabel">${lab}</span>`;
    piano.appendChild(k);
  });
  paintKeyMaps(); applyLit();
}
function paintKeyMaps(){
  // 在白键下方标出电脑键盘
  for(const code in KEYMAP){
    const el=document.querySelector(`[data-km="${KEYMAP[code]}"]`);
    if(el) el.textContent=code.toUpperCase();
  }
}

  const el=document.querySelector(`[data-note="${note}"]`);

  el.classList.add(cls||'active');
  setTimeout(()=>el.classList.remove(cls||'active'), 170);
}

/* ===================== 统一发声入口 + 跟弹检测 ===================== */
let follow=null;            // {song,idx,ok,wrong,start,lastErr}
function noteOn(note, source){
  if(source==='user'){ if(!activeVoices[note]) startHold(note); }
  else { playNote(noteToFreq(note), 0.6); }
  flashKey(note,'active');
  if(follow && source!=='demo'){
    let matched=false;
    if(follow.dual){
      if(note===follow.right[follow.idxR]){ follow.idxR++; markNoteBox('nbR'+(follow.idxR-1),'done'); matched=true; }
      else if(note===follow.left[follow.idxL]){ follow.idxL++; markNoteBox('nbL'+(follow.idxL-1),'done'); matched=true; }
    } else {
      if(note===follow.right[follow.idxR]){ follow.idxR++; markNoteBox('nb'+(follow.idxR-1),'done'); matched=true; }
    }
    if(matched){
      follow.ok++;
      const done = follow.dual ? (follow.idxR>=follow.right.length && follow.idxL>=follow.left.length) : follow.idxR>=follow.right.length;
      if(done){ finishFollow(); }
      else { setTarget(); updateFollowStat(); }
    } else {
      follow.wrong++;
      markNoteBox(follow.dual?('nbR'+follow.idxR):('nb'+follow.idxR),'err'); updateFollowStat();
    }
  }
  if(source!=='demo' && window.__staffShow) window.__staffShow(note, true);
}

function noteToMidi(note){
  const m=note.match(/^([A-G])(#|b)?(\d)$/); let s=SEMI[m[1]];
  if(m[2]==='#')s++; else if(m[2]==='b')s--; return s+(+m[3]+1)*12;
}
function midiToNote(midi){
  const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[((midi%12)+12)%12] + (Math.floor(midi/12)-1);
}
function playChord(notes, dur){ notes.forEach(n=>playNote(noteToFreq(n), dur||1.3, 0.7)); }
function playScaleSeq(notes){
  const beat=420; notes.forEach((n,i)=> setTimeout(()=>{ playNote(noteToFreq(n), beat/1000*1.5); flashKey(n,'active'); }, i*beat));
}
const SCALE_STEPS={major:[2,2,1,2,2,2,1], minor:[2,1,2,2,1,2,2]};
function buildScale(root, mode){
  const steps=SCALE_STEPS[mode]; let midi=noteToMidi(root); const res=[midiToNote(midi)];
  for(let i=0;i<7;i++){ midi+=steps[i]; res.push(midiToNote(midi)); } return res;
}
function buildChord(root, type){
  const m=noteToMidi(root);
  if(type==='maj')  return [midiToNote(m), midiToNote(m+4), midiToNote(m+7)];
  if(type==='min')  return [midiToNote(m), midiToNote(m+3), midiToNote(m+7)];
  if(type==='dom7') return [midiToNote(m), midiToNote(m+4), midiToNote(m+7), midiToNote(m+10)];
  return [];
}

const STAFF_NOTES=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];
const POS_CN={0:'第一线',1:'第一间',2:'第二线',3:'第二间',4:'第三线',5:'第三间',6:'第四线',7:'第四间',8:'第五线',
  '-2':'下加一线（中央C）','-1':'下加一间',9:'上加一间',10:'上加一线',11:'上加二间',12:'上加二线'};
const SY=132, SLH=18, SX=380;
function staffY(p){ return SY - p*(SLH/2); }
function staffP(note){ return STAFF_NOTES.indexOf(note)-2; }
function drawStaff(note, hide){
  const dyn=document.getElementById('dynLayer'); if(!dyn) return;
  const p=staffP(note); let led='';
  if(p<=-2){ for(let q=-2;q>=p;q-=2) led+=`<line x1="${SX-24}" y1="${staffY(q)}" x2="${SX+24}" y2="${staffY(q)}" stroke="#cdd3df" stroke-width="2"/>`; }
  if(p>=10){ for(let q=10;q<=p;q+=2) led+=`<line x1="${SX-24}" y1="${staffY(q)}" x2="${SX+24}" y2="${staffY(q)}" stroke="#cdd3df" stroke-width="2"/>`; }
  const head=`<ellipse cx="${SX}" cy="${staffY(p)}" rx="9" ry="6.5" fill="#ffce5c" stroke="#a9791a" stroke-width="1.5"/>`;
  const label=hide?'':`<text x="${SX+30}" y="${staffY(p)+5}" fill="#fff" font-size="15" font-weight="700">${note}</text><text x="${SX+30}" y="${staffY(p)+22}" fill="#9aa3b2" font-size="11">${POS_CN[p]||''}</text>`;
  dyn.innerHTML=led+head+label;
}

function renderStages(){
  const cur=PIANO_STAGES[state.pianoUnlocked-1];

  document.getElementById('stageProg').style.width=(mastered/5*100)+'%';
  document.getElementById('stagePct').textContent=Math.round(mastered/5*100)+'% 已掌握';

  const all=document.getElementById('allStage'); all.innerHTML='';

function stageCard(s,locked){
  const m=state.pianoMastered.includes(s.id);
  const d=document.createElement('div'); d.className='stage'+(s.id===state.pianoUnlocked&&!m?' cur':'')+(locked?' locked':'');
  let html=`<div class="hd"><div class="ttl">${s.title}</div>`;
  if(!locked&&!m) html+=`<button class="btn" data-master="${s.id}">标记掌握</button>`;
  else if(m) html+=`<span class="tag on">✓ 已掌握</span>`;
  else html+=`<span class="tag">🔒 未解锁</span>`;
  html+=`</div><div class="goal">目标：${s.goal}</div><div class="std">过关：${s.standard}</div>`;
  if(!locked){
    html+=`<div class="ex">`+s.ex.map(e=>`<div class="e"><b>${e.title}</b> — ${e.desc}</div>`).join('')+`</div>`;
  }
  d.innerHTML=html;
  const mb=d.querySelector('[data-master]');
  if(mb) mb.onclick=()=>{
    const id=+mb.dataset.master;
    if(!state.pianoMastered.includes(id)) state.pianoMastered.push(id);
    if(state.pianoUnlocked===id && state.pianoUnlocked<5) state.pianoUnlocked++;

/* ===================== iframe 嵌入自适应高度 =====================
   当本页以 <iframe> 形式嵌入到原工作台（essie-lee.github.io）时，
   向父页面上报文档实际高度，父页面据此调整 iframe 高度，避免内容被截断。
   通过 postMessage 通信，无需任何跨域凭证。 */
function postPianoHeight(){
  try{
    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage({ __pianoHeight: h, __pianoSrc: location.pathname }, '*');
  }catch(e){}
}
window.addEventListener('resize', postPianoHeight);
window.addEventListener('load', postPianoHeight);
if(window.parent !== window){
  setTimeout(postPianoHeight, 300);
  setTimeout(postPianoHeight, 1200);
  // 若父页面请求高度，立即回报（用于父页面动态刷新）
  window.addEventListener('message', e=>{
    if(e.data && e.data.__pianoAskHeight) postPianoHeight();
  });
}

  </script>
  <!-- 公版书全文(2.3MB)改为「空闲预加载」，不再阻塞首屏；阅读器打开时若未就绪会按需等待 -->
  <script>
    window.__booksDataReady = false;
    window.__booksDataPromise = null;
    // 公版书全文(2.3MB)改为「IndexedDB 缓存」：首次从 books-data.js 加载并写入 IDB，
    // 之后从 IDB 直接读取并合并到内联元数据，省去每次重新拉取大文件，
    // 且不受 Service Worker 缓存被浏览器回收的影响。
    const BOOKS_IDB_NAME = 'growth-os-books';
    const BOOKS_IDB_VERSION = '2025-08-06'; // 书库内容更新时递增此版本号，触发重新拉取
    const BOOKS_IDB_META = '__meta__';
    function _openBooksDB(){
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window) || !window.indexedDB) { reject(new Error('no-idb')); return; }
        let req;
        try { req = indexedDB.open(BOOKS_IDB_NAME, 1); }
        catch (e) { reject(e); return; }
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('open-failed'));
      });
    }
    function _idbGetAll(db){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('books', 'readonly');
        const req = tx.objectStore('books').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    function _idbPutAll(db, rows){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('books', 'readwrite');
        const store = tx.objectStore('books');
        (rows || []).forEach(r => store.put(r));
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }
    function _idbGetMeta(db){
      return new Promise((resolve) => {
        const tx = db.transaction('books', 'readonly');
        const req = tx.objectStore('books').get(BOOKS_IDB_META);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      });
    }
    function _idbSetMeta(db, val){
      return new Promise((resolve) => {
        const tx = db.transaction('books', 'readwrite');
        tx.objectStore('books').put({ id: BOOKS_IDB_META, value: val });
        tx.oncomplete = () => resolve(true);
      });
    }
    // 把 IDB 里的全文合并回内联元数据（只合并确实带正文的条目）
    function _applyBooksFromIDB(rows){
      const map = {};
      (rows || []).forEach(r => { if (r && r.id && r.id !== BOOKS_IDB_META) map[r.id] = r; });
      let applied = 0;
      window.BUILTIN_BOOKS.forEach(meta => {
        const full = map[meta.id];

      window.__booksDataReady = !!ok;
      try { if (typeof currentView !== 'undefined' && currentView === 'book' && typeof renderBook === 'function') renderBook(); } catch(_){}
    }
    function _fetchBooksScript(){
      return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'books-data.js';
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.body.appendChild(s);
      });
    }
    function _persistBooksToIDB(){
      try {
        if (!(window.BUILTIN_BOOKS && window.BUILTIN_BOOKS.length && window.BUILTIN_BOOKS[0].paras)) return;
        _openBooksDB()
          .then(db => _idbPutAll(db, window.BUILTIN_BOOKS).then(() => _idbSetMeta(db, BOOKS_IDB_VERSION)).then(() => db.close()))
          .catch(() => {});
      } catch(_) {}
    }
    window.ensureBooksData = function () {
      if (window.__booksDataReady) return Promise.resolve(true);
      if (window.__booksDataPromise) return window.__booksDataPromise;
      window.__booksDataPromise = (async () => {
        // 1) 优先从 IndexedDB 读取（无网络、快、持久）
        try {
          const db = await _openBooksDB();
          const ver = await _idbGetMeta(db);
          if (ver === BOOKS_IDB_VERSION) {
            const rows = await _idbGetAll(db);
            db.close();
            const n = _applyBooksFromIDB(rows);
            // 必须全部命中才算就绪，避免个别书缺失导致只读一半
            if (n > 0 && n === window.BUILTIN_BOOKS.length) { _afterBooksReady(true); return true; }
          } else {
            db.close();
          }
        } catch(_) { /* IDB 不可用，回退到网络拉取 */ }
        // 2) 回退：拉取 books-data.js，并写入 IDB 供下次使用
        const ok = await _fetchBooksScript();
        if (ok) _persistBooksToIDB();
        _afterBooksReady(ok);
        return ok;
      })();
      return window.__booksDataPromise;
    };
    // 浏览器空闲时再加载书库，不打断首屏渲染
    const __idle = window.requestIdleCallback || function (cb) { setTimeout(cb, 1500); };
    __idle(() => window.ensureBooksData());

    // 新闻生词高亮：命中单词表的词标蓝，点击弹出释义
    function highlightNews(text, L) {
      if (!L.__vocabReady) {
        const words = [];
        L.__vocabMap = {};
        (L.vocabulary || []).forEach(w => {
          const key = (L.tts === 'en-US') ? w.word.toLowerCase() : w.word;
          L.__vocabMap[key] = w;
          if (!words.includes(w.word)) words.push(w.word);
        });
        words.sort((a, b) => b.length - a.length);
        const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        let pat;
        if (L.tts === 'en-US') {
          pat = '\\b(' + words.map(escRe).join('|') + ')\\b';
          L.__vocabRe = new RegExp(pat, 'gi');
        } else {
          // 韩语/粤语：按子串匹配（词间以空格或标点分隔，命中即标蓝）
          pat = '(' + words.map(escRe).join('|') + ')';
          L.__vocabRe = new RegExp(pat, 'g');
        }
        L.__vocabReady = true;
      }
      return text.replace(L.__vocabRe, (m) => {
        const key = (L.tts === 'en-US') ? m.toLowerCase() : m;
        const w = L.__vocabMap[key];
        if (!w) return m;
        return `<span class="vocab-hl" data-w="${encodeURIComponent(JSON.stringify(w))}">${m}</span>`;
      });

      // 首页模块进度驾驶舱（v15：横向胶囊，一眼看全模块状态，点按直达）

      const totalPiano = (PIANO_STAGES.find(s=>s.id===(state.pianoStage||'s1'))||PIANO_STAGES[0]).ex.length;
      const learnActive = Object.values(state.lang||{}).filter(l=>l && l.level < (LANG[Object.keys(state.lang).find(k=>state.lang[k]===l)]?.plan?.length||99)).length;
      const billFlows = (state.bill && Array.isArray(state.bill.flows)) ? state.bill.flows.filter(f => monthKey(f.date) === monthKey()) : [];
      const billExp = billFlows.filter(f=>f.type==='exp').reduce((s,f)=>s+f.amount,0);
      const pianoToday = !!(state.pianoLog && state.pianoLog[today()]);
      const studyToday = !!(state.studyLog && state.studyLog[today()]);
      const sleepRec = (state.health && state.health.records && state.health.records[today()]) || {};

      const _sportHas = k => { try { const a = state.sport && state.sport.log && state.sport.log[k];

      const sportTodayDone = _sportHas(today());

      // 按「域」分组：成长 → 创作 → 生活 → 休闲，顺序与底部 Tab 一致，降低心智负担
      const dashGroups = [
        { t:'成长', c:'accent', items:[
          { ic:'📚', num: studyToday?'已学 ✓':`${learnActive} 门`, lbl:'学习中心', v:'study', ok: studyToday },

      const dashPill = x => `<div class="dash-pill ${x.ok?'done':''}" data-action="go" data-v="${x.v}" role="button" tabindex="0" aria-label="${x.lbl}">

      const hNow = new Date();

      const hGreet = hHour<5?'夜深了':hHour<11?'早上好':hHour<13?'中午好':hHour<18?'下午好':'晚上好';
      const hDate = hNow.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
      const hRate = r.length?Math.round(done/r.length*100):0;
      const hTip = hRate>=100 ? '今天全部搞定，给自己一个赞 🎉'
        : hRate>=60 ? '进度不错，再冲一把 💪'

        : '从最小的一件事开始吧 🌱';
      const heroHtml = `
        <div class="hero">
          <div class="hero-greet">

          </div>
          <div class="hero-ring" style="--p:${hRate}" role="img" aria-label="今日完成率 ${hRate}%"><span>${hRate}%</span></div>
          <div class="hero-line">先从一件小事开始 🌱 · 钢琴目标 ${mastered}/18 曲 · ${hTip}</div>
        </div>`;
      const doneCount = dashGroups.reduce((n,g)=>n+g.items.filter(i=>i.ok).length,0);
      const totalTrack = dashGroups.reduce((n,g)=>n+g.items.filter(i=>'ok' in i).length,0);
      const dashHtml = renderDash();
      // 今日学习内容一览（v14 新增：从现有数据源聚合，让首页成为真正的"今日一览"）
      const eng = (LANG.english && LANG.english.fullTexts && LANG.english.fullTexts[0]) || null;
      const kor = (LANG.korean && LANG.korean.dialogs && LANG.korean.dialogs[0]) || null;
      const can = (LANG.cantonese && LANG.cantonese.dialogs && LANG.cantonese.dialogs[0]) || null;
      const pianoStage = PIANO_STAGES.find(s => s.id === (state.pianoStage || 's1')) || PIANO_STAGES[0];
      const pianoExs = (state.pianoEx && state.pianoEx[pianoStage.id]) || pianoStage.ex || [];
      const pianoNext = pianoExs.find(e => !state.pianoMastered.includes(e.id)) || pianoExs[0] || null;
      const topicSaved = Array.isArray(state.topicSaved) ? state.topicSaved : [];
      const learnPreview = [
        eng ? { ic:'🇬🇧', tag:'英语', t: eng.title, go:'study' } : null,
        kor ? { ic:'🇰🇷', tag:'韩语', t: kor.title || '今日会话', go:'study' } : null,
        can ? { ic:'🇭🇰', tag:'粤语', t: can.title || '今日会话', go:'study' } : null,
        { ic:'🎹', tag:'钢琴', t:'钢琴练习模块 · 跟弹 + 18 曲库 + 双手模式', go:'piano' },
        { ic:'📷', tag:'拍摄', t:'拍摄计划 · '+(SHOOT_WEEKS[0]?SHOOT_WEEKS[0].wk:'曝光三要素'), go:'shoot' },
        topicSaved[0] ? { ic:'💡', tag:'选题', t: topicSaved[0], go:'topic' } : null
      ].filter(Boolean);
      const learnPreviewHtml = learnPreview.length ? `
        <div class="section-title">今日学习内容</div>
        <div class="card" style="padding:6px">
          ${learnPreview.map(x => `
            <div data-action="go" data-v="${x.go}" style="display:flex;align-items:center;gap:10px;padding:10px 8px;cursor:pointer;border-bottom:1px solid var(--line-2)" class="learn-row">
              <span style="font-size:18px">${x.ic}</span>
              <span style="font-size:11px;color:var(--muted);min-width:30px">${x.tag}</span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink-1)">${esc(x.t)}</span>
              <span style="color:var(--primary);font-size:13px">›</span>
            </div>`).join('')}
        </div>` : '';
      // 今日计划：首屏直接可勾选（"今日快照"——与「每日计划」模块形成 快照 vs 编辑台 的分工，避免重复感）
      const undoneList = [...state.daily.routine.map(i=>({...i,g:'routine'})), ...state.daily.tasks.map(i=>({...i,g:'tasks'}))]
        .filter(i=>!i.done).slice(0,4);
      const planPct = r.length ? Math.round(done / r.length * 100) : 0;
      const planHtml = `

        <div class="card tint">
          ${r.length === 0
            ? `<div class="empty-box"><div class="eb-ic">🌱</div><div class="eb-t">今天还没有安排</div><div>去「每日」加一件小事开始</div></div>`
            : `
          <div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px">
            <div style="flex:1;height:6px;border-radius:4px;background:var(--line-2);overflow:hidden"><div style="height:100%;width:${planPct}%;background:var(--g-primary);border-radius:4px"></div></div>
            <span style="font-size:12px;font-weight:700;color:var(--primary);min-width:40px;text-align:right">${planPct}%</span>
          </div>
          ${undoneList.length

                <div class="item-body"><div class="item-title">${esc(i.title)}</div>
                  <div class="item-desc"><span class="tag ${i.g==='routine'?'primary':'accent'}">${esc(i.tag||'')}</span></div></div>

            : `<div class="empty-box"><div class="eb-ic">🎉</div><div class="eb-t">今日计划全部完成</div><div>休息一下，或者加点新目标</div></div>`}`}
          <button class="btn sm outline block" data-action="go" data-v="daily" style="margin-top:10px">查看全部 / 添加 ›</button>

              ? `<button class="btn sm outline" data-action="go" data-v="book" style="flex:1;justify-content:center" title="今天已读 ✓ 点此继续读书">📖 今日已读 · 去读书</button>`

    }

    // ===================== 今日聚焦 · 最小行动推荐引擎(P12) =====================
    // 基于用户历史打卡数据，每天首页只推荐 1–3 件「最小行动」，
    // 每件都用低压力的小目标口吻（"只需要 10 分钟"），降低启动门槛、提升完成率。
    function renderFocus(){
      const td = today();
      const nKeys = o => (o && typeof o==='object') ? Object.keys(o).length : 0;
      // 各模块历史打卡次数（= 习惯强度，用于排序：核心习惯优先）
      const hist = {
        piano: nKeys(state.pianoLog),
        book:  nKeys(state.books && state.books.log),
        sport: nKeys(state.sport && state.sport.log) + nKeys(state.sport && state.sport.setsLog),
        study: nKeys(state.studyLog),
        diary: (state.diary && Array.isArray(state.diary.entries)) ? state.diary.entries.length : 0,
        health: nKeys(state.health && state.health.records)
      };
      const done = {
        piano: !!(state.pianoLog && state.pianoLog[td]),
        book:  !!(state.books && state.books.log && state.books.log[td]),
        sport: !!(state.sport && ((state.sport.log&&state.sport.log[td])||(state.sport.setsLog&&state.sport.setsLog[td]))),
        study: !!(state.studyLog && state.studyLog[td]),
        diary: !!(state.diary && state.diary.entries && state.diary.entries.some(e=>e.date===td)),
        health: !!(state.health && state.health.records && state.health.records[td])
      };
      const DEF = {
        piano:{ ic:'🎹', t:'练琴 10 分钟', sub:'保持手感，今天只练一小段', v:'piano' },
        book:{  ic:'📖', t:'读 10 分钟书', sub:'翻开上次那本，继续一点点', v:'book' },
        study:{ ic:'📚', t:'学 10 分钟',   sub:'挑一个语种，过一小节',   v:'study' },
        sport:{ ic:'🏊', t:'动 1 组',      sub:'让身体今天醒一下',       v:'sport' },
        diary:{ ic:'📝', t:'写一句日记',   sub:'今天最想记住的一件事',   v:'diary' },
        health:{ic:'😴', t:'记一下睡眠',   sub:'30 秒，留下身体信号',    v:'health' }
      };
      // 候选：历史上用过、且今天还没做的模块
      let cands = Object.keys(DEF).filter(k => hist[k] > 0 && !done[k]).map(k => ({ k, w: hist[k], ...DEF[k] }));
      cands.sort((a,b) => b.w - a.w);
      let body;
      if (cands.length) {
        body = cands.slice(0,3).map(p => `
          <div class="focus-row" data-action="go" data-v="${p.v}" role="button" tabindex="0" aria-label="${esc(p.t)}">
            <span class="focus-ic">${p.ic}</span>
            <span class="focus-main"><span class="focus-t">${p.t}</span><span class="focus-s">${esc(p.sub)}</span></span>
            <span class="focus-go">去做 ›</span>
          </div>`).join('');
      } else if (Object.values(hist).some(Boolean)) {
        // 习惯今天都完成了 → 鼓励型空状态
        const total = Object.values(done).filter(Boolean).length;
        body = `<div class="focus-done">🎉 今天已经完成 <b>${total}</b> 件小事，给自己鼓个掌！<br><span style="opacity:.7">想加点料？挑个模块随意逛逛 →</span></div>`;
      } else {
        // 全新用户：从每日计划第一件未完成开始，或从"加目标"起步
        const first = [...state.daily.routine, ...state.daily.tasks].find(i => !i.done);
        if (first) {
          body = `<div class="focus-row" data-action="go" data-v="daily" data-id="${first.id}" role="button" tabindex="0" aria-label="开始 ${esc(first.title)}">
            <span class="focus-ic">🌱</span>
            <span class="focus-main"><span class="focus-t">${esc(first.title)}</span><span class="focus-s">从一件小事开始，今天只做这一个</span></span>
            <span class="focus-go">去做 ›</span>
          </div>`;
        } else {
          body = `<div class="focus-row" data-action="go" data-v="daily" role="button" tabindex="0" aria-label="添加今日计划">
            <span class="focus-ic">🌱</span>
            <span class="focus-main"><span class="focus-t">挑一个今天的目标</span><span class="focus-s">加一件小事，先动起来</span></span>
            <span class="focus-go">去加 ›</span>
          </div>`;
        }
      }
      return `<div class="section-title" data-c="primary">今日聚焦<span class="st-count">基于你的习惯，今天先做这几件</span></div>
        <div class="card focus-card">${body}</div>`;
    }

    // ===================== 首页「最近使用」(P2: 降低模块入口重复/信息过载) =====================
    const DASH_META = { study:{ic:'📚',lbl:'学习中心'}, piano:{ic:'🎹',lbl:'钢琴练习'}, book:{ic:'📖',lbl:'读书计划'}, topic:{ic:'💡',lbl:'选题灵感'}, shoot:{ic:'📷',lbl:'拍摄计划'}, sport:{ic:'🏊',lbl:'运动计划'}, health:{ic:'❤️',lbl:'健康档案'}, bill:{ic:'💰',lbl:'记账'}, diary:{ic:'🐾',lbl:'我的日记'}, game:{ic:'🎮',lbl:'益智游戏'} };
    const DASH_DEFAULT = ['study','piano','book','topic','shoot','sport','health','bill','diary','game'];
    function recordRecent(v){ const skip={home:1,daily:1}; if(skip[v]) return; try{ let r=Array.isArray(state.recents)?state.recents.slice():[]; r.unshift(v); r=r.filter((x,i)=>r.indexOf(x)===i); if(r.length>8) r=r.slice(0,8); state.recents=r; save(); }catch(_){} }
    function renderDash(){ const order=(Array.isArray(state.recents)&&state.recents.length)?state.recents:DASH_DEFAULT; const pills=order.filter(v=>DASH_META[v]).map(v=>({...DASH_META[v],v}));
      const dashPill=x=>`<div class=\"dash-pill\" data-action=\"go\" data-v=\"${x.v}\" role=\"button\" tabindex=\"0\" aria-label=\"${x.lbl}\"><div class=\"dp-top\"><span>${x.ic}</span><span>${x.lbl}</span></div><div class=\"dp-num\">进入 ›</div></div>`;
      return `<div class=\"section-title\">最近使用<span class=\"st-count\">${pills.length} 个模块 · 点过的会往前排</span></div><div class=\"dash-row\">${pills.map(dashPill).join('')}</div>`; }

    // ===================== 本周回顾(P3: 成长复盘飞轮) =====================
    function renderWeekReview(){
      const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(dateStr(d)); }
      // 只统计真正「按天打卡」的活动（计划是长期共享数组，不能按天算，否则会误判 7 天全完成）
      const MODS = ['study','piano','book','sport','diary'];
      const keyOf = { study:'studyLog', piano:'pianoLog', book:'books.log', sport:'sport', diary:'diary' };
      const isOn = (mod,day)=>{
        if(mod==='study') return !!(state.studyLog && state.studyLog[day]);
        if(mod==='piano') return !!(state.pianoLog && state.pianoLog[day]);
        if(mod==='book')  return !!(state.books && state.books.log && state.books.log[day] && state.books.log[day].done);
        if(mod==='sport') return !!(state.sport && ((state.sport.log&&state.sport.log[day]&&Object.keys(state.sport.log[day]).length)||(state.sport.setsLog&&state.sport.setsLog[day]&&Object.keys(state.sport.setsLog[day]).length)));
        if(mod==='diary') return !!(state.diary && state.diary.entries && state.diary.entries.some(e=>(e.date||'').slice(0,10)===day));
        return false;
      };
      const agg = days.map(day=>({ day, on: MODS.filter(m=>isOn(m,day)) }));
      const act = agg.map(a=>a.on.length);
      const anyActive = act.some(x=>x>0);
      const weekRate = Math.round(act.reduce((s,x)=>s+x,0)/(7*MODS.length)*100);
      const litDays = act.filter(x=>x>0).length;
      const row = (ic,lbl,on) => `<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line-2)"><span style="font-size:16px">${ic}</span><span style="flex:1;font-size:13px;color:var(--ink-2)">${lbl}</span><span style="font-size:12px;color:${on?'var(--green)':'var(--muted)'}">${on?'本周有打卡 ✓':'还没开始'}</span></div>`;
      const rows = [
        row('📚','学习中心', agg.some(a=>a.on.includes('study'))),
        row('🎹','钢琴练习', agg.some(a=>a.on.includes('piano'))),
        row('📖','读书计划', agg.some(a=>a.on.includes('book'))),
        row('🏊','运动计划', agg.some(a=>a.on.includes('sport'))),
        row('🐾','我的日记', agg.some(a=>a.on.includes('diary')))
      ].join('');
      // 今日计划完成情况（单独展示，不计入点亮天数）
      const plan = state.daily && ((state.daily.routine||[]).concat(state.daily.tasks||[]));
      const pDone = plan ? plan.filter(x=>x.done).length : 0, pTotal = plan ? plan.length : 0;
      const planRow = pTotal ? row('✅','今日计划', pDone>0) + `<div style="text-align:right;font-size:12px;color:var(--muted);margin:-4px 2px 4px">今天 ${pDone}/${pTotal} 完成</div>` : '';
      const praise = weekRate>=80?'这一周太稳了，保持节奏 💪' : weekRate>=50?'稳步推进，再多点坚持 ✨' : weekRate>0?'已经开始，明天多做一个小动作 🌱' : '新的一周，从一个小习惯开始吧 🌱';
      return `

`;

    // 新增:三个语言总览

      const sceneHtml = (L.scenes||[]).map(s=>`

      const fullTextHtml = (curLang==='english' && L.fullTexts) ? `

      const vocabHtml = L.vocabulary ? `

      const transHtml = L.translations ? `

      const resHtml = `<div class="sec-body">${L.resources.map(r=>`<div class="res-card" data-action="open-link" data-url="${esc(r.url)}">

      const newsHtml = L.news ? `

              <div class="en">${highlightNews(esc(p.foreign), L)} <button class="icon-btn inline" data-action="speak" data-t="${encodeURIComponent(p.foreign)}" data-l="${L.tts}">🔊</button></div>
              <div class="zh">${esc(p.zh)}</div>

            <button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(n.paras.map(p=>p.foreign).join(' '))}" data-l="${L.tts}" style="margin-top:8px">🔊 朗读全文</button>

        ${L.news?`<details class="lang-sec"><summary><span class="sec-count">${L.news.length} 篇</span>📰 新闻精读 · 当地时政（对标 BBC News）<span class="chev">▶</span></summary>${newsHtml}</details>`:''}

    // ============ 闯关练习（对标多邻国：交互作答 + 即时反馈）============
    let quizState = null;
    function buildQuiz() {
      const L = LANG[curLang || 'english'];
      const pool = [];
      // 单词选择题
      (L.vocabulary||[]).forEach(w => {
        const others = (L.vocabulary||[]).filter(x=>x.word!==w.word).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.meaning);
        if (others.length>=3) pool.push({ type:'word', q:`「${w.word}」是什么意思？`, answer:w.meaning, opts:shuffle([w.meaning,...others]), say:w.word, sayLang:L.tts });
      });
      // 翻译选择题（给出中文，选英文）
      (L.translations||[]).forEach(t => {
        const others = (L.translations||[]).filter(x=>x.answer!==t.answer).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.answer);
        if (others.length>=3) pool.push({ type:'trans', q:`「${t.source}」怎么翻译？`, answer:t.answer, opts:shuffle([t.answer,...others]) });
      });
      pool.sort(()=>Math.random()-0.5);
      return pool.slice(0,5);
    }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function renderStudyQuiz() {
      if (!quizState || quizState.finished) {
        const qs = buildQuiz();
        if (!qs.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无足够练习数据</div></div>'; return; }
        quizState = { qs, idx:0, score:0, chosen:null, finished:false };
      }
      const st = quizState, q = st.qs[st.idx];
      const prog = Math.round((st.idx)/(st.qs.length)*100);
      let body;
      if (st.finished) {
        const pass = st.score>=Math.ceil(st.qs.length*0.6);
        body = `<div class="card" style="text-align:center;padding:24px">
          <div style="font-size:40px">${pass?'🎉':'💪'}</div>
          <div class="card-title" style="justify-content:center">今日闯关完成</div>
          <div style="font-size:28px;font-weight:800;margin:8px 0">${st.score}/${st.qs.length}</div>
          <div class="card-sub">${pass?'很棒，保持连胜！':'再来一次会更熟。'}</div>
          <button class="btn" data-action="quiz-restart" style="margin-top:12px">🔄 再来一组</button>
        </div>`;
      } else {
        body = `<div class="card">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>第 ${st.idx+1}/${st.qs.length} 题</span><span>${st.score} 分</span></div>
          <div style="height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${prog}%;background:var(--g-accent)"></div></div>
          <div style="font-size:16px;font-weight:600;margin-bottom:4px">${esc(q.q)}</div>
          ${q.say?`<button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(q.say)}" data-l="${q.sayLang}" style="margin-bottom:12px">🔊 听发音</button>`:''}
          <div style="display:flex;flex-direction:column;gap:8px">
            ${q.opts.map(o=>`<button class="btn ${st.chosen?(o===q.answer?'sm ok':'sm'):'sm outline'}" data-action="quiz-ans" data-o="${esc(o)}" ${st.chosen?'disabled':''} style="justify-content:flex-start;${st.chosen&&o===q.answer?'background:var(--primary-soft);color:var(--primary);border-color:var(--primary)':''}${st.chosen&&st.chosen===o&&o!==q.answer?'background:var(--red-soft);color:var(--red)':''}">${esc(o)}</button>`).join('')}
          </div>
          ${st.chosen?`<div style="margin-top:12px;font-size:13px;color:${st.chosen===q.answer?'var(--green)':'var(--red)'}">${st.chosen===q.answer?'✅ 答对啦':'❌ 正确答案：'+esc(q.answer)}</div><button class="btn sm" data-action="quiz-next" style="margin-top:8px">${st.idx+1>=st.qs.length?'看结果':'下一题 →'}</button>`:''}
        </div>`;
      }
      $('langBody').innerHTML = body;
    }
    // ============ 单词卡（对标不背单词：语境例句 + 认识/不认识）============
    let flashState = null;
    function renderStudyFlash() {
      const L = LANG[curLang || 'english'];
      const list = (L.vocabulary||[]);
      if (!list.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无单词卡</div></div>'; return; }
      if (!flashState || flashState.done) {
        const done = (state.flashDone[L.name]||[]);
        const remain = list.filter(w=>!done.includes(w.word));
        const pick = (remain.length?remain:list).slice(0,10);
        flashState = { pick, idx:0, flipped:false, done:false };
      }
      const st = flashState, w = st.pick[st.idx];
      if (!w) { $('langBody').innerHTML = '<div class="card"><div class="empty">今日单词已刷完 🎉</div></div>'; return; }
      const fPct = Math.round((st.idx) / st.pick.length * 100);
      $('langBody').innerHTML = `
        <div class="card">
          <div class="flex-between" style="margin-bottom:10px">
            <span class="tag accent">第 ${st.idx+1}/${st.pick.length} 张</span>
            <span class="lbl">${L.flag} ${L.name}</span>
          </div>
          <div class="progress" style="margin-bottom:14px"><span style="width:${fPct}%"></span></div>
          <div class="card-front" data-action="flash-flip" role="button" tabindex="0" aria-label="翻转卡片">
            <div style="font-size:32px;font-weight:800;letter-spacing:-.02em">${esc(w.word)}</div>
            <div style="color:var(--muted);font-size:13px">${esc(w.pron||'')}</div>
