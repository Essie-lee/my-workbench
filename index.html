  <title>我的工作台</title>
  <style>
    /* ===== Fluent 2 + Mica 风 ===== */
    :root {
      /* 中性灰 + 微软蓝 */
      --bg: #f3f2f1;
      --bg-2: #faf9f8;
      --panel: #ffffff;
      --ink-1: #201f1e;
      --ink-2: #424242;
      --ink-3: #605e5c;
      --muted: #8a8886;
      --line-1: #e1dfdd;
      --line-2: #edebe9;
      --line-3: #f3f2f1;

      /* 品牌 */
      --primary: #0078d4;
      --primary-hover: #106ebe;
      --primary-pressed: #005a9e;
      --primary-soft: #deecf9;
      --primary-dark: #005a9e;

      /* 辅助语义色(替代原 accent/blue) */
      --accent: #ca5010;
      --accent-soft: #fff4ce;
      --green: #107c10;
      --green-soft: #dff6dd;
      --purple: #5c2d91;
      --purple-soft: #e8defa;
      --red: #d83b01;
      --red-soft: #fde7e9;
      --pink: #c239b3;
      --pink-soft: #f9d8ec;

      /* Mica 风阴影(细双层) */
      --shadow: 0 2px 4px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.6);
      --shadow-soft: 0 2px 4px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
      --shadow-pop: 0 8px 16px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);

      /* 小圆角 */
      --radius: 8px;
      --radius-sm: 6px;
    }
    [data-theme="dark"] {
      --bg: #1f1f1f;
      --bg-2: #2a2a2a;
      --panel: rgba(45,45,45,.7);
      --ink-1: #f0f0f0;
      --ink-2: #d0d0d0;
      --ink-3: #a0a0a0;
      --muted: #808080;
      --line-1: #3a3a3a;
      --line-2: #2f2f2f;
      --line-3: #2a2a2a;
      --primary: #4cc2ff;
      --primary-soft: #1f3a52;
      --primary-dark: #99daff;
      --accent: #ffb66b;
      --accent-soft: #4a3a1a;
      --green: #6dd06d;
      --green-soft: #1f3a1f;
      --purple: #b893f7;
      --purple-soft: #2d1f4a;
      --red: #ff6b5a;
      --red-soft: #4a1f1f;
      --pink: #ff7fd6;
      --pink-soft: #4a1f3a;
      --shadow: 0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    }
    * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color: var(--ink-2); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-color: #eef0f4;
      background-image:
        radial-gradient(at 18% 8%, rgba(0,120,212,.12) 0px, transparent 50%),
        radial-gradient(at 85% 14%, rgba(92,45,145,.08) 0px, transparent 50%),
        radial-gradient(at 78% 92%, rgba(194,57,179,.08) 0px, transparent 50%),
        radial-gradient(at 12% 88%, rgba(16,124,16,.08) 0px, transparent 50%);
      background-attachment: fixed;
    }
    [data-theme="dark"] body {
      background-color: #1a1a1a;
      background-image:
        radial-gradient(at 18% 8%, rgba(76,194,255,.10) 0px, transparent 50%),
        radial-gradient(at 85% 14%, rgba(184,147,247,.06) 0px, transparent 50%),
        radial-gradient(at 78% 92%, rgba(255,127,214,.06) 0px, transparent 50%);
    }
    #app { max-width: 540px; margin: 0 auto; min-height: 100%; position: relative; }

    /* ===== 顶部条(Mica 风) ===== */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: rgba(255,255,255,.72);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,.4);
    }
    [data-theme="dark"] .topbar { background: rgba(31,31,31,.72); border-bottom-color: rgba(255,255,255,.06); }
    .topbar h1 { font-size: 17px; font-weight: 600; flex: 1; cursor: pointer; color: var(--ink-1); letter-spacing: -.01em; }
    .topbar .date { font-size: 12px; color: var(--muted); }
    .icon-btn { width: 36px; height: 36px; border: 1px solid var(--line-1); background: rgba(255,255,255,.6); border-radius: var(--radius-sm); font-size: 16px; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-soft); }
    [data-theme="dark"] .icon-btn { background: rgba(45,45,45,.6); }
    .icon-btn:active { background: rgba(255,255,255,.85); }

    /* ===== 抽屉 ===== */
    .drawer {
      position: fixed; top: 0; left: 0; width: 78%; max-width: 300px; height: 100%;
      background: rgba(255,255,255,.82);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      z-index: 60; transform: translateX(-110%); transition: transform .25s ease;
      box-shadow: 0 16px 48px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
    }
    [data-theme="dark"] .drawer { background: rgba(31,31,31,.85); }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding: 36px 20px 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 14px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); display: grid; place-items: center; font-size: 22px; overflow: hidden; }
    .avatar svg { width: 100%; height: 100%; }
    .drawer-header .name { font-weight: 600; font-size: 16px; cursor: pointer; color: var(--ink-1); }
    .drawer-header .sub { font-size: 12px; color: var(--muted); }
    .drawer-nav { flex: 1; padding: 10px 14px; overflow-y: auto; }
    .drawer-group { margin: 10px 2px 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
      color: var(--muted); text-transform: none; display: flex; align-items: center; gap: 6px; }
    .drawer-group:first-child { margin-top: 2px; }
    .drawer-group::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .drawer-nav button {
      width: 100%; text-align: left; padding: 12px 14px; border: none; background: transparent;
      border-radius: var(--radius-sm); color: var(--ink-2); font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 12px;
    }
    .drawer-nav button.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .overlay.show { opacity: 1; pointer-events: auto; }

    #main { padding: 14px 16px calc(74px + env(safe-area-inset-bottom)); }

    /* ===== 底部常驻 Tab Bar（移动端单手导航）===== */
    #tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 2px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      background: rgba(245,245,247,.86);
      -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--line);
    }
    [data-theme="dark"] #tabbar { background: rgba(31,31,31,.82); border-top-color: rgba(255,255,255,.08); }
    #tabbar button {
      flex: 1; border: none; background: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: 10px;
      transition: color .18s, background .18s; -webkit-tap-highlight-color: transparent;
    }
    #tabbar button .ic { font-size: 20px; line-height: 1; transition: transform .18s; }
    #tabbar button.active { color: var(--primary); background: var(--primary-soft); }
    #tabbar button.active .ic { transform: translateY(-1px) scale(1.06); }
    #tabbar button:active .ic { transform: scale(.9); }

    /* ===== 首页模块进度驾驶舱（横向胶囊）===== */
    .dash-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; margin: 2px -2px 0; scrollbar-width: none; }
    .dash-row::-webkit-scrollbar { display: none; }
    .dash-pill {
      flex: 0 0 auto; min-width: 92px; text-align: left; cursor: pointer;
      background: rgba(255,255,255,.75); border: 1px solid var(--line-2); border-radius: 14px;
      padding: 10px 12px; transition: transform .15s, box-shadow .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    [data-theme="dark"] .dash-pill { background: rgba(255,255,255,.05); }
    .dash-pill:active { transform: scale(.96); }
    .dash-pill .dp-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dash-pill .dp-num { font-size: 20px; font-weight: 700; color: var(--ink-1); margin-top: 4px; line-height: 1.1; }
    .dash-pill .dp-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .dash-pill.done { border-color: var(--primary); background: var(--primary-soft); }

    /* ===== 卡片(Mica 半透) ===== */
    .card {
      background: rgba(255,255,255,.72);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.5);
    }
    [data-theme="dark"] .card { background: rgba(45,45,45,.62); border-color: rgba(255,255,255,.06); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-1); }
    .card-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 12px; line-height: 1.5; }

    .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 4px; }
    .stat-card {
      background: rgba(255,255,255,.72);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border-radius: var(--radius); padding: 16px 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.5);
    }
    [data-theme="dark"] .stat-card { background: rgba(45,45,45,.62); border-color: rgba(255,255,255,.06); }
    .stat-card .num { font-size: 22px; font-weight: 600; color: var(--ink-1); line-height: 1.2; letter-spacing: -.02em; }
    .stat-card .lbl { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

    /* ===== 按钮(增加呼吸感) ===== */
    .btn {
      border: 1px solid transparent; border-radius: var(--radius-sm);
      padding: 11px 22px; font-size: 14px; font-weight: 600;
      background: var(--primary); color: #fff;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      min-height: 38px; font-family: inherit;
      transition: background .1s;
    }
    .btn:active { transform: scale(.98); background: var(--primary-pressed); }
    .btn:hover { background: var(--primary-hover); }
    .btn.outline { background: rgba(255,255,255,.72); color: var(--ink-1); border-color: var(--line-1); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .btn.outline:hover { background: rgba(255,255,255,.9); }
    .btn.sm { padding: 7px 14px; font-size: 13px; min-height: 30px; }
    .btn.accent { background: var(--accent); }
    .btn.accent:hover { background: #b5450a; }
    .btn.blue { background: var(--purple); }
    .btn.danger { background: var(--red); }
    .btn.subtle { background: transparent; color: var(--ink-1); }
    .btn.subtle:hover { background: rgba(255,255,255,.5); }

    /* ===== Tag(增加呼吸感) ===== */
    .tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; line-height: 1.4; }
    .tag.primary { background: var(--primary-soft); color: var(--primary-dark); }
    .tag.accent { background: var(--accent-soft); color: var(--accent); }
    .tag.blue { background: var(--purple-soft); color: var(--purple); }
    .tag.gray { background: var(--bg-2); color: var(--ink-3); border: 1px solid var(--line-1); }
    .tag.green { background: var(--green-soft); color: var(--green); }

    /* ===== 任务 / 勾选 ===== */
    .item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line-3); }
    .item:last-child { border-bottom: none; }
    .check {
      width: 20px; height: 20px; border-radius: var(--radius-sm); border: 1.5px solid var(--ink-3); opacity: .5;
      flex-shrink: 0; margin-top: 1px; display: grid; place-items: center;
      font-size: 12px; color: #fff; font-weight: 700;
    }
    .item.done .check { background: var(--primary); border-color: var(--primary); opacity: 1; }
    .item.done .item-title { text-decoration: line-through; color: var(--muted); }
    .item-body { flex: 1; }
    .item-title { font-size: 14px; font-weight: 400; color: var(--ink-1); }
    .item-desc { font-size: 13px; color: var(--ink-3); margin-top: 4px; line-height: 1.45; }
    .item-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .icon-btn.inline { width: 28px; height: 28px; font-size: 15px; }

    /* ===== 进度条 ===== */
    .progress-wrap { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .progress { flex: 1; height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }

    /* ===== 输入框 ===== */
    .input { width: 100%; padding: 11px 14px; border: 1px solid var(--line-1); border-radius: var(--radius-sm); background: rgba(255,255,255,.7); color: var(--ink-1); font-size: 14px; font-family: inherit; }
    [data-theme="dark"] .input { background: rgba(45,45,45,.6); }
    .input:focus { outline: none; border-color: var(--primary); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ===== 章节标题 ===== */
    .section-title {
      font-size: 12px; font-weight: 600; margin: 20px 6px 10px;
      color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: ''; width: 3px; height: 12px; background: var(--primary); border-radius: 2px;
    }

    /* ===== Tab ===== */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .tabs button { white-space: nowrap; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line-1); background: rgba(255,255,255,.6); color: var(--ink-3); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }

    /* ===== 周历 ===== */
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .day-cell { background: rgba(255,255,255,.6); border: 1px solid var(--line-1); border-radius: var(--radius-sm); padding: 8px 4px; text-align: center; cursor: pointer; transition: transform .1s; }
    [data-theme="dark"] .day-cell { background: rgba(45,45,45,.6); }
    .day-cell.today { background: var(--primary-soft); border-color: var(--primary); }
    .day-cell:active { transform: scale(0.96); }

    /* ===== 视频卡 ===== */
    .video-card { display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line-1); border-radius: var(--radius-sm); margin-bottom: 10px; background: rgba(255,255,255,.5); align-items: center; }
    [data-theme="dark"] .video-card { background: rgba(45,45,45,.5); }
    .video-card .play { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--purple); color: #fff; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
    .video-card a { color: var(--primary); text-decoration: none; font-size: 13px; word-break: break-all; }

    /* ===== 钢琴阶段卡(渐变) ===== */
    .stage-card {
      border: 1.5px solid var(--primary);
      background: linear-gradient(180deg, rgba(255,255,255,.78) 0%, var(--primary-soft) 100%);
    }
    [data-theme="dark"] .stage-card { background: linear-gradient(180deg, rgba(45,45,45,.7) 0%, var(--primary-soft) 100%); }
    .exercise { background: rgba(255,255,255,.6); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; border: 1px solid var(--line-1); }
    [data-theme="dark"] .exercise { background: rgba(45,45,45,.6); }
    .locked { opacity: .55; }

    /* ===== 备忘(Mica 琥珀) ===== */
    .memo-item { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; color: var(--accent); }
    .memo-date { font-size: 12px; opacity: .7; margin-top: 6px; }

    /* ===== 书摘/金句 ===== */
    .quote { font-style: italic; font-size: 15px; line-height: 1.7; color: var(--ink-1); border-left: 3px solid var(--primary); padding-left: 14px; }
    .quote .by { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); font-style: normal; }

    .sentence { padding: 12px 0; border-bottom: 1px solid var(--line-3); }
    .sentence:last-child { border-bottom: none; }
    .en { font-size: 16px; margin-bottom: 4px; color: var(--ink-1); }
    .zh { font-size: 14px; color: var(--ink-3); }

    /* ===== 游戏格 ===== */
    .game-board { display: grid; gap: 10px; margin: 14px 0; }
    .cell { aspect-ratio: 1; border-radius: var(--radius-sm); background: var(--bg-2); display: grid; place-items: center; font-size: 24px; cursor: pointer; user-select: none; border: 1px solid var(--line-1); }
    [data-theme="dark"] .cell { background: rgba(45,45,45,.6); }
    .cell.flip { background: var(--primary-soft); }

    .chart { width: 100%; height: 150px; }

    /* ===== 模态框 ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80; display: grid; place-items: center; padding: 20px; }
    .modal {
      background: rgba(255,255,255,.95);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      border-radius: var(--radius); padding: 22px;
      width: 100%; max-width: 440px; max-height: 86vh; overflow: auto;
      box-shadow: 0 16px 48px rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.6);
    }
    [data-theme="dark"] .modal { background: rgba(45,45,45,.92); border-color: rgba(255,255,255,.06); }
    .modal h3 { margin-bottom: 14px; font-size: 18px; color: var(--ink-1); }
    .modal .field { margin-bottom: 14px; }
    .modal label { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    .opt { padding: 11px 14px; border: 1px solid var(--line-1); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
    .opt.sel { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }

    .empty { text-align: center; color: var(--ink-3); padding: 36px 18px; }
    .empty .big { font-size: 34px; display: block; margin-bottom: 8px; }
    .center { text-align: center; }

    /* ===== 头像选择器(新增) ===== */
    .av-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .av-pick {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; padding: 10px 6px; border-radius: var(--radius-sm);
      transition: background .15s;
    }
    .av-pick:hover { background: rgba(255,255,255,.5); }
    .av-pick.sel { background: var(--primary-soft); }
    .av-pick .av-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--bg-2);
      border: 2px solid transparent;
      display: grid; place-items: center; overflow: hidden;
    }
    .av-pick.sel .av-circle { border-color: var(--primary); }
    .av-pick .av-circle svg { width: 100%; height: 100%; }
    .av-pick .av-name { font-size: 12px; color: var(--ink-3); font-weight: 500; }
    .av-pick.sel .av-name { color: var(--primary); font-weight: 600; }

    /* ===== 强调卡(左侧色条) ===== */
    .accent-bar { border-left: 3px solid var(--primary); padding-left: 15px; }

    /* ===== v14 优化：主题切换按钮 / 入场动画 / 反馈 ===== */
    #themeBtn { transition: transform .2s ease, background .2s ease; }
    #themeBtn:active { transform: scale(.9) rotate(-20deg); }
    [data-theme="dark"] #themeBtn { background: rgba(45,45,45,.6); }

    /* 全局过渡（深浅切换平滑） */
    :root, body, .topbar, .drawer, .card, .btn, .icon-btn, .stat-card, .modal, .modal-mask {
      transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
    }

    /* 卡片入场：淡入 + 上浮（错峰） */
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    #main > .card,
    #main > .section-title,
    #main > .stat-grid,
    #main > .btn { animation: cardIn .4s cubic-bezier(.2,.7,.3,1) both; }
    #main > .card:nth-child(2) { animation-delay: .04s; }
    #main > .card:nth-child(3) { animation-delay: .08s; }
    #main > .card:nth-child(4) { animation-delay: .12s; }
    #main > .card:nth-child(5) { animation-delay: .16s; }
    #main > .card:nth-child(6) { animation-delay: .20s; }
    @media (prefers-reduced-motion: reduce) { #main > * { animation: none !important; } }

    /* 按钮点击反馈 */
    .btn { transition: transform .12s ease, box-shadow .2s ease, background-color .2s ease; }
    .btn:active { transform: scale(.96); }
    .icon-btn:active { transform: scale(.92); }

    /* 抽屉导航语义色点 */
    .drawer-nav button { position: relative; transition: background-color .2s ease, transform .12s ease; }
    .drawer-nav button:active { transform: scale(.98); }
    .drawer-nav button[data-view="home"]::before   { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--primary); }
    .drawer-nav button[data-view="study"]::before  { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--accent); }
    .drawer-nav button[data-view="sport"]::before  { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--green); }
    .drawer-nav button[data-view="health"]::before { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--red); }
    .drawer-nav button[data-view="topic"]::before  { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--pink); }
    .drawer-nav button[data-view="book"]::before   { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--purple); }
    .drawer-nav button[data-view="piano"]::before  { content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#c239b3; }
    .drawer-nav button { padding-left: 28px; }
    .drawer-nav button:not([data-view])::before { display: none; }

    /* 顶部条高度在刘海屏更舒适 */
    .topbar { padding-top: max(14px, env(safe-area-inset-top)); }

    /* 首访引导条 */
    .onboard-tip { font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap }
    .onboard-tip b { color: var(--primary); }

    /* 首页学习内容行 */
    .learn-row { transition: background-color .15s ease; }
    .learn-row:active { background: var(--line-2); }
    @media (hover:hover){ .learn-row:hover { background: var(--line-3); } }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle" title="点击重命名工作台">我的工作台</h1>
      <span class="date" id="topDate"></span>
      <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换主题">🌗</button>
      <span id="appVer" style="font-size:10px;color:var(--muted);background:var(--line-2);padding:2px 6px;border-radius:8px;margin-left:4px" title="当前代码版本">v15</span>
    </header>

    <nav class="drawer" id="drawer">
      <div class="drawer-header">
        <div class="avatar" id="drawerAvatar" data-action="open-avatar" title="点击换头像" style="cursor:pointer">🎯</div>
        <div>
          <div class="name" id="drawerName" title="点击重命名">我的工作台</div>
          <div class="sub">Personal Growth OS · <span id="drawerAvatarName">小猫</span></div>
        </div>
      </div>
      <div class="drawer-nav" id="drawerNav">
        <div class="drawer-group">🏠 总览</div>
        <button data-view="home" class="active">🏠 首页</button>
        <div class="drawer-group">📅 每日规划</div>
        <button data-view="daily">📝 每日计划</button>
        <button data-view="sport">🏊 运动计划</button>

    // 抖音搜索：优先唤起 App（深链），失败则复制话题名兜底（网页端/未装App）
    function openDouyinSearch(keyword) {
      const txt = (keyword || '').replace(/^#/, '').trim();
      if (!txt) { toast('话题为空'); return; }
      const kw = encodeURIComponent(txt);
      // 先复制，保证即便唤起失败也有可粘贴的内容
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).catch(()=>{});
        }
      } catch (_) {}
      // 尝试唤起抖音 App（snssdk1128 是抖音官方 scheme）
      const schemes = [
        'snssdk1128://search?keyword=' + kw,
        'douyin://search?keyword=' + kw,
        'aweme://search?keyword=' + kw
      ];
      let invoked = false;
      const tryScheme = (i) => {
        if (i >= schemes.length || invoked) return;
        const t0 = Date.now();
        const onHide = () => {
          invoked = true;
          document.removeEventListener('visibilitychange', onHide);
          toast('已打开抖音 App，搜索：' + txt);
        };
        document.addEventListener('visibilitychange', onHide);
        // 设置超时：若 N 秒后页面仍可见（说明没唤起 App），撤销监听并走复制兜底
        setTimeout(() => {
          document.removeEventListener('visibilitychange', onHide);
          if (!invoked && i === schemes.length - 1) {
            toast('已复制「' + txt + '」，去抖音 App 搜索框粘贴');
          } else if (!invoked) {
            tryScheme(i + 1);
          }
        }, 800);
        try { location.href = schemes[i]; } catch (_) { tryScheme(i + 1); }
      };
      tryScheme(0);
    }
    // 外部链接打开器（v14 修复：抖音/小红书/B站打不开、B站跳知乎回不来）
    // 核心思路：在 PWA standalone / iOS 下，不能用 window.location.href 替换当前页
    // （会丢失返回、且抖音小红书 webview 白屏拦截），必须开新窗口并保留本页。
    function openExternal(url) {
      if (!url) return;
      // 抖音网页搜索已对网页端封锁(返回 404)：不跳网页，改唤起 App 搜（兜底复制）
      if (/douyin\.com\/search/.test(url)) {
        try {
          const kw = new URL(url).searchParams.get('keyword') || '';
          openDouyinSearch(decodeURIComponent(kw));
        } catch (_) { toast('抖音网页已封,请在 App 内搜索'); }
        return;
      }
      const isPWA = (window.navigator.standalone === true) ||
                    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      try {
        // 策略1：新窗口打开，并保留源的 PWA 页面（有返回）
        const w = window.open('about:blank', '_blank', 'noopener');
        if (w) {
          // 先写个跳转页，规避 iOS PWA 对 opener 的限制
          try { w.opener = null; } catch (_) {}
          w.location.href = url;
          return;
        }
      } catch (_) {}
      try {
        // 策略2：兜底，用 a 标签触发（部分浏览器需要真实用户手势上下文）
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        document.body.appendChild(a); a.click(); a.remove();
        return;
      } catch (_) {}
      // 策略3：最终兜底，复制链接并提示用户手动打开
      try {
        const ta = document.createElement('textarea'); ta.value = url;
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        toast('链接已复制，可粘贴到浏览器打开');
      } catch (e) {
        toast('无法打开，请长按复制：' + url);
      }
    }

    }

    // ===================== 每日计划 =====================
    function renderDaily() {

            <div style="flex:1"><div style="font-weight:600;font-size:14px">📚 学习成长</div><div class="item-desc" style="margin-top:2px">${studyTodayDone?'今日已学 ✓':'今天还没学'}</div></div>
            ${studyTodayDone?'<span class="tag primary">已完成</span>':`<button class="btn sm" data-action="study-checkin">去学习</button>`}
          </div>
          <div class="item" style="padding:10px 4px;border-top:1px solid var(--line-2)">
            <div style="flex:1"><div style="font-weight:600;font-size:14px">😴 睡眠记录</div><div class="item-desc" style="margin-top:2px">${sleepRecDone?'今日已记 ✓':'今晚记得记'}</div></div>
            ${sleepRecDone?'<span class="tag primary">已完成</span>':`<button class="btn sm" data-action="go" data-v="health">去记录</button>`}

            <button class="btn" data-action="add-task">+</button>
          </div>
        </div>`;
    }
    function taskItem(i,g){ return `<div class="item ${i.done?'done':''}">
      <div class="check" data-action="toggle-task" data-g="${g}" data-id="${i.id}">${i.done?'✓':''}</div>
      <div class="item-body"><div class="item-title">${i.title}</div>
        <div class="item-desc"><span class="tag ${g==='routine'?'primary':'accent'}">${i.tag}</span></div></div>
      <button class="icon-btn inline" data-action="del-task" data-g="${g}" data-id="${i.id}">✕</button></div>`; }
    function completion(){ const all=[...state.daily.routine,...state.daily.tasks]; return all.length?Math.round(all.filter(i=>i.done).length/all.length*100):0; }

    // ===================== 学习中心 =====================
    let curLang = null;
    let studyMode = 'overview';  // overview | quiz | flash | listen
    // 今日练习进度（答题数）
    function studyQuizToday() { return (state.studyQuiz && state.studyQuiz[today()]) || 0; }
    function renderStudy() {
      if (!state.studyLog || typeof state.studyLog !== 'object') { state.studyLog = {}; save(); }
      if (!state.studyQuiz || typeof state.studyQuiz !== 'object') { state.studyQuiz = {}; save(); }
      if (!state.flashDone || typeof state.flashDone !== 'object') { state.flashDone = {}; save(); }
      const sstreak = (()=>{ let s=0; for(let i=0;i<365;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(state.studyLog[dateStr(d)]) s++; else if(i>0) break; } return s; })();
      const todayDone = !!state.studyLog[today()];
      const qn = studyQuizToday();
      const langs = Object.keys(LANG);
      const tabsHtml = `<button class="${!curLang?'active':''}" data-action="lang-all">全部</button>` +
        langs.map(k=>`<button class="${curLang===k?'active':''}" data-action="lang" data-k="${k}">${LANG[k].flag} ${LANG[k].name}</button>`).join('');
      const modes = [['overview','📚 总览'],['quiz','🎯 闯关练习'],['flash','🔤 单词卡'],['listen','👂 精听跟读']];
      const modeHtml = `<div class="tabs" style="margin-bottom:10px">${modes.map(m=>`<button class="${studyMode===m[0]?'active':''}" data-action="study-mode" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>`;
      $('main').innerHTML = `
        <div class="card" style="border:1px solid var(--primary);background:var(--primary-soft)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="card-title" style="margin:0;color:var(--primary-dark)">🔥 连续学习 ${sstreak} 天</div>

          </div>
          <div class="card-sub" style="margin:6px 0 0">游戏化坚持（参考多邻国 streak）：每天 10 分钟，比周末突击更有效；间隔复习比一次性硬背更牢。</div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:8px;background:var(--line-2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.min(100,qn*10)}%;background:linear-gradient(90deg,#5b8def,#7c5cff)"></div></div>
            <span style="font-size:12px;color:var(--muted)">今日练习 ${qn}/10</span>

        ${modeHtml}
        <div id="langBody"></div>`;

    function studyRenderBody() {

      return renderLangBody();

    // 新增:三个语言总览
    function renderAllLangs() {
      const langs = Object.keys(LANG);
      const today = new Date();
      const dayKey = Math.floor(today.getTime() / 86400000);
      const cards = langs.map(k => {
        const L = LANG[k];

        // 今日材料索引(基于日期轮换)
        const todayVocab = L.vocabulary[dayKey % L.vocabulary.length];
        const todayTr = L.translations[dayKey % L.translations.length];
        // 今日原文:有 articles 用 articles,否则用 dialogues 第一句
        let todayOriginal = '';

    // ============ 闯关练习（对标多邻国：交互作答 + 即时反馈）============
    let quizState = null;
    function buildQuiz() {
      const L = LANG[curLang || 'english'];
      const pool = [];
      // 单词选择题
      (L.vocabulary||[]).forEach(w => {
        const others = (L.vocabulary||[]).filter(x=>x.word!==w.word).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.meaning);
        if (others.length>=3) pool.push({ type:'word', q:`「${w.word}」是什么意思？`, answer:w.meaning, opts:shuffle([w.meaning,...others]), say:w.word, sayLang:L.tts });
      });
      // 翻译选择题（给出中文，选英文）
      (L.translations||[]).forEach(t => {
        const others = (L.translations||[]).filter(x=>x.answer!==t.answer).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.answer);
        if (others.length>=3) pool.push({ type:'trans', q:`「${t.source}」怎么翻译？`, answer:t.answer, opts:shuffle([t.answer,...others]) });
      });
      pool.sort(()=>Math.random()-0.5);
      return pool.slice(0,5);
    }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function renderStudyQuiz() {
      if (!quizState || quizState.finished) {
        const qs = buildQuiz();
        if (!qs.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无足够练习数据</div></div>'; return; }
        quizState = { qs, idx:0, score:0, chosen:null, finished:false };
      }
      const st = quizState, q = st.qs[st.idx];
      const prog = Math.round((st.idx)/(st.qs.length)*100);
      let body;
      if (st.finished) {
        const pass = st.score>=Math.ceil(st.qs.length*0.6);
        body = `<div class="card" style="text-align:center;padding:24px">
          <div style="font-size:40px">${pass?'🎉':'💪'}</div>
          <div class="card-title" style="justify-content:center">今日闯关完成</div>
          <div style="font-size:28px;font-weight:800;margin:8px 0">${st.score}/${st.qs.length}</div>
          <div class="card-sub">${pass?'很棒，保持连胜！':'再来一次会更熟。'}</div>
          <button class="btn" data-action="quiz-restart" style="margin-top:12px">🔄 再来一组</button>
        </div>`;
      } else {
        body = `<div class="card">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>第 ${st.idx+1}/${st.qs.length} 题</span><span>${st.score} 分</span></div>
          <div style="height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${prog}%;background:linear-gradient(90deg,#5b8def,#7c5cff)"></div></div>
          <div style="font-size:16px;font-weight:600;margin-bottom:4px">${esc(q.q)}</div>
          ${q.say?`<button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(q.say)}" data-l="${q.sayLang}" style="margin-bottom:12px">🔊 听发音</button>`:''}
          <div style="display:flex;flex-direction:column;gap:8px">
            ${q.opts.map(o=>`<button class="btn ${st.chosen?(o===q.answer?'sm ok':'sm'):'sm outline'}" data-action="quiz-ans" data-o="${esc(o)}" ${st.chosen?'disabled':''} style="justify-content:flex-start;${st.chosen&&o===q.answer?'background:var(--primary-soft);color:var(--primary);border-color:var(--primary)':''}${st.chosen&&st.chosen===o&&o!==q.answer?'background:#fde8e8;color:var(--red)':''}">${esc(o)}</button>`).join('')}
          </div>
          ${st.chosen?`<div style="margin-top:12px;font-size:13px;color:${st.chosen===q.answer?'var(--green)':'var(--red)'}">${st.chosen===q.answer?'✅ 答对啦':'❌ 正确答案：'+esc(q.answer)}</div><button class="btn sm" data-action="quiz-next" style="margin-top:8px">${st.idx+1>=st.qs.length?'看结果':'下一题 →'}</button>`:''}
        </div>`;
      }
      $('langBody').innerHTML = body;
    }
    // ============ 单词卡（对标不背单词：语境例句 + 认识/不认识）============
    let flashState = null;
    function renderStudyFlash() {
      const L = LANG[curLang || 'english'];
      const list = (L.vocabulary||[]);
      if (!list.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无单词卡</div></div>'; return; }
      if (!flashState || flashState.done) {
        const done = (state.flashDone[L.name]||[]);
        const remain = list.filter(w=>!done.includes(w.word));
        const pick = (remain.length?remain:list).slice(0,10);
        flashState = { pick, idx:0, flipped:false, done:false };
      }
      const st = flashState, w = st.pick[st.idx];
      if (!w) { $('langBody').innerHTML = '<div class="card"><div class="empty">今日单词已刷完 🎉</div></div>'; return; }
      $('langBody').innerHTML = `
        <div class="card" style="text-align:center">
          <div style="font-size:12px;color:var(--muted)">第 ${st.idx+1}/${st.pick.length} 张</div>
          <div style="font-size:32px;font-weight:800;margin:10px 0">${esc(w.word)}</div>
          <div style="color:var(--muted);font-size:13px">${esc(w.pron||'')}</div>
          <button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(w.word)}" data-l="${L.tts}" style="margin:10px auto;display:block">🔊 发音</button>
          ${st.flipped?`<div style="margin-top:8px;padding:14px;background:var(--bg);border-radius:10px">
            <div style="font-size:18px;font-weight:700;color:var(--primary)">${esc(w.meaning)}</div>
            <div style="font-size:13px;color:var(--ink-2);margin-top:8px;font-style:italic">「${esc(w.example||'')}」</div>
          </div>`:`<div class="card-sub" style="margin-top:8px">点击卡片看释义与例句</div>`}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn sm outline" data-action="flash-flip" style="flex:1">${st.flipped?'收起':'翻转看释义'}</button>
          <button class="btn sm" data-action="flash-know" style="flex:1">✅ 认识</button>
          <button class="btn sm outline" data-action="flash-unknow" style="flex:1">📌 不认识</button>
        </div>`;
    }
    // ============ 精听跟读（对标每日英语听力：单句精听 + 跟读打分）============
    let listenState = null;
    function renderStudyListen() {
      const L = LANG[curLang || 'english'];
      const sentences = [];
      (L.articles||[]).forEach(a=>a.paras.forEach(p=>sentences.push(p.en)));
      (L.vocabulary||[]).forEach(w=>{ if(w.example) sentences.push(w.example); });
      if (!sentences.length) { $('langBody').innerHTML = '<div class="card"><div class="empty">该语言暂无听力句</div></div>'; return; }
      if (!listenState || listenState.done) {
        const day = Math.floor(Date.now()/86400000);
        const pick = [];
        for (let i=0;i<5;i++) pick.push(sentences[(day+i*7)%sentences.length]);
        listenState = { pick, idx:0, revealed:false, result:null, done:false };
      }
      const st = listenState, s = st.pick[st.idx];
      $('langBody').innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>精听 ${st.idx+1}/${st.pick.length}</span><button class="btn sm outline" data-action="listen-play" style="margin:0">🔊 盲听</button></div>
          <div style="margin:14px 0;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.6">
            ${st.revealed?esc(s):'<span style="color:var(--muted)">先盲听，再点「显示原文」</span>'}
          </div>
          ${st.revealed?`<button class="btn sm outline" data-action="speak" data-t="${encodeURIComponent(s)}" data-l="${L.tts}" style="width:100%;justify-content:center;margin-bottom:8px">🔊 跟读示范</button>`:''}
          <div style="display:flex;gap:8px">
            ${!st.revealed?`<button class="btn sm" data-action="listen-reveal" style="flex:1">显示原文</button>`:`<button class="btn sm" data-action="listen-record" style="flex:1">🎤 我开始跟读</button>`}
          </div>
          ${st.result?`<div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;line-height:1.5">${st.result}</div>`:''}
          <button class="btn sm outline" data-action="listen-next" style="margin-top:10px;width:100%;justify-content:center">下一句 →</button>
        </div>
        <div class="card-sub" style="text-align:center;margin-top:6px">跟读使用浏览器语音识别，部分手机/PWA 可能不支持；不支持时可用「显示原文 + 跟读示范」替代练习。</div>`;
    }
    function startAssess() {
      const L = LANG[curLang];
      let step = 0; let score = 0;
      const q = L.assessment;
      openModal(`<h3>📝 ${L.name} 水平测评</h3><div id="aq"></div>
        <div class="modal-actions"><button class="btn" id="anext">下一题</button></div>`);
      renderQ();
      function renderQ(){
        const item = q[step];
        $('aq').innerHTML = `<p style="margin-bottom:12px;font-weight:600">${step+1}/${q.length}. ${item.q}</p>` +
          item.o.map((o,i)=>`<div class="opt" data-s="${item.s[i]}" data-o="${o}">${o}</div>`).join('');
        $('aq').querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
          $('aq').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
          el.classList.add('sel');
        });
        $('anext').textContent = step===q.length-1 ? '查看结果' : '下一题';
      }
      $('anext').onclick = () => {
        const sel = $('aq').querySelector('.opt.sel');
        if (!sel) { alert('请选择一个答案'); return; }
        score += +sel.dataset.s;
        if (step < q.length-1) { step++; renderQ(); }
        else {
          const max = q.length*3; const ratio = score/max;
          const idx = Math.min(L.levels.length-1, Math.floor(ratio * L.levels.length));
          state.lang[curLang].level = idx; save();
          openModal(`<h3>🎯 测评结果</h3>
            <p style="margin-bottom:10px">你的 ${L.name} 水平约为：</p>
            <div class="card-title" style="font-size:20px;color:var(--primary)">${L.levels[idx]}</div>
            <p class="card-sub" style="margin-top:10px">${L.plan[idx].g}</p>
            <div class="modal-actions"><button class="btn" data-action="modal-close">开始学习</button></div>`);
          renderLangBody();
        }
      };
    }

        <div class="card">${renderWeekLog()}</div>
        <div class="section-title">三项运动详情</div>

          <div class="card">
            <div class="card-title">${s.icon} ${s.name}</div>

            ${s.note?`<div class="card-sub" style="color:var(--accent)">💡 ${s.note}</div>`:''}
            ${s.plan.map(p=>`
              <div style="margin:10px 0">
                <strong style="font-size:14px">${p.phase}</strong>
                ${p.items.map(it=>`<div class="item" style="padding:7px 0"><span class="tag gray" style="margin-right:8px">▪</span>${it}</div>`).join('')}
              </div>`).join('')}
            <div class="card-sub" style="margin-top:6px">教学视频：</div>
            ${s.videos.map(v=>`<div class="video-card"><div class="play">▶</div><div><div style="font-weight:600;font-size:14px">${v.t}</div><a href="${v.url}" data-action="open-link" data-url="${v.url}" target="_blank" rel="noopener">${v.url}</a></div></div>`).join('')}
          </div>
        `).join('')}
      `;

    function renderWeekLog() {
      const start = new Date(); start.setDate(start.getDate() - ((start.getDay()+6)%7)); start.setHours(0,0,0,0);
      const days = [];
      for (let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const k=dateStr(d); days.push({k, log:state.sport.log[k], label:(d.getMonth()+1)+'/'+d.getDate()}); }

        return `<div class="item" style="padding:8px 0"><span class="tag primary" style="margin-right:8px">${d.label}</span>${tags}</div>`;
      }).join('');
    }

    function svgBars(data, color) {
      const w=600,h=150,pad=20,n=data.length; if(!n) return '';
      const max=Math.max(...data.map(d=>d.value),1);
      const slot=(w-2*pad)/n, bw=slot*0.55;
      const bars=data.map((d,i)=>{ const v=+d.value; const bh=max?(h-2*pad)*(v/max):0; const x=pad+slot*i+(slot-bw)/2; const y=h-pad-bh;
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,0).toFixed(1)}" rx="4" fill="${color}"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${h-5}" font-size="10" fill="#9a9a92" text-anchor="middle">${d.label}</text>`;}).join('');
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e8e2"/>${bars}</svg>`;
    }

    function renderGame() {

      const names={memory:'🃏 记忆翻牌', guess:'🔢 猜数字', match:'🔤 词语接龙'};

      const his = state.gameHistory[todayKey] || {};
      $('main').innerHTML = `
        <div class="card">
          <div class="card-title">🎮 今日游戏：${names[gameType]}</div>
          <div class="card-sub">每天自动更换一种；下方可切换尝试其他游戏。</div>

            <button class="btn sm ${gameType==='memory'?'':'outline'}" data-action="gtype" data-t="memory">记忆翻牌</button>
            <button class="btn sm ${gameType==='guess'?'':'outline'}" data-action="gtype" data-t="guess">猜数字</button>

        <div class="section-title">今日历史记录</div>
        <div class="card">${Object.keys(his).length?Object.entries(his).map(([k,v])=>`<div class="item" style="padding:8px 0"><span class="tag primary" style="margin-right:8px">${k}</span>${v}</div>`).join(''):'<div class="empty">今天还没玩过</div>'}</div>`;
      renderGameArea();
    }
    function logGame(name, result){ const k=today(); (state.gameHistory[k]=state.gameHistory[k]||{})[name]=result; save(); }
    function renderGameArea() {
      const area = $('gameArea'); if(!area) return;
      if (gameType==='memory') return renderMemory(area);
      if (gameType==='guess') return renderGuess(area);
      if (gameType==='match') return renderMatch(area);
    }
    function renderMemory(area){
      const emo=['🍎','🎹','🏊','🌟','📚','🍊','🌸','🐱'];
      let cards = emo.concat(emo).map((e,i)=>({e,i})).sort(()=>Math.random()-0.5);
      let flipped=[], matched=0;
      area.innerHTML = `<div class="game-board" style="grid-template-columns:repeat(4,1fr)">${cards.map(c=>`<div class="cell" data-i="${c.i}" data-e="${c.e}">？</div>`).join('')}</div><p class="muted" style="font-size:13px;text-align:center" id="mstat">点击翻开两张配对</p>`;
      area.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{
        if(c.classList.contains('flip')||flipped.length===2) return;
        c.classList.add('flip'); c.textContent=c.dataset.e; flipped.push(c);
        if(flipped.length===2){
          if(flipped[0].dataset.e===flipped[1].dataset.e){ matched++; flipped=[]; if(matched===emo.length){ $('mstat').textContent='🎉 全部配对完成！'; logGame('记忆翻牌','完成'); } }
          else { setTimeout(()=>{ flipped.forEach(x=>{x.classList.remove('flip');x.textContent='？';}); flipped=[]; },700); }
        }
      });
    }
    function renderGuess(area){
      const target = Math.floor(Math.random()*100)+1; let tries=0;
      area.innerHTML = `<p class="muted" style="font-size:13px;margin-bottom:8px">我已想好 1-100 的数字，猜猜看（${new Date().getDate()%2? '7':'8'} 次内）。</p>
        <div class="row"><input class="input" id="gnum" type="number" placeholder="你的猜测" style="flex:1"/><button class="btn" id="gbtn">猜</button></div>
        <p id="gmsg" class="muted" style="font-size:13px;margin-top:8px"></p>`;
      $('gbtn').onclick=()=>{ const v=+$('gnum').value; if(!v)return; tries++;
        if(v===target){ $('gmsg').textContent=`🎉 猜对了！用了 ${tries} 次`; logGame('猜数字',`${tries}次猜中`); }
        else { $('gmsg').textContent = v>target?'大了 ↓':'小了 ↑'; if(tries>=8){ $('gmsg').textContent=`次数用完，答案是 ${target}`; logGame('猜数字','未猜中'); } }
      };
    }
    function renderMatch(area){
      const words=['坚持','习惯','钢琴','努力','梦想','成长','学习','阳光','未来','勇气','热爱','自律'];
      let cur = words[Math.floor(Math.random()*words.length)]; let ok=0;
      area.innerHTML = `<p class="muted" style="font-size:13px;margin-bottom:8px">用上一个词的<strong>最后一个字</strong>开头接词（如 坚持→持久）。</p>
        <div class="card-title" style="font-size:18px;color:var(--primary)">当前词：${cur}</div>
        <div class="row"><input class="input" id="mword" placeholder="接一个词…" style="flex:1"/><button class="btn" id="mbtn">接</button></div>
        <p id="mmsg" class="muted" style="font-size:13px;margin-top:8px"></p>`;
      $('mbtn').onclick=()=>{ const v=$('mword').value.trim(); if(!v)return;
        const last=cur[cur.length-1];
        if(v[0]===last){ ok++; cur=v; $('mmsg').textContent=`✅ 接得好！新词：${cur}（已连 ${ok} 个）`; area.querySelector('.card-title').textContent=`当前词：${cur}`; $('mword').value=''; if(ok>=5){ logGame('词语接龙',`连${ok}个`); } }
        else { $('mmsg').textContent=`❌ 要用「${last}」开头哦`; }
      };
    }

        <div class="card">

          <div class="card-sub">从认识琴键到即兴伴奏，5 阶段循序渐进；练到「过关标准」点「标记掌握」解锁下一阶段。</div>

    function stageCard(s, locked){

        case 'go': navigate(t.dataset.v); break;
        case 'toggle-task': { const g=t.dataset.g,id=t.dataset.id; const it=state.daily[g].find(x=>x.id===id); if(it){it.done=!it.done;save();renderDaily();} break; }

        case 'lang-done': { const i=+t.dataset.i; const L=LANG[curLang]; if(state.lang[curLang].level===i && i<L.plan.length-1){ state.lang[curLang].level=i+1; } save(); renderLangBody(); break; }
        case 'speak': speak(decodeURIComponent(t.dataset.t), t.dataset.l); break;
        case 'sport-done': { const id=t.dataset.id; state.sport.done[id]=(state.sport.done[id]||0)+1; save(); toast('已记录 ' + SPORTS.find(s=>s.id===id).name + ' 打卡'); break; }
        case 'day-sport': { const day=+t.dataset.day; const dn=['一','二','三','四','五','六','日'][day-1]; const opts=SPORTS.map(s=>`<button class="btn sm outline" data-action="set-day-sport" data-day="${day}" data-id="${s.id}" style="margin:4px">${s.icon} ${s.name}</button>`).join('')+`<button class="btn sm outline" data-action="set-day-sport" data-day="${day}" data-id="rest" style="margin:4px">💤 休息</button>`; openModal(`<h3>周${dn} 安排哪个项目？</h3><div style="display:flex;flex-wrap:wrap">${opts}</div><div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button></div>`); break; }
        case 'set-day-sport': { const day=+t.dataset.day, id=t.dataset.id; state.sport.weekPlan[day]=id==='rest'?null:id; save(); closeModal(); renderSport(); toast('周排期已更新'); break; }
        case 'log-sport': { const id=t.dataset.id; const sp=SPORTS.find(s=>s.id===id); const v=prompt(`今天 ${sp.name} 练了多少分钟？`, '30'); const m=+v; if(!v||isNaN(m)||m<=0){ if(v!==null) toast('请输入有效分钟数'); break; } state.sport.log[today()]=state.sport.log[today()]||{}; state.sport.log[today()][id]=(state.sport.log[today()][id]||0)+m; save(); toast(`✅ ${sp.icon} 已记录 ${m} 分钟`); renderSport(); break; }
        case 'save-profile': { state.health.profile.height=$('hHeight').value; state.health.profile.goalWeight=$('hGoal').value; save(); toast('已保存基础数据'); break; }
        case 'save-record': { const d=today(); state.health.records[d]={ sleep:$('recSleep').value, weight:$('recWeight').value, mood:+$('recMood').value, exercise:$('recEx').value, note:$('recNote').value, bedtime:$('recBedtime').value, wake:$('recWake').value, quality:+$('recQuality').value||0, awake:+$('recAwake').value||0 }; save(); toast('✅ 今日健康记录已保存'); break; }
        case 'save-topic': { const tt=t.dataset.t; if(state.topicSaved.includes(tt)) state.topicSaved=state.topicSaved.filter(x=>x!==tt); else state.topicSaved.push(tt); save(); renderTopic(); break; }

            else { b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; }
          });
          // 更新列表
          const itemsEl = document.getElementById('hotItems');
          if (itemsEl) itemsEl.innerHTML = items.map((it,i) => `<div class="video-card" style="background:var(--bg)">

            <div style="flex:1;min-width:0">

                <button class="btn sm outline" data-action="save-topic" data-t="${esc(it.title)}" style="padding:3px 10px;font-size:12px">⭐ 存灵感</button>

          </div>`).join('') || '<div class="empty">暂无数据</div>';
          break;
        }
        case 'save-book': { const tt=t.dataset.t; if(state.bookSaved.includes(tt)) state.bookSaved=state.bookSaved.filter(x=>x!==tt); else state.bookSaved.push(tt); save(); renderBook(); break; }
        case 'flip-card': {
          const w = JSON.parse(decodeURIComponent(t.dataset.w));

          if (front && front.dataset.flipped !== '1') {

          } else if (front) {
            front.dataset.flipped = '';
            const L = LANG[curLang];
            front.innerHTML = `<div style="font-size:18px;font-weight:700">${w.word}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">[${w.level||''} · 点翻]</div>`;
          }
          break;
        }
        case 'check-trans': {
          const i = +t.dataset.i;
          const data = JSON.parse(decodeURIComponent(t.dataset.key));
          const userInput = document.getElementById('ti'+i).value.trim();
          const ans = data.answer.replace(/[.!?。！？,，;；]+$/g,'').replace(/\s+/g,' ').trim().toLowerCase();
          const ua = userInput.replace(/[.!?。！？,，;；]+$/g,'').replace(/\s+/g,' ').trim().toLowerCase();
          const result = document.getElementById('tres'+i);
          if (!userInput) { result.innerHTML = '<span style="color:#a94442">请先输入翻译</span>'; break; }
          // 智能核对：完全一致或 80% 相似算正确
          const exact = ua === ans;
          const sim = (function(a, b){
            if (a === b) return 1;
            const setA = new Set(a.split(/\s+/)); const setB = new Set(b.split(/\s+/));
            const inter = [...setA].filter(x => setB.has(x)).length;
            return inter / Math.max(setA.size, setB.size);
          })(ua, ans);
          if (exact || sim >= 0.8) {
            result.innerHTML = `<span style="color:#4caf84;font-weight:600">✓ 正确！</span><div style="margin-top:4px;color:var(--muted);font-size:13px">参考答案：${data.answer}</div>`;
          } else {

          flashState.idx++;

          if (flashState.idx >= flashState.pick.length) flashState.done = true;
          toast(a==='flash-know' ? '✅ 已记住，下一轮不再出现' : '📌 已标记，下次重点练');

          const L = LANG[curLang || 'english'];
          if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            listenState.result = '⚠️ 当前浏览器不支持语音识别。可点「显示原文 + 跟读示范」对照练习。';
            renderStudyListen(); break;
          }
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SR();
          rec.lang = L.tts; rec.interimResults = false; rec.maxAlternatives = 1;
          listenState.result = '🎤 请跟读…（说完自动评分）';
          renderStudyListen();
          try {
            rec.onresult = (ev) => {
              const said = ev.results[0][0].transcript.trim().toLowerCase();
              const tgt = target.toLowerCase().replace(/[.,!?;:]/g,'');
              const sim = said.replace(/[.,!?;:]/g,'');
              let score = 0;
              const tWords = tgt.split(' ').filter(Boolean);
              const sWords = sim.split(' ').filter(Boolean);
              tWords.forEach(w=>{ if(sWords.includes(w)) score++; });
              const pct = tWords.length? Math.round(score/tWords.length*100):0;
              listenState.result = `你说的：${said}<br>匹配度：<b style="color:${pct>=70?'var(--green)':'var(--red)'}">${pct}%</b><br>${pct>=70?'👍 很接近，继续保持！':'💡 再听一遍示范，注意节奏。'}`;
              renderStudyListen();
            };
            rec.onerror = () => { listenState.result = '⚠️ 没听清或浏览器不支持，请重试，或用示范对照练习。'; renderStudyListen(); };
            rec.start();
          } catch(_) { listenState.result = '⚠️ 语音识别启动失败，请用示范对照练习。'; renderStudyListen(); }
          break;
        }
        case 'piano-edit': {
          const sId=t.dataset.s, idx=+t.dataset.i;
          if(!state.pianoEx[sId]) state.pianoEx[sId] = PIANO_STAGES.find(s=>s.id==sId).ex.map(e=>({id:uid(), title:e.title, desc:e.desc}));
          const cur = state.pianoEx[sId][idx]; if(!cur) break;
          const title = prompt('修改曲目名称', cur.title); if(title===null) break;
          const desc = prompt('修改说明/要点', cur.desc); if(desc===null) break;
          if(title.trim()) cur.title = title.trim();
          if(desc.trim()!==undefined) cur.desc = desc.trim();
          save(); renderPiano(); toast('已修改'); break;
        }
        case 'piano-del': {
          const sId=t.dataset.s, idx=+t.dataset.i;
          if(!state.pianoEx[sId]) state.pianoEx[sId] = PIANO_STAGES.find(s=>s.id==sId).ex.map(e=>({id:uid(), title:e.title, desc:e.desc}));
          state.pianoEx[sId].splice(idx, 1);
          save(); renderPiano(); toast('已删除'); break;
        }
        case 'piano-add': {
          const sId=t.dataset.s;
          const title = prompt('添加你想练的真实曲目名称');
          if(!title || !title.trim()) break;
          const desc = prompt('说明/要点（可留空）', '') || '';
          if(!state.pianoEx[sId]) state.pianoEx[sId] = PIANO_STAGES.find(s=>s.id==sId).ex.map(e=>({id:uid(), title:e.title, desc:e.desc}));
          state.pianoEx[sId].push({ id: uid(), title: title.trim(), desc: desc.trim() });
          save(); renderPiano(); toast('已添加'); break;
        }
        case 'douyin-search': {
          // 唤起抖音 App 搜索该话题（网页端/未装App 则复制话题名兜底）
          openDouyinSearch(t.dataset.t || '');
          break;
        }
        case 'copy-topic': {
          // 抖音网页搜索已被平台封锁(404)，改为复制话题名，引导用户去 App 搜索
          const txt = (t.dataset.t || '').replace(/^#/, '');
          if (!txt) break;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(txt).then(()=>toast('已复制「' + txt + '」，去抖音 App 搜索框粘贴'), ()=>fallbackCopy(txt));
            } else { fallbackCopy(txt); }
          } catch (_) { fallbackCopy(txt); }
          function fallbackCopy(s) {
            try {
              const ta = document.createElement('textarea'); ta.value = s;
              ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
              document.execCommand('copy'); ta.remove();
              toast('已复制「' + s + '」，去抖音 App 搜索框粘贴');
            } catch (e) { toast('请手动复制：' + s); }
          }
          break;
        }
        case 'export': exportData(); break;
        case 'import': $('importFile').click(); break;
        case 'help-update': {
          openModal(`<h3>🔄 如何让 PWA 加载最新版</h3>
            <div class="card-sub" style="margin-bottom:14px">iOS PWA 会永久缓存之前的版本,所以即使代码更新了,你的桌面图标打开的还是旧版。</div>
            <div style="line-height:1.8;font-size:14px">
              <strong>方法一:标准步骤(推荐)</strong><br>
              1. <strong>长按桌面</strong>"我的工作台"图标 → 选「移除 App」<br>
              2. <strong>打开 Safari</strong>(不是点桌面图标)<br>
              3. 访问 <code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px">essie-lee.github.io/my-workbench</code><br>
              4. <strong>分享按钮</strong> → 「添加到主屏幕」<br>
              5. 用新的桌面图标打开,功能就都正常了
            </div>
            <hr style="margin:14px 0;border:none;border-top:1px solid var(--line)">
            <div style="line-height:1.8;font-size:14px">
              <strong>方法二:重置数据(慎用)</strong><br>
              如果某些页面(如读书/选题)打不开,可以点击下面按钮清空所有数据,等同于全新安装。
            </div>
            <div class="modal-actions">
              <button class="btn subtle" data-action="reset-data" style="color:var(--red)">🗑 清空所有数据并重置</button>
              <button class="btn subtle" data-action="modal-close">关闭</button>
            </div>`);
          break;
        }
        case 'book-cat': { state.bookCat = t.dataset.c; save(); renderBook(); break; }
        case 'reset-data': {
          if (confirm('确定要清空所有数据吗?这会删除你所有的任务/学习进度/收藏/笔记,且无法恢复。')) {
            localStorage.removeItem(KEY);
            location.reload();
          }
          break;
        }
        // ===== 记账模块 =====
        case 'bill-type': { state.bill._type = t.dataset.t; renderBill(); break; }
        case 'add-bill': {
          const amt = parseFloat(($('billAmt').value || '').trim());
          if (!amt || amt <= 0) { toast('请输入有效金额'); break; }
          const type = state.bill._type === 'inc' ? 'inc' : 'exp';
          state.bill.flows.push({
            id: uid(), type,
            cat: $('billCat').value,
            book: $('billBook').value || state.bill.curBook,
            amount: Math.round(amt*100)/100,
            note: ($('billNote').value || '').trim(),
            date: today(),
            ts: Date.now()
          });
          save();
          toast((type==='inc'?'已记收入 ':'已记支出 ') + fmtMoney(amt));
          renderBill();
          break;
        }
        case 'del-bill': {
          const id = t.dataset.id;
          state.bill.flows = state.bill.flows.filter(f => f.id !== id);
          save(); renderBill(); break;
        }
        case 'set-budget': {
          const v = parseFloat(($('billBudget').value || '').trim());
          state.bill.budget = isNaN(v) || v < 0 ? 0 : Math.round(v*100)/100;
          save(); toast('预算已保存 ' + fmtMoney(state.bill.budget));
          renderBill(); break;
        }
        case 'open-link': {
          // 跳外部链接（抖音/小红书/B站/豆瓣等）
          // 关键修复：PWA standalone 下不能用 window.location.href 替换整个页面，
          // 否则页面栈被替换、丢失返回按钮，且抖音/小红书 webview 会白屏拦截。
          // 正确做法：始终用新窗口打开，并保留 PWA 自身页面（可返回）。
          const url = t.dataset.url;
          if (!url) break;
          openExternal(url);
          break;
        }
        case 'open-platform': {
          const u = t.dataset.u;
          if (u) window.location.href = u;
          break;
        }
        case 'open-avatar': openAvatarModal(); break;
        case 'pick-avatar': {
          const k = t.dataset.k;
          if (k && AVATARS[k]) {
            state.avatar = k;
            save();
            renderDrawerAvatar();
            closeAvatarModal();
            closeDrawer(); // 自动关闭抽屉,避免头像被 modal 半透明遮罩"压"住
            toast(`已切换为${AVATARS[k].name} · 桌面图标需重新添加 PWA 才能同步`);
          }
          break;
        }
        case 'close-avatar': closeAvatarModal(); break;
        case 'modal-close': closeModal(); break;
      }
    });

    function exportData(){
      const data = JSON.stringify(state);
      try {
        const blob = new Blob([data], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = '我的工作台数据.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
      } catch(e) {
        // file:// 下 download 可能受限，退化为复制文本
        const ta = document.createElement('textarea'); ta.value = data; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); alert('数据已复制到剪贴板，可粘贴保存为 .json 文件'); } catch(_) { alert('导出失败，请用桌面浏览器操作'); }
        ta.remove();
      }
    }
    function importData(file){
      const r = new FileReader();
      r.onload = () => { try {
        const s = JSON.parse(r.result);
        if (!s || typeof s !== 'object') throw new Error('格式错误');
        Object.assign(state, s); save(); alert('导入成功！'); navigate(currentView);
      } catch(e){ alert('文件格式错误，导入失败'); } };
      r.readAsText(file);
    }

    function rename(){ const n=prompt('给工作台起个名字：', state.wbName); if(n&&n.trim()){ state.wbName=n.trim(); save(); $('pageTitle').textContent=state.wbName; $('drawerName').textContent=state.wbName; } }

    // 渲染抽屉顶部头像
    function renderDrawerAvatar(){
      const key = state.avatar || 'cat';
      const av = $('drawerAvatar');
      if (av) { av.innerHTML = avatarSVG(key); av.style.background = 'transparent'; }
      const an = $('drawerAvatarName');
      if (an) an.textContent = avatarName(key);
    }
    function openAvatarModal(){
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.id = 'avatarModalMask';
      mask.innerHTML = `
        <div class="modal">
          <h3>选一只小动物陪你</h3>
          <div class="card-sub" style="margin-bottom:14px">点一下切换,会出现在抽屉头像和顶部 banner 上</div>
          <div class="av-picker">
            ${Object.entries(AVATARS).map(([k,v])=>`
              <div class="av-pick ${state.avatar===k?'sel':''}" data-action="pick-avatar" data-k="${k}">
                <div class="av-circle">${v.svg}</div>
                <div class="av-name">${v.name}</div>
              </div>`).join('')}
          </div>
          <div class="modal-actions">
            <button class="btn subtle" data-action="close-avatar">取消</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      mask.addEventListener('click', e => { if (e.target === mask) closeAvatarModal(); });
    }
    function closeAvatarModal(){
      const m = $('avatarModalMask');
      if (m) m.remove();
    }
    $('pageTitle').addEventListener('click', rename);
    $('drawerName').addEventListener('click', rename);

    // ===================== 深色模式（v14 新增：此前样式已写好但无切换入口） =====================
    function applyTheme(mode) {
      const root = document.getElementById('htmlRoot');
      const btn = $('themeBtn');
      if (mode === 'dark') { root.setAttribute('data-theme', 'dark'); if (btn) btn.textContent = '☀️'; }
      else { root.removeAttribute('data-theme'); if (btn) btn.textContent = '🌗'; }
      try { localStorage.setItem('growth-os-theme', mode); } catch (_) {}
    }
    // 首次：优先用 localStorage，否则跟随系统
    (function initTheme() {
      let saved;
      try { saved = localStorage.getItem('growth-os-theme'); } catch (_) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    })();
    if ($('themeBtn')) {
      $('themeBtn').addEventListener('click', () => {
        const isDark = document.getElementById('htmlRoot').getAttribute('data-theme') === 'dark';
        applyTheme(isDark ? 'light' : 'dark');
        toast(isDark ? '已切换到浅色' : '已切换到深色');
      });
    }
    // 跟随系统变化（用户未手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        let saved; try { saved = localStorage.getItem('growth-os-theme'); } catch (_) {}
        if (!saved) applyTheme(e.matches ? 'dark' : 'light');
      });
    }

    // ===================== 初始化 =====================
    warmVoices();
    $('menuBtn').addEventListener('click', openDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    $('importFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
    $('topDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
    $('pageTitle').textContent = state.wbName;
    $('drawerName').textContent = state.wbName;
    renderDrawerAvatar();
    // 初始化用户钢琴练习曲目（用默认真实经典曲目填充，之后可自由编辑/添加）
    if (!state.pianoEx) {
      state.pianoEx = {};
      PIANO_STAGES.forEach(s => { state.pianoEx[s.id] = s.ex.map(e => ({ id: uid(), title: e.title, desc: e.desc })); });
      save();
    }
    window.state = state;
    // 启动时拉取今日热点（GitHub Actions 每天自动生成 _data/hotspots.json）
    prefetchHotspots();
    // 启动时根据 URL hash 直接跳到对应模块（修打开 #book 还是首页的 bug）
    const startView = (location.hash || '#home').slice(1);
    navigate(VIEWS[startView] ? startView : 'home');
  </script>
</body>
</html>
