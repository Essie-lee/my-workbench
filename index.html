<style>
/* =====================================================================
   我的工作台 · 全新设计系统 (UI Designer Redesign)
   设计语言: "Calm Growth OS" — 柔和层叠、温润留白、克制强调
   仅替换样式层,JS / 数据 / 钢琴模块 100% 保留
   ===================================================================== */

/* ---------- 设计令牌 (Design Tokens) ---------- */
:root{
  /* 表面与背景 */
  --bg:        #eef1f8;
  --bg-2:      #ffffff;
  --panel:     #ffffff;
  --panel-2:   #f7f9fd;
  --panel-ins: #f1f4fa;

  /* 文字层级 */
  --ink-1: #15171c;   /* 标题 */
  --ink-2: #3d424d;   /* 正文 */
  --ink-3: #6a6f7b;   /* 次要 */
  --muted: #9aa0ad;   /* 弱提示 */

  /* 分割线 */
  --line:   #e6e9f0;
  --line-1: #e0e4ee;
  --line-2: #eef1f7;
  --line-3: #f6f8fc;

  /* 品牌主色 (克制蓝) */
  --primary:        #3b6fff;
  --primary-hover:  #2f5fe6;
  --primary-pressed:#2750c9;
  --primary-soft:   #e9f0ff;
  --primary-dark:   #1f3fa8;

  /* 语义 / 辅助色 */
  --accent:      #f5801f;
  --accent-soft: #fff1e3;
  --accent-ink:  #b65a08;
  --green:       #18a558;
  --green-soft:  #e3f6ec;
  --red:         #e5484d;
  --red-soft:    #fdecec;
  --purple:      #7c3aed;
  --purple-soft: #efe8fe;
  --pink:        #d6409f;
  --pink-soft:   #fce4f3;
  --gold:        #d99a1c;
  --gold-soft:   #fbf0d6;
  --teal:        #0ea5b7;
  --teal-soft:   #d6f3f6;
  --rose:        #e8597a;
  --rose-soft:   #fce0e8;

  /* 补充语义色（修复未定义令牌的兜底泄漏） */
  --blue:        var(--primary);
  --blue-soft:   var(--primary-soft);
  --gray:        #9aa3b2;
  --gray-soft:   #eceff5;

  /* 语义 / 反馈色（报警、校验、收入、热力） */
  --red-ink:      #b3261e;
  --heat-1:       #d8f3e0;
  --heat-2:       #b6e8c8;
  --heat-3:       #7fd6a3;
  --heat-4:       #3fa76a;
  --expense-a:    var(--accent);
  --expense-b:    var(--red);
  --accent-bright:#ffb066;

  /* 圆角 */
  --radius:    18px;
  --radius-sm: 12px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  /* 阴影 (柔和、低透明蓝调) */
  --shadow-sm:  0 1px 2px rgba(20,30,60,.05), 0 2px 6px rgba(20,30,60,.05);
  --shadow:     0 4px 14px rgba(20,30,60,.07), 0 1px 3px rgba(20,30,60,.05);
  --shadow-md:  0 10px 30px rgba(20,30,60,.10);
  --shadow-lg:  0 18px 50px rgba(20,30,60,.14);
  --shadow-pop: 0 12px 28px rgba(20,30,60,.12);
  --shadow-soft:0 1px 3px rgba(20,30,60,.05);

  /* 动效 */
  --ease: cubic-bezier(.22,.61,.36,1);
  --t-fast: .15s var(--ease);
  --t:      .25s var(--ease);

  /* 字体 */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable","Segoe UI",
          "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}

/* ---------- 深色模式 ---------- */
[data-theme="dark"]{
  --bg:        #0e1014;
  --bg-2:      #161a22;
  --panel:     rgba(30,34,44,.72);
  --panel-2:   #1a1f29;
  --panel-ins: #20262f;

  --ink-1: #f2f4f8;
  --ink-2: #c6cbd6;
  --ink-3: #8b909d;
  --muted: #6b7180;

  --line:   rgba(255,255,255,.09);
  --line-1: rgba(255,255,255,.12);
  --line-2: rgba(255,255,255,.07);
  --line-3: rgba(255,255,255,.04);

  --primary:        #6f9bff;
  --primary-hover:  #84aaff;
  --primary-pressed:#5a86f0;
  --primary-soft:   rgba(80,120,255,.16);
  --primary-dark:   #aac4ff;

  --accent:      #ffa057;
  --accent-soft: rgba(245,128,31,.16);
  --accent-ink:  #ffc187;
  --green:       #3fd089;
  --green-soft:  rgba(24,165,88,.18);
  --red:         #ff6b6f;
  --red-soft:    rgba(229,72,77,.18);
  --purple:      #b18cff;
  --purple-soft: rgba(124,58,237,.20);
  --pink:        #ff7fc8;
  --pink-soft:   rgba(214,64,159,.18);
  --gold:        #ffc861;
  --gold-soft:   rgba(217,154,28,.18);
  --teal:        #34d0e0;
  --teal-soft:   rgba(14,165,183,.18);
  --rose:        #ff8fb0;
  --rose-soft:   rgba(232,89,122,.18);

  --blue:        var(--primary);
  --blue-soft:   var(--primary-soft);
  --gray:        #5b6472;
  --gray-soft:   rgba(255,255,255,.06);

  --red-ink:      #ff8a8a;
  --heat-1:       #173326;
  --heat-2:       #1f4231;
  --heat-3:       #2a5e42;
  --heat-4:       #3fa76a;
  --expense-a:    var(--accent);
  --expense-b:    var(--red);
  --accent-bright:#ffb066;

  --shadow-sm:  0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25);
  --shadow:     0 6px 18px rgba(0,0,0,.35);
  --shadow-md:  0 14px 36px rgba(0,0,0,.45);
  --shadow-lg:  0 22px 60px rgba(0,0,0,.5);
  --shadow-pop: 0 14px 32px rgba(0,0,0,.45);
  --shadow-soft:0 1px 3px rgba(0,0,0,.3);
}

/* ---------- 重置 ---------- */
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html,body{ height:100%; }
body{
  font-family:var(--font);
  color:var(--ink-2); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 600px at 12% -5%, rgba(59,111,255,.10), transparent 55%),
    radial-gradient(800px 600px at 100% 0%, rgba(124,58,237,.07), transparent 50%),
    radial-gradient(700px 700px at 95% 100%, rgba(245,128,31,.06), transparent 55%),
    radial-gradient(700px 600px at 0% 100%, rgba(24,165,88,.06), transparent 55%);
  background-attachment:fixed;
  transition:background-color var(--t);
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(900px 600px at 12% -5%, rgba(111,155,255,.12), transparent 55%),
    radial-gradient(800px 600px at 100% 0%, rgba(177,140,255,.08), transparent 50%),
    radial-gradient(700px 700px at 95% 100%, rgba(255,160,87,.07), transparent 55%);
}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,select,textarea{ font-family:inherit; font-size:14px; }
a{ color:var(--primary); text-decoration:none; }
h1,h2,h3,h4{ color:var(--ink-1); font-weight:650; letter-spacing:-.01em; }
::selection{ background:var(--primary-soft); }

/* ---------- 容器 ---------- */
#app{ max-width:540px; margin:0 auto; min-height:100%; position:relative; }
@media (min-width:768px){ #app{ max-width:680px; } }
@media (min-width:1024px){ #app{ max-width:760px; } }

/* =====================================================================
   顶部栏 (Topbar)
   ===================================================================== */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--bg-2);
  background:color-mix(in srgb, var(--bg-2) 78%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.topbar h1{
  font-size:17px; font-weight:680; flex:1; cursor:pointer;
  color:var(--ink-1); letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .date{ font-size:12px; color:var(--muted); white-space:nowrap; }

.icon-btn{
  width:38px; height:38px; flex:0 0 auto;
  border:1px solid var(--line); background:var(--panel);
  border-radius:var(--radius-sm); font-size:17px; color:var(--ink-3);
  display:grid; place-items:center; box-shadow:var(--shadow-soft);
  transition:transform var(--t-fast), background var(--t-fast), border-color var(--t-fast);
}
.icon-btn:hover{ border-color:var(--line-1); color:var(--ink-2); }
.icon-btn:active{ transform:scale(.94); background:var(--panel-ins); }
.icon-btn.inline{
  width:28px; height:28px; font-size:13px; border-radius:9px;
  box-shadow:none; color:var(--muted); background:var(--panel-ins);
}
.icon-btn.inline:hover{ color:var(--red); }

/* 版本徽标 */
#appVer{
  font-size:10px; color:var(--muted); background:var(--panel-ins);
  padding:2px 7px; border-radius:var(--radius-pill); margin-left:2px;
  border:1px solid var(--line);
}

/* =====================================================================
   抽屉导航 (Drawer)
   ===================================================================== */
.overlay{
  position:fixed; inset:0; background:rgba(15,18,26,.42);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  z-index:55; opacity:0; visibility:hidden; transition:opacity var(--t), visibility var(--t);
}
.overlay.show{ opacity:1; visibility:visible; }

.drawer{
  position:fixed; top:0; left:0; width:80%; max-width:312px; height:100%;
  background:var(--bg-2);
  background:color-mix(in srgb, var(--bg-2) 88%, transparent);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  z-index:60; transform:translateX(-110%); transition:transform .28s var(--ease);
  box-shadow:var(--shadow-lg); display:flex; flex-direction:column;
  border-right:1px solid var(--line);
}
.drawer.open{ transform:translateX(0); }
.drawer-header{
  padding:calc(34px + env(safe-area-inset-top)) 20px 16px;
  border-bottom:1px solid var(--line-2);
  display:flex; align-items:center; gap:14px;
}
.drawer-header .avatar{
  width:50px; height:50px; border-radius:50%;
  background:var(--primary-soft); display:grid; place-items:center;
  font-size:26px; flex:0 0 auto; border:2px solid var(--panel);
  box-shadow:var(--shadow-sm);
}
.drawer-header .name{ font-weight:680; font-size:16px; color:var(--ink-1); cursor:pointer; }
.drawer-header .sub{ font-size:12px; color:var(--muted); margin-top:1px; }

.drawer-nav{ flex:1; padding:10px 12px; overflow-y:auto; }
.drawer-group{
  margin:14px 6px 6px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:8px;
}
.drawer-group:first-child{ margin-top:2px; }
.drawer-group::after{ content:''; flex:1; height:1px; background:var(--line); }

.drawer-nav button{
  position:relative; display:flex; align-items:center; width:100%;
  padding:11px 14px 11px 30px; margin:2px 0;
  border-radius:var(--radius-sm); font-size:14px; font-weight:500;
  color:var(--ink-2); text-align:left;
  transition:background var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.drawer-nav button::before{
  content:''; position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:7px; height:7px; border-radius:50%; background:var(--line-1);
  transition:background var(--t-fast), transform var(--t-fast);
}
.drawer-nav button[data-view="home"]::before{ background:var(--primary); }
.drawer-nav button[data-view="study"]::before{ background:var(--accent); }
.drawer-nav button[data-view="sport"]::before{ background:var(--green); }
.drawer-nav button[data-view="health"]::before{ background:var(--red); }
.drawer-nav button[data-view="topic"]::before{ background:var(--pink); }
.drawer-nav button[data-view="book"]::before{ background:var(--purple); }
.drawer-nav button[data-view="piano"]::before{ background:var(--gold); }
.drawer-nav button[data-view="daily"]::before{ background:var(--primary); }
.drawer-nav button[data-view="bill"]::before{ background:var(--green); }
.drawer-nav button[data-view="shoot"]::before{ background:var(--accent); }
.drawer-nav button[data-view="diary"]::before{ background:var(--pink); }
.drawer-nav button[data-view="game"]::before{ background:var(--purple); }
.drawer-nav button:not([data-view])::before{ display:none; }
.drawer-nav button:hover{ background:var(--panel-ins); }
.drawer-nav button:active{ transform:scale(.98); }
.drawer-nav button.active{
  background:var(--primary-soft); color:var(--primary-dark); font-weight:650;
}
.drawer-nav button.active::before{ background:var(--primary); transform:translateY(-50%) scale(1.25); }

.drawer .btn{ font-size:13px; }

/* =====================================================================
   底部标签栏 (Tabbar)
   ===================================================================== */
#tabbar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom)); z-index:40;
  width:calc(100% - 28px); max-width:480px;
  display:flex; gap:4px; padding:7px;
  background:var(--bg-2);
  background:color-mix(in srgb, var(--bg-2) 82%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--line); border-radius:var(--radius-pill);
  box-shadow:var(--shadow-md);
}
#tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:7px 4px; border-radius:var(--radius-pill);
  font-size:10.5px; font-weight:600; color:var(--muted);
  transition:color var(--t-fast), background var(--t-fast), transform var(--t-fast);
}
#tabbar button .ic{ font-size:19px; line-height:1; filter:grayscale(.4); transition:filter var(--t-fast), transform var(--t-fast); }
#tabbar button:active{ transform:scale(.92); }
#tabbar button.active{
  color:var(--primary-dark); background:var(--primary-soft);
}
#tabbar button.active .ic{ filter:none; transform:translateY(-1px); }

/* =====================================================================
   主内容 (Main)
   ===================================================================== */
#main{ padding:6px 14px 96px; }

/* 区块标题 */
.section-title{
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:700; color:var(--ink-1);
  margin:22px 4px 10px; letter-spacing:.01em;
}
.section-title::before{
  content:''; width:4px; height:14px; border-radius:var(--radius-pill);
  background:linear-gradient(var(--primary), var(--primary-hover));
}
.section-title:first-child{ margin-top:12px; }

.empty{ text-align:center; color:var(--muted); padding:40px 0; }

/* =====================================================================
   卡片 (Card)
   ===================================================================== */
.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow-sm);
  transition:transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
}
.card + .card{ margin-top:12px; }
.card-title{ font-size:15px; font-weight:680; color:var(--ink-1); }
.card-sub{ font-size:13px; color:var(--ink-3); margin-top:4px; line-height:1.6; }

/* ===== 个性化 Hero 头部 ===== */
.hero{
  position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--primary-soft), color-mix(in srgb, var(--purple-soft) 85%, transparent));
  border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:18px 18px; margin:6px 0 2px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  box-shadow:var(--shadow-sm);
}
.hero::before{
  content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
  background:radial-gradient(circle, var(--accent-soft), transparent 70%); opacity:.7;
}
.hero-greet{ min-width:0; position:relative; }
.hero-hi{ font-size:19px; font-weight:760; color:var(--ink-1); letter-spacing:-.02em; }
.hero-hi b{ color:var(--primary-dark); }
.hero-date{ font-size:12.5px; color:var(--ink-3); margin-top:3px; }
.hero-sub{ font-size:12.5px; color:var(--ink-3); margin:2px 2px 6px; padding:0 2px; }
.hero-ring{
  flex:0 0 auto; width:62px; height:62px; border-radius:50%;
  display:grid; place-items:center; position:relative;
  background:conic-gradient(var(--primary) calc(var(--p,0)*1%), var(--line) 0);
  box-shadow:var(--shadow-soft);
}
.hero-ring::before{ content:''; position:absolute; inset:6px; border-radius:50%; background:var(--panel); }
.hero-ring span{ position:relative; font-size:14px; font-weight:780; color:var(--ink-1); font-feature-settings:"tnum"; }

/* 钢琴模块专用金色 hero */
.hero.piano-hero{
  background:linear-gradient(135deg, var(--gold-soft), color-mix(in srgb, var(--gold-soft) 65%, transparent));
  border-color:color-mix(in srgb, var(--gold) 22%, var(--line));
}
.hero.piano-hero::before{
  background:radial-gradient(circle, color-mix(in srgb, var(--gold) 28%, transparent), transparent 70%);
}
.hero.piano-hero .hero-hi b{ color:var(--gold); }

/* 首页：区块统一间距 + 可折叠大卡片 */
.home-stack{ display:block; }
.home-stack > * + *{ margin-top:14px; }
.home-stack .hero{ margin:0; }
.home-sec{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden;
}
.home-sec > summary.home-sec-head{
  list-style:none; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; gap:10px;
  padding:14px 16px; font-size:14.5px; font-weight:680; color:var(--ink-1);
  cursor:pointer; user-select:none;
}
.home-sec > summary.home-sec-head::-webkit-details-marker{ display:none; }
.home-sec .hs-chev{
  order:-1; font-size:11px; line-height:1; color:var(--muted);
  transition:transform var(--t-fast);
}
.home-sec[open] > summary.home-sec-head .hs-chev{ transform:rotate(90deg); }
.home-sec[open] > summary.home-sec-head{ border-bottom:1px solid var(--line-2); }
.home-sec-body{ padding:12px 14px 14px; }
.home-sec-body > .section-title:first-child{ display:none; }
.home-sec-body > .card:first-child{ margin-top:0; }
/* 折叠块展开时：内层卡片去掉边框/阴影、贴边，避免与外层大卡片双重边框（保留 tint 底色） */
.home-sec[open] .home-sec-body > .card{ border:none; box-shadow:none; padding:0; }

/* 首页模块 → 签名色磁贴 */
.dash-row{
  display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
}
@media (min-width:560px){ .dash-row{ grid-template-columns:repeat(3,1fr); } }
.dash-pill{
  --c:var(--primary); --c-soft:var(--primary-soft);
  position:relative; overflow:hidden;
  background:var(--panel); border:1px solid var(--line);
  border-radius:20px; padding:14px 14px 13px;
  display:flex; flex-direction:column; gap:11px;
  box-shadow:var(--shadow-sm); cursor:pointer;
  transition:transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
}
.dash-pill:active{ transform:scale(.97); }
.dash-pill:hover{ box-shadow:var(--shadow); }
.dash-pill .dp-top{ display:flex; align-items:center; gap:9px; }
.dash-pill .dp-top span:first-child{
  width:42px; height:42px; border-radius:13px; flex:0 0 auto;
  display:grid; place-items:center; font-size:22px;
  background:var(--c-soft);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.02);
}
.dash-pill .dp-top span:last-child{ font-size:13px; font-weight:660; color:var(--ink-2); }
.dash-pill .dp-num{
  font-size:12.5px; font-weight:650; color:var(--ink-3); line-height:1.3;
  letter-spacing:.02em; margin-top:1px;
}
.dash-pill .dp-lbl{ font-size:11px; color:var(--muted); }
.dash-pill.done{ border-color:color-mix(in srgb, var(--green) 38%, var(--line)); }
.dash-pill.done .dp-num{ color:var(--green); }
/* 各模块专属色 */
.dash-pill[data-v="topic"]{ --c:var(--pink);    --c-soft:var(--pink-soft); }
.dash-pill[data-v="piano"]{ --c:var(--gold);    --c-soft:var(--gold-soft); }
.dash-pill[data-v="book"]{  --c:var(--purple);  --c-soft:var(--purple-soft); }
.dash-pill[data-v="study"]{ --c:var(--accent);  --c-soft:var(--accent-soft); }
.dash-pill[data-v="shoot"]{ --c:var(--teal);    --c-soft:var(--teal-soft); }
.dash-pill[data-v="bill"]{  --c:var(--green);   --c-soft:var(--green-soft); }
.dash-pill[data-v="health"]{--c:var(--red);     --c-soft:var(--red-soft); }
.dash-pill[data-v="diary"]{ --c:var(--rose);    --c-soft:var(--rose-soft); }

/* 今日聚焦 · 最小行动推荐引擎(P12) */
.focus-card{ padding:8px; }
.focus-row{ display:flex; align-items:center; gap:12px; padding:11px 10px; border-radius:14px; cursor:pointer; transition:background var(--t-fast), transform var(--t-fast); }
.focus-row + .focus-row{ border-top:1px solid var(--line-2); }
.focus-row:active{ transform:scale(.985); }
.focus-row:hover{ background:var(--primary-soft); }
.focus-ic{ width:42px; height:42px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center; font-size:22px; background:var(--primary-soft); }
.focus-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.focus-t{ font-size:14.5px; font-weight:680; color:var(--ink-1); }
.focus-s{ font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.focus-go{ flex:0 0 auto; font-size:12.5px; font-weight:620; color:var(--primary); padding-left:10px; white-space:nowrap; }
.focus-done{ font-size:13.5px; color:var(--ink-2); line-height:1.7; text-align:center; padding:14px 8px; }

/* 统计卡片 */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px; text-align:left;
  box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:2px;
}
.stat-card .num{ font-size:26px; font-weight:740; color:var(--primary); font-feature-settings:"tnum"; letter-spacing:-.02em; }
.stat-card .lbl{ font-size:12px; color:var(--muted); }

/* 今日学习内容行 */
.learn-row{
  border-radius:var(--radius-sm); transition:background var(--t-fast);
}
.learn-row:last-child{ border-bottom:none !important; }
.learn-row:hover{ background:var(--panel-ins); }
.learn-row span:nth-child(2){ color:var(--primary) !important; font-weight:700 !important; }

/* 今日书摘 */
.quote{
  font-size:15px; line-height:1.7; color:var(--ink-1); font-weight:500;
  padding:4px 0; border-left:3px solid var(--purple); padding-left:14px; margin-left:2px;
}
.quote .by{ display:block; margin-top:8px; font-size:12.5px; color:var(--muted); font-weight:400; border:none; padding:0; }

/* =====================================================================
   按钮 (Button)
   ===================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:var(--radius-sm);
  font-size:14px; font-weight:620; color:#fff;
  background:var(--primary); box-shadow:var(--shadow-soft);
  transition:transform var(--t-fast), background var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast);
}
.btn:hover{ background:var(--primary-hover); box-shadow:var(--shadow); }
.btn:active{ transform:scale(.97); background:var(--primary-pressed); }
.btn:disabled{ opacity:.55; pointer-events:none; }

.btn.sm{ padding:9px 14px; font-size:13px; border-radius:10px; }

.btn.accent{ background:var(--accent); }
.btn.accent:hover{ background:#e0730f; }
.btn.accent:active{ background:#c9650b; }

.btn.outline{
  background:transparent; color:var(--ink-2); border:1px solid var(--line-1);
  box-shadow:none;
}
.btn.outline:hover{ background:var(--panel-ins); border-color:var(--muted); }
.btn.outline.gold{ color:var(--gold); border-color:color-mix(in srgb, var(--gold) 45%, var(--line-1)); background:var(--gold-soft); }
.btn.outline.gold:hover{ background:color-mix(in srgb, var(--gold-soft) 80%, var(--gold)); border-color:var(--gold); }

.btn.subtle{ background:var(--panel-ins); color:var(--ink-2); box-shadow:none; }
.btn.subtle:hover{ background:var(--line); }

.btn.ghost{ background:transparent; color:var(--ink-3); box-shadow:none; }
.btn.ghost:hover{ background:var(--panel-ins); color:var(--ink-2); }

/* =====================================================================
   标签 / 胶囊 (Tag / Pill)
   ===================================================================== */
.tag{
  display:inline-flex; align-items:center; gap:3px;
  padding:3px 9px; border-radius:var(--radius-pill);
  font-size:11.5px; font-weight:650; line-height:1.4;
  background:var(--panel-ins); color:var(--ink-3);
}
.tag.primary{ background:var(--primary-soft); color:var(--primary-dark); }
.tag.gray{ background:var(--panel-ins); color:var(--muted); }
.tag.accent{ background:var(--accent-soft); color:var(--accent-ink); }
.tag.outline{ background:transparent; border:1px solid var(--line-1); color:var(--ink-3); }

.pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 12px; border-radius:var(--radius-pill);
  font-size:12.5px; font-weight:600; cursor:pointer;
  background:var(--panel-ins); color:var(--ink-2);
  border:1px solid transparent; transition:all var(--t-fast);
}
.pill:hover{ background:var(--line); }
.pill.active{ background:var(--primary-soft); color:var(--primary-dark); }

/* =====================================================================
   清单项 (Item / Checklist)
   ===================================================================== */
.item{
  display:flex; align-items:center; gap:12px;
  padding:12px 4px; border-bottom:1px solid var(--line-2);
}
.item:last-child{ border-bottom:none; }
.item.done{ opacity:.6; }
.item.done .item-title{ text-decoration:line-through; color:var(--muted); }
.check{
  width:22px; height:22px; flex:0 0 auto; border-radius:7px;
  border:2px solid var(--line-1); background:var(--panel);
  display:grid; place-items:center; font-size:13px; color:#fff; font-weight:700;
  transition:all var(--t-fast); cursor:pointer;
}
.item.done .check{ background:var(--green); border-color:var(--green); }
.item-body{ flex:1; min-width:0; }
.item-title{ font-size:14px; font-weight:600; color:var(--ink-1); }
.item-desc{ font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:6px; align-items:center; }
@keyframes itemFlash { 0%{ background:var(--primary-soft); } 100%{ background:transparent; } }
.item.flash{ animation:itemFlash 1.7s ease-out; border-radius:var(--radius-sm); }
.item-actions{ flex:0 0 auto; }

/* =====================================================================
   进度条 (Progress)
   ===================================================================== */
.progress-wrap{ margin-top:8px; }
.progress{
  height:9px; border-radius:var(--radius-pill); background:var(--panel-ins);
  overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.progress span{
  display:block; height:100%; border-radius:var(--radius-pill);
  background:linear-gradient(90deg, var(--primary), var(--primary-hover));
  transition:width .5s var(--ease);
}

/* =====================================================================
   表单 (Forms)
   ===================================================================== */
.input{
  width:100%; padding:11px 14px; border:1px solid var(--line-1);
  border-radius:var(--radius-sm); background:var(--panel); color:var(--ink-1);
  transition:border-color var(--t-fast), box-shadow var(--t-fast);
}
.input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.input::placeholder{ color:var(--muted); }
.row{ display:flex; gap:10px; align-items:center; }
.flex-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.grid{ display:grid; gap:10px; }
.cols-2{ grid-template-columns:1fr 1fr; }

/* =====================================================================
   弹窗 (Modal)
   ===================================================================== */
.modal-mask{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center;
  padding:20px; background:rgba(15,18,26,.45);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  animation:fade .2s var(--ease);
}
.modal{
  width:100%; max-width:440px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:22px; box-shadow:var(--shadow-lg);
  animation:pop .25s var(--ease);
  max-height:86vh; overflow-y:auto;
}
.modal h3{ font-size:18px; margin-bottom:14px; }
.modal .field{ margin-bottom:14px; }
.modal label{ display:block; font-size:13px; color:var(--ink-3); margin-bottom:6px; font-weight:600; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }

@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes pop{ from{ opacity:0; transform:translateY(12px) scale(.97); } to{ opacity:1; transform:none; } }

/* =====================================================================
   学习中心 / 多语言 (Study & Languages)
   ===================================================================== */
.lang-sec{ margin-bottom:14px; }
.lang-sec > summary{
  list-style:none; display:flex; align-items:center; gap:12px;
  padding:12px 14px; cursor:pointer; user-select:none;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  transition:border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
.lang-sec > summary::-webkit-details-marker{ display:none; }
.lang-sec > summary:hover{ border-color:var(--line-1); box-shadow:var(--shadow-sm); }
.lang-sec[open] > summary{ border-radius:var(--radius-sm) var(--radius-sm) 0 0; border-bottom-color:transparent; }
.lang-sec .chev{ order:-1; color:var(--muted); font-size:12px; transition:transform var(--t-fast); flex-shrink:0; width:14px; text-align:center; }
.lang-sec[open] > summary .chev{ transform:rotate(90deg); }
.lang-sec .sec-count{
  order:-2; font-size:11px; font-weight:650; line-height:1;
  padding:4px 8px; border-radius:var(--radius-pill);
  background:var(--accent-soft); color:var(--accent-ink);
}
.lang-sec .sec-body{
  padding:12px; background:var(--panel); border:1px solid var(--line); border-top:0;
  border-radius:0 0 var(--radius-sm) var(--radius-sm); font-size:14px; line-height:1.8; color:var(--ink-2);
}
.lv-bar{
  height:8px; border-radius:var(--radius-pill); background:var(--panel-ins); overflow:hidden;
}
.lv-bar > * , .lv-bar > div{ height:100%; border-radius:var(--radius-pill); background:linear-gradient(90deg,var(--accent),var(--accent-bright)); }
.lv-dash{ display:flex; gap:4px; }
.goal-banner{
  background:linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent) 14%, var(--panel)));
  border:1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius:var(--radius); padding:18px;
  font-size:13.5px; color:var(--ink-1); line-height:1.6;
}
.goal-banner .gb-label{ font-weight:700; font-size:14px; margin-bottom:6px; }
.goal-banner .gb-text{ font-weight:600; font-size:15px; margin-bottom:8px; }
.goal-banner .gb-sub{ font-size:12.5px; color:var(--ink-3); line-height:1.6; }
.goal-chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:var(--radius-pill); background:var(--panel-ins); font-size:12px; font-weight:600; color:var(--ink-2); }

.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tabs button{
  padding:8px 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:600;
  background:var(--panel-ins); color:var(--ink-3); transition:all var(--t-fast);
}
.tabs button:hover{ color:var(--ink-2); }
.tabs button.active{ background:var(--primary-soft); color:var(--primary-dark); }
.lang-tabs button.active{ background:var(--accent-soft); color:var(--accent-ink); }

.opt{
  display:block; width:100%; text-align:left; padding:12px 14px;
  border:1px solid var(--line-1); border-radius:var(--radius-sm);
  background:var(--panel); color:var(--ink-2); font-size:14px; margin-bottom:8px;
  transition:all var(--t-fast);
}
.opt:hover{ border-color:var(--primary); }
.opt.sel{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark); font-weight:600; }
#langBody .opt:hover, #aq .opt:hover{ border-color:var(--accent); }
#langBody .opt.sel, #aq .opt.sel{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }

.sentence{ font-size:16px; line-height:1.7; color:var(--ink-1); font-weight:500; }
.cn,.zh{ color:var(--ink-2); }
.en{ color:var(--ink-1); }
.sl-body{ display:flex; flex-direction:column; gap:10px; }
.sl-r{ display:flex; gap:10px; padding:12px; border-radius:var(--radius-sm); background:var(--panel-ins); }
.sl-r.you{ background:var(--accent-soft); }
.sl-role{ font-size:10px; font-weight:700; color:var(--muted); min-width:42px; text-align:center; padding:3px 8px; border-radius:var(--radius-pill); background:var(--panel-ins); }
.scene-line .sl-role.you{ background:var(--accent-soft); color:var(--accent-ink); }
.sl-f{ flex:1; font-size:14px; color:var(--ink-1); }
.sl-play{ align-self:center; }
.sl-zh{ font-size:12.5px; color:var(--muted); }
.sg-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-weight:650; color:var(--ink-1); }
.sg-icon{ font-size:22px; }
.scene-group{ display:flex; flex-direction:column; gap:8px; }
.scene-line{ display:flex; align-items:flex-start; gap:10px; padding:12px; border-radius:var(--radius-sm); background:var(--panel); border:1px solid var(--line); }
.video-card{ display:block; padding:14px; border-radius:var(--radius-sm); background:var(--panel-ins); border:1px solid var(--line); color:var(--ink-1); font-weight:600; }
.video-card:hover{ border-color:var(--primary); }
.lang-sec .video-card:hover{ border-color:var(--accent); }
.sec-body{ font-size:14px; line-height:1.8; color:var(--ink-2); }
.sec-count{ font-size:12px; color:var(--muted); }
.reading{ color:var(--ink-2); }

/* 语言学习 overview 当前阶段仪表盘 */
.lang-dash{ padding:18px; }
.lang-dash .ld-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.lang-dash .ld-label{ font-size:12px; color:var(--muted); }
.lang-dash .ld-stage{ font-weight:700; font-size:18px; color:var(--ink-1); margin-top:4px; }
.lang-dash .ld-stage small{ font-weight:400; font-size:12px; color:var(--muted); margin-left:4px; }
.lang-dash .ld-bar{ margin-top:16px; }
.lang-dash .ld-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
@media (min-width:480px){
  .lang-dash .ld-stats{ grid-template-columns:1fr 1fr 1fr; }
}
.lang-dash .ld-stat{ background:var(--panel-ins); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; }
.lang-dash .ld-stat .ldsl{ font-size:11px; color:var(--muted); margin-bottom:4px; }
.lang-dash .ld-stat .ldsv{ font-weight:700; font-size:15px; color:var(--ink-1); }
.lang-dash .ld-stat .ldsv small{ font-weight:400; font-size:12px; color:var(--muted); }
.lang-dash .ld-action{ margin-top:16px; }

/* 今日三件套：移动端垂直堆叠更透气 */
.today-pick{ display:flex; flex-direction:column; gap:10px; }
.today-pick .tp-card{ padding:14px 16px; }

/* 语言学习模块内默认按钮/描边按钮统一用 accent */
#langBody{ margin-top:16px; }
#langBody .btn.sm:not(.outline):not(.ghost){ background:var(--accent); }
#langBody .btn.sm.outline{ color:var(--accent-ink); border-color:color-mix(in srgb, var(--accent) 35%, var(--line-1)); }
#langBody .btn.sm.outline:hover{ background:var(--accent-soft); border-color:var(--accent); }

/* 词汇高亮 */
.vocab-hl{ color:var(--accent); font-weight:650; cursor:pointer; border-bottom:1px dotted var(--accent); }
.vt-word{ font-size:18px; font-weight:700; color:var(--ink-1); }
.vt-pron{ margin-left:8px; color:var(--muted); font-size:13px; }
.vt-lv{ margin-left:8px; font-size:11px; padding:2px 7px; border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--accent-ink); }
.vt-mean{ margin-top:6px; font-size:14px; color:var(--ink-1); }
.vt-ex{ margin-top:6px; font-size:13px; color:var(--ink-3); font-style:italic; }
.vt-hint{ margin-top:10px; font-size:11px; color:var(--muted); text-align:center; }

/* 单词卡 / 资源卡 / 翻译卡 */
.vocab-card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  min-height:96px; padding:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  cursor:pointer; transition:all var(--t-fast);
}
.vocab-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-sm); }
.vocab-card .vc-word{ font-size:18px; font-weight:750; color:var(--ink-1); }
.vocab-card .vc-hint{ font-size:11px; color:var(--muted); margin-top:6px; }
.res-card{
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  margin-bottom:10px; transition:all var(--t-fast);
}
.res-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-sm); }
.res-card .rc-icon{ width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); display:grid; place-items:center; font-size:16px; flex-shrink:0; }
.res-card .rc-title{ font-weight:650; font-size:14px; color:var(--ink-1); }
.res-card .rc-url{ font-size:12px; color:var(--accent); word-break:break-all; }
.trans-card{
  padding:12px 14px; margin-bottom:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
}
.trans-card .tc-q{ font-weight:600; margin-bottom:6px; color:var(--ink-1); }
.trans-card .tc-hint{ font-size:12px; color:var(--muted); margin-bottom:10px; }

/* =====================================================================
   选题 / 拍摄 (Topic / Shoot)
   ===================================================================== */
.tp-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm); }
.tp-main{ font-size:15px; font-weight:650; color:var(--ink-1); }
.tp-sub{ font-size:13px; color:var(--ink-3); margin-top:4px; }
.tp-tag{ display:inline-block; margin-top:8px; font-size:11px; padding:3px 9px; border-radius:var(--radius-pill); background:var(--pink-soft); color:var(--pink); font-weight:650; }

/* =====================================================================
   运动 / 肌肉 (Sport / Muscle)
   ===================================================================== */
.sport-sec{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:10px; transition:box-shadow var(--t-fast); }
.sport-sec:hover{ box-shadow:var(--shadow-sm); }
.sport-sec > summary{ list-style:none; display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none; }
.sport-sec > summary::-webkit-details-marker{ display:none; }
.sport-sec .chev{ color:var(--muted); font-size:12px; transition:transform var(--t-fast); flex-shrink:0; width:14px; text-align:center; }
.sport-sec[open] > summary .chev{ transform:rotate(90deg); }
.sport-sec .ss-head{ flex:1; min-width:0; }
.sport-sec .sec-body{ padding:0 16px 16px; }
.sport-tabs{ display:flex; gap:6px; background:var(--panel-ins); padding:4px; border-radius:var(--radius-pill); margin-bottom:12px; }
.sport-tab{ flex:1; text-align:center; padding:8px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; color:var(--ink-3); transition:all var(--t-fast); cursor:pointer; }
.sport-tab.active{ background:var(--panel); color:var(--accent); box-shadow:var(--shadow-soft); }

/* =====================================================================
   书行 / 书单卡片 (Book Row)
   ===================================================================== */
.book-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-bottom:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  transition:box-shadow var(--t-fast), border-color var(--t-fast);
}
.book-row:hover{ box-shadow:var(--shadow-sm); border-color:var(--line-1); }
.book-row .br-main{ flex:1; min-width:0; }
.book-row .br-title{ font-weight:650; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-1); }
.book-row .br-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
.book-row .br-actions{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; }
.book-row .br-actions:empty{ display:none; }
.book-cover{
  width:46px; height:64px; border-radius:5px; flex-shrink:0;
  display:grid; place-items:center;
  font-size:18px; font-weight:750; color:var(--purple);
  background:var(--purple-soft);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--purple) 12%, transparent);
}
.book-cover img{ width:100%; height:100%; object-fit:cover; border-radius:5px; }

.muscle-canvas-wrap{
  position:relative; width:100%; aspect-ratio:3/4; max-height:340px;
  background:var(--panel-ins); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; display:grid; place-items:center; margin-bottom:10px;
}
.muscle-fallback{ color:var(--muted); font-size:13px; text-align:center; padding:20px; }
.muscle-heatmap{ display:flex; flex-wrap:wrap; gap:6px; }
.muscle-info{ font-size:13px; color:var(--ink-3); line-height:1.6; }
.muscle-toolbar{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.muscle-toolbar button{ padding:6px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:600; background:var(--panel-ins); color:var(--ink-3); }
.muscle-toolbar button.active{ background:var(--primary-soft); color:var(--primary-dark); }

.exercise{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
.exercise-title{ font-size:14.5px; font-weight:680; color:var(--ink-1); display:flex; align-items:center; gap:8px; }
.exercise-desc{ font-size:13px; color:var(--ink-3); margin-top:4px; }
.ex-pr-badge{ font-size:10.5px; padding:2px 7px; border-radius:var(--radius-pill); background:var(--gold-soft); color:var(--gold); font-weight:700; }
.ex-set-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
.ex-set-input{ width:64px; padding:7px 10px; border:1px solid var(--line-1); border-radius:9px; background:var(--panel); color:var(--ink-1); }
.ex-set-log{ font-size:12px; color:var(--muted); }

/* cardio (有氧) */
.cardio-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.cardio-icon{ font-size:22px; }
.cardio-name{ font-size:15px; font-weight:680; color:var(--ink-1); }
.cardio-label{ font-size:12px; color:var(--muted); }
.cardio-row{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
.cardio-field{ flex:1; min-width:90px; }
.cardio-unit{ font-size:12px; color:var(--muted); }
.cardio-form{ display:flex; flex-direction:column; gap:8px; }
.cardio-goal{ font-size:12px; color:var(--ink-3); }
.cardio-extra{ margin-top:8px; }
.cardio-done{ background:var(--green-soft); border:1px solid color-mix(in srgb,var(--green) 25%, transparent); border-radius:var(--radius-sm); padding:12px; }
.cardio-done-main{ font-size:14px; font-weight:650; color:var(--green); }
.cardio-done-min{ font-size:12px; color:var(--ink-3); }
.cardio-done-note{ font-size:12px; color:var(--muted); margin-top:2px; }
.cardio-done-main .cardio-done-note{ display:inline; }
.cardio-actions{ display:flex; gap:8px; margin-top:10px; }

/* =====================================================================
   健康 / 记账 (Health / Bill)
   ===================================================================== */
.budget-dashboard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm); }
.budget-dashboard.over{ background:var(--red-soft); border-color:color-mix(in srgb,var(--red) 30%,transparent); }
.budget-dashboard.warn{ background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 30%,transparent); }
.budget-main{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
.budget-hero{ flex:1; min-width:0; }
.budget-hero .budget-num{ font-size:12.5px; font-weight:650; color:var(--muted); letter-spacing:.02em; text-transform:uppercase; margin-bottom:4px; }
.budget-hero .budget-big{ font-size:36px; font-weight:760; color:var(--ink-1); line-height:1.1; letter-spacing:-.03em; }
.budget-side{ display:flex; flex-direction:column; gap:8px; text-align:right; flex-shrink:0; }
.budget-side-row{ display:flex; flex-direction:column; gap:1px; }
.budget-side-row .side-label{ font-size:11px; color:var(--muted); }
.budget-side-row .side-value{ font-size:17px; font-weight:720; color:var(--ink-1); font-feature-settings:"tnum"; line-height:1.2; }
.budget-side-row .side-value small{ font-size:11px; font-weight:500; color:var(--muted); }
.budget-status{ font-size:12.5px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.budget-bar-wrap{ margin-top:14px; }
.budget-bar-bg{ height:12px; border-radius:var(--radius-pill); background:var(--panel-ins); overflow:hidden; }
.budget-bar-fill{ height:100%; border-radius:var(--radius-pill); background:var(--g-green); transition:width .5s var(--ease); }
.budget-bar-fill.over{ background:var(--g-red); }
.budget-bar-fill.warn{ background:var(--g-accent); }

/* 日历 / 热力图 */
.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.day-cell{ aspect-ratio:1; border-radius:10px; background:var(--panel-ins); display:grid; place-items:center; font-size:12px; color:var(--ink-3); }
.day-cell.today{ background:var(--primary-soft); color:var(--primary-dark); font-weight:700; }
.day-bar{ display:flex; gap:4px; flex-wrap:wrap; }
.heat-dot{ width:14px; height:14px; border-radius:4px; background:var(--panel-ins); }
.heat-dot.on{ background:var(--green); }
.chart{ display:flex; align-items:flex-end; gap:4px; height:80px; }
.chart > *{ flex:1; background:var(--primary-soft); border-radius:4px 4px 0 0; }

/* 迷你统计 */
.mini-stat{ display:flex; flex-direction:column; gap:2px; padding:12px; border-radius:var(--radius-sm); background:var(--panel-ins); }
.ms-label{ font-size:11px; color:var(--muted); }
.ms-value{ font-size:18px; font-weight:700; color:var(--ink-1); }
.m-name{ font-size:14px; font-weight:650; color:var(--ink-1); }
.m-ex{ font-size:12px; color:var(--muted); }

/* =====================================================================
   日记 (Diary)
   ===================================================================== */
.diary-list{ display:flex; flex-direction:column; gap:10px; }
.diary-entry{ margin-bottom:10px; }
.diary-row{ display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; border-radius:12px; background:var(--panel); border:1px solid var(--line); transition:filter .15s; }
.diary-row:hover{ filter:brightness(.98); }
.diary-row .chev{ transition:transform .2s; color:var(--muted); font-size:12px; }
.diary-row.open .chev{ transform:rotate(90deg); }
.diary-detail{ margin-top:6px; }
.diary-chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:var(--radius-pill); background:var(--pink-soft); color:var(--pink); font-size:12px; font-weight:650; margin-right:6px; }
.diary-animals{ display:flex; gap:10px; flex-wrap:wrap; }

/* =====================================================================
   益智游戏 (Games)
   ===================================================================== */
.game-board{ display:grid; gap:6px; }
.gb-label{ font-size:13px; font-weight:650; color:var(--ink-1); }
.gb-sub{ font-size:12px; color:var(--muted); }
.gb-text{ font-size:14px; color:var(--ink-2); }

.sudoku{ display:grid; grid-template-columns:repeat(9,1fr); gap:2px; background:var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.sud-cell{ aspect-ratio:1; background:var(--panel); display:grid; place-items:center; font-size:15px; color:var(--ink-1); font-weight:600; }
.sud-cell:nth-child(3n):not(:nth-child(9n)){ border-right:2px solid var(--line-1); }

.xw{ display:grid; gap:2px; background:var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.xw-cell{ aspect-ratio:1; background:var(--panel); display:grid; place-items:center; font-size:14px; font-weight:600; color:var(--ink-1); }
.xw-cell.block{ background:var(--ink-1); }
.xw-pad{ margin-top:10px; }
.xn{ display:inline-grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.clue{ font-size:13px; color:var(--ink-2); }
.clue-list{ display:flex; flex-direction:column; gap:6px; }

.num-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.cell{ aspect-ratio:1; display:grid; place-items:center; border:1px solid var(--line-1); border-radius:8px; background:var(--panel); font-size:15px; font-weight:600; color:var(--ink-1); }
.cell.on{ background:var(--primary-soft); color:var(--primary-dark); }

/* =====================================================================
   头像选择器 (Avatar Picker)
   ===================================================================== */
.avatar{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:24px; background:var(--panel-ins); flex:0 0 auto; }
.av-picker{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.av-circle{ width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:32px; background:var(--panel-ins); cursor:pointer; border:2px solid transparent; transition:all var(--t-fast); justify-self:center; }
.av-circle:hover{ transform:scale(1.06); }
.av-circle.sel{ border-color:var(--primary); background:var(--primary-soft); }
.av-name{ text-align:center; font-size:11px; color:var(--muted); margin-top:2px; }
.av-pick{ display:flex; flex-direction:column; align-items:center; }

/* =====================================================================
   杂项 / 状态修饰 (Misc & State)
   ===================================================================== */
.wrap{ padding:0 4px; }
.mb{ margin-bottom:12px; }
.mt{ margin-top:12px; }
.muted{ color:var(--muted); }
.name{ font-weight:650; color:var(--ink-1); }
.lbl{ font-size:12px; color:var(--muted); }
.sub{ font-size:12px; color:var(--muted); }
.big{ font-size:20px; font-weight:700; color:var(--ink-1); }
.block{ display:block; }
.ghost{ color:var(--muted); }
.ic{ line-height:1; }
.play{ font-size:18px; }
.chev{ color:var(--muted); }
.date{ color:var(--muted); }
.memo-date{ font-size:12px; color:var(--muted); }
.memo-item{ padding:10px 0; border-bottom:1px solid var(--line-2); }
.notes{ font-size:13px; color:var(--ink-2); }

/* 状态修饰类 (JS 动态添加) */
.active{ }
.done{ }
.on{ }
.ok{ color:var(--green); }
.locked{ opacity:.5; }
.today{ }
.stage-card{ }
.sel{ }
.you{ }
.over{ color:var(--red); }
.over-num{ color:var(--red); font-weight:700; }
.over-text{ color:var(--red); }
.warn{ color:var(--accent-ink); }
.warn-text{ color:var(--accent-ink); }
.zero{ color:var(--green); }
.want{ }
.reading{ }
.sheet{ }

/* ss-* 拍摄阶段标签 */
.ss-title{ font-size:15px; font-weight:680; color:var(--ink-1); }
.ss-tag{ display:inline-block; font-size:11px; padding:3px 9px; border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--accent-ink); font-weight:650; }
.ss-sub{ font-size:12px; color:var(--muted); }

/* =====================================================================
   动效与可访问性
   ===================================================================== */
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }

/* 滚动条美化 */
.drawer-nav::-webkit-scrollbar, .modal::-webkit-scrollbar{ width:6px; }
.drawer-nav::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb{ background:var(--line-1); border-radius:3px; }

/* =====================================================================
   ★ Vivid Layer — 活力升级层 (v16)
   在 "Calm Growth OS" 之上叠加：渐变签名色 / 弹性动效 / 触控友好 /
   补全缺失组件样式。不删除任何既有类，仅增强。
   ===================================================================== */
:root{
  --spring: cubic-bezier(.34,1.42,.64,1);
  --t-spring:.36s var(--spring);

  /* 模块签名渐变 */
  --g-primary: linear-gradient(135deg,#4f7dff,#7a5cff);
  --g-accent:  linear-gradient(135deg,#ff9a3d,#ff6a3d);
  --g-green:   linear-gradient(135deg,#22c47c,#0fb0a0);
  --g-purple:  linear-gradient(135deg,#9b5cff,#d05bff);
  --g-pink:    linear-gradient(135deg,#ff5fae,#ff7a6b);
  --g-gold:    linear-gradient(135deg,#ffc244,#ff9b2f);
  --g-teal:    linear-gradient(135deg,#22c2d6,#3f8dff);
  --g-red:     linear-gradient(135deg,#ff6b6f,#ff4d8d);
  --g-rose:    linear-gradient(135deg,#ff7f9f,#ff9ec7);

  --tap: 44px;   /* 最小触控尺寸 */
}
[data-theme="dark"]{
  --g-primary: linear-gradient(135deg,#5f89ff,#9b7bff);
  --g-accent:  linear-gradient(135deg,#ffab5e,#ff8158);
  --g-green:   linear-gradient(135deg,#38d693,#17c2b1);
  --g-purple:  linear-gradient(135deg,#ac7bff,#dd7cff);
  --g-pink:    linear-gradient(135deg,#ff7cc0,#ff9585);
  --g-gold:    linear-gradient(135deg,#ffd06a,#ffab4d);
  --g-teal:    linear-gradient(135deg,#3ed3e6,#5c9dff);
  --g-red:     linear-gradient(135deg,#ff8286,#ff6ba0);
  --g-rose:    linear-gradient(135deg,#ff96b1,#ffb0d3);
}

/* ---------- 入场动效 ---------- */
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@keyframes floaty{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(-8px,6px) } }
#main > *{ animation:rise .34s var(--ease) both; }
#main > *:nth-child(1){ animation-delay:.01s } #main > *:nth-child(2){ animation-delay:.04s }
#main > *:nth-child(3){ animation-delay:.07s } #main > *:nth-child(4){ animation-delay:.10s }
#main > *:nth-child(5){ animation-delay:.13s } #main > *:nth-child(n+6){ animation-delay:.16s }

/* ---------- Hero 更有活力 ---------- */
.hero{
  background:
    linear-gradient(135deg, color-mix(in srgb,var(--primary) 16%, transparent), color-mix(in srgb,var(--purple) 14%, transparent) 60%, color-mix(in srgb,var(--accent) 12%, transparent));
  border-color:color-mix(in srgb,var(--primary) 16%, var(--line));
  box-shadow:0 10px 30px -14px color-mix(in srgb,var(--primary) 55%, transparent);
  flex-wrap:wrap;
}
.hero::before{
  width:180px; height:180px; right:-46px; top:-56px;
  background:radial-gradient(circle, color-mix(in srgb,var(--accent) 34%, transparent), transparent 70%);
  animation:floaty 9s ease-in-out infinite;
}
.hero::after{
  content:''; position:absolute; left:-40px; bottom:-60px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--green) 22%, transparent), transparent 70%);
  animation:floaty 11s ease-in-out infinite reverse;
}
.hero-hi{ font-size:20px; }
.hero-ring{ width:66px; height:66px; }
.hero-ring::before{ inset:7px; }
.hero-line{
  position:relative; flex:1 1 100%; font-size:12.5px; color:var(--ink-2);
  background:color-mix(in srgb,var(--panel) 62%, transparent);
  border-radius:var(--radius-pill); padding:7px 13px; margin-top:2px;
}
.hero-line b{ color:var(--primary-dark); font-feature-settings:"tnum"; }

/* ---------- 模块磁贴：签名渐变 ---------- */
.dash-pill{ --c:var(--primary); --c-soft:var(--primary-soft); --c-grad:var(--g-primary); }
.dash-pill::before{
  content:''; position:absolute; left:0; top:0; height:3px; width:100%;
  background:var(--c-grad); opacity:.9;
}
.dash-pill::after{
  content:''; position:absolute; right:-28px; bottom:-34px; width:88px; height:88px; border-radius:50%;
  background:var(--c-soft); opacity:.55; pointer-events:none;
}
.dash-pill > *{ position:relative; }
.dash-pill .dp-top span:first-child{ background:var(--c-soft); }
.dash-pill .dp-num{ color:var(--ink-3); }
.dash-pill:hover{ transform:translateY(-2px); box-shadow:0 12px 26px -14px color-mix(in srgb,var(--c) 70%, transparent); border-color:color-mix(in srgb,var(--c) 26%, var(--line)); }
.dash-pill:active{ transform:scale(.97); }
.dash-pill.done{ border-color:color-mix(in srgb,var(--green) 40%, var(--line)); }
.dash-pill.done .dp-num{ background:var(--g-green); -webkit-background-clip:text; background-clip:text; color:transparent; }
.dash-pill.done .dp-lbl{ color:var(--green); font-weight:650; }

.dash-pill[data-v="home"]  { --c:var(--primary); --c-soft:var(--primary-soft); --c-grad:var(--g-primary); }
.dash-pill[data-v="daily"] { --c:var(--primary); --c-soft:var(--primary-soft); --c-grad:var(--g-primary); }
.dash-pill[data-v="topic"] { --c:var(--pink);    --c-soft:var(--pink-soft);    --c-grad:var(--g-pink); }
.dash-pill[data-v="piano"] { --c:var(--gold);    --c-soft:var(--gold-soft);    --c-grad:var(--g-gold); }
.dash-pill[data-v="book"]  { --c:var(--purple);  --c-soft:var(--purple-soft);  --c-grad:var(--g-purple); }
.dash-pill[data-v="study"] { --c:var(--accent);  --c-soft:var(--accent-soft);  --c-grad:var(--g-accent); }
.dash-pill[data-v="shoot"] { --c:var(--teal);    --c-soft:var(--teal-soft);    --c-grad:var(--g-teal); }
.dash-pill[data-v="bill"]  { --c:var(--green);   --c-soft:var(--green-soft);   --c-grad:var(--g-green); }
.dash-pill[data-v="health"]{ --c:var(--red);     --c-soft:var(--red-soft);     --c-grad:var(--g-red); }
.dash-pill[data-v="sport"] { --c:var(--green);   --c-soft:var(--green-soft);   --c-grad:var(--g-green); }
.dash-pill[data-v="diary"] { --c:var(--rose);    --c-soft:var(--rose-soft);    --c-grad:var(--g-rose); }
.dash-pill[data-v="game"]  { --c:var(--purple);  --c-soft:var(--purple-soft);  --c-grad:var(--g-purple); }

/* ---------- 分组标题：可着色 ---------- */
.section-title::before{ background:var(--g-primary); }
.section-title[data-c="accent"]::before{ background:var(--g-accent) }
.section-title[data-c="green"]::before{  background:var(--g-green) }
.section-title[data-c="purple"]::before{ background:var(--g-purple) }
.section-title[data-c="pink"]::before{   background:var(--g-pink) }
.section-title[data-c="gold"]::before{   background:var(--g-gold) }
.section-title[data-c="teal"]::before{   background:var(--g-teal) }
.section-title[data-c="red"]::before{    background:var(--g-red) }
.section-title[data-c="rose"]::before{   background:var(--g-rose) }
.section-title .st-count{
  margin-left:auto; font-size:11px; font-weight:650; color:var(--muted);
  background:var(--panel-ins); padding:2px 9px; border-radius:var(--radius-pill);
  font-feature-settings:"tnum";
}

/* ---------- 卡片色调（tint）---------- */
.card.tint{ position:relative; overflow:hidden; }
.card.tint::before{
  content:''; position:absolute; inset:0 auto 0 0; width:4px; background:var(--g-primary);
}
.card.tint-green::before{  background:var(--g-green) }
.card.tint-accent::before{ background:var(--g-accent) }
.card.tint-purple::before{ background:var(--g-purple) }
.card.tint-pink::before{   background:var(--g-pink) }
.card.tint-gold::before{   background:var(--g-gold) }
.card.tint-teal::before{   background:var(--g-teal) }
.card.tint-red::before{    background:var(--g-red) }
.card.tint-rose::before{   background:var(--g-rose) }
.card.soft-green{  background:linear-gradient(180deg,var(--green-soft),transparent 70%),var(--panel); }
.card.soft-accent{ background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--panel); }
.card.soft-primary{background:linear-gradient(180deg,var(--primary-soft),transparent 70%),var(--panel); }
.card.soft-gold{   background:linear-gradient(180deg,var(--gold-soft),transparent 70%),var(--panel); }
.card.soft-purple{ background:linear-gradient(180deg,var(--purple-soft),transparent 70%),var(--panel); }
.card.soft-teal{   background:linear-gradient(180deg,var(--teal-soft),transparent 70%),var(--panel); }
.card.soft-rose{   background:linear-gradient(180deg,var(--rose-soft),transparent 70%),var(--panel); }
.card:hover{ box-shadow:var(--shadow); }

/* ---------- 模块切换条 (域内横滑) ---------- */
.seg-scroll{
  display:flex; gap:7px; overflow-x:auto; padding:3px 2px 9px;
  margin:2px -2px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.seg-scroll::-webkit-scrollbar{ display:none; }
.seg-scroll button{
  flex:0 0 auto; min-height:38px; padding:8px 15px; border-radius:var(--radius-pill);
  font-size:13px; font-weight:640; color:var(--ink-3);
  background:var(--panel); border:1px solid var(--line);
  box-shadow:var(--shadow-soft);
  transition:transform var(--t-fast), color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  white-space:nowrap;
}
.seg-scroll button:active{ transform:scale(.94); }
.seg-scroll button.active{
  color:#fff; border-color:transparent; background:var(--g-primary);
  box-shadow:0 6px 16px -8px color-mix(in srgb,var(--primary) 90%, transparent);
}
.seg-scroll button.active[data-v="study"]{ background:var(--g-accent) }
.seg-scroll button.active[data-v="piano"]{ background:var(--g-gold) }
.seg-scroll button.active[data-v="book"]{  background:var(--g-purple) }
.seg-scroll button.active[data-v="topic"]{ background:var(--g-pink) }
.seg-scroll button.active[data-v="shoot"]{ background:var(--g-teal) }

/* ---------- 分段控件 (难度 / 模式) ---------- */
.diff-pills{
  display:flex; gap:4px; padding:4px; border-radius:var(--radius-pill);
  background:var(--panel-ins); border:1px solid var(--line-2);
  overflow-x:auto; scrollbar-width:none;
}
.diff-pills::-webkit-scrollbar{ display:none }
.diff-pill{
  flex:1 0 auto; min-height:36px; padding:7px 14px; border-radius:var(--radius-pill);
  font-size:13px; font-weight:620; color:var(--ink-3); white-space:nowrap;
  transition:all var(--t-fast);
}
.diff-pill:hover{ color:var(--ink-1); }
.diff-pill.on, .diff-pill.active{
  background:var(--panel); color:var(--primary-dark);
  box-shadow:var(--shadow-soft); font-weight:700;
}
[data-theme="dark"] .diff-pill.on, [data-theme="dark"] .diff-pill.active{ background:var(--bg-2); }

/* ---------- 单词卡正面 ---------- */
.card-front{
  display:grid; place-items:center; text-align:center; gap:2px;
  min-height:96px; padding:16px;
  border-radius:var(--radius); border:1px dashed color-mix(in srgb,var(--primary) 32%, var(--line-1));
  background:linear-gradient(140deg,var(--primary-soft),transparent 70%),var(--panel);
  cursor:pointer; transition:transform var(--t-fast), box-shadow var(--t-fast);
}
.card-front:active{ transform:scale(.98); }
.card-front:hover{ box-shadow:var(--shadow); }

/* ---------- Toast ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px);
  background:color-mix(in srgb, #10131a 88%, transparent); color:#fff;
  padding:11px 20px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600;
  z-index:100; max-width:86%; text-align:center; pointer-events:none;
  box-shadow:var(--shadow-lg); opacity:0;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  transition:opacity .22s var(--ease), transform .3s var(--spring);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- 触控友好 ---------- */
.btn{ min-height:var(--tap); }
.btn.sm{ min-height:38px; }
.btn.block{ width:100%; }
.btn.grad{ background:var(--g-primary); }
.btn.grad:hover{ filter:brightness(1.06); background:var(--g-primary); }
.btn.grad.green{ background:var(--g-green) }
.btn.grad.accent{ background:var(--g-accent) }
.btn.grad.gold{ background:var(--g-gold) }
.btn.grad.purple{ background:var(--g-purple) }
.btn.grad.pink{ background:var(--g-pink) }
.btn.grad.teal{ background:var(--g-teal) }
.icon-btn{ min-width:38px; }
.icon-btn.inline{ min-width:32px; width:32px; height:32px; }
.check{ width:24px; height:24px; }
.item{ padding:13px 4px; }
.item .check{ position:relative; }
.item .check::after{
  content:''; position:absolute; inset:-11px; /* 扩大点按热区至 44px */
}
.item.done .check{ background:var(--g-green); border-color:transparent; }

/* ---------- 空状态 ---------- */
.empty{ padding:34px 16px; }
.empty-box{
  display:grid; place-items:center; gap:6px; text-align:center;
  padding:26px 16px; border-radius:var(--radius);
  border:1px dashed var(--line-1); background:var(--panel-ins);
  color:var(--muted); font-size:13px;
}
.empty-box .eb-ic{ font-size:28px; opacity:.75; }
.empty-box .eb-t{ font-weight:650; color:var(--ink-3); font-size:13.5px; }

/* ---------- 汇总指标行 ---------- */
.metric-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.metric{
  text-align:center; padding:10px 6px; border-radius:var(--radius-sm);
  background:var(--panel-ins);
}
.metric .mv{ font-size:17px; font-weight:760; color:var(--ink-1); font-feature-settings:"tnum"; line-height:1.2; }
.metric .mv.exp{ color:var(--red); }
.metric .mv.inc{ color:var(--green); }
.metric .mv.zero{ color:var(--muted); }
.metric .ml{ font-size:11px; color:var(--muted); margin-top:2px; }

/* 统计卡活力化 */
.stat-card{ position:relative; overflow:hidden; }
.stat-card .num{ background:var(--g-primary); -webkit-background-clip:text; background-clip:text; color:transparent; }

/* ---------- 进度条 ---------- */
.progress span{ background:var(--g-primary); }
.progress.green span{ background:var(--g-green); }
.progress.accent span{ background:var(--g-accent); }
.progress.teal span{   background:var(--g-teal); }
.progress.gold span{   background:var(--g-gold); }
.progress.purple span{ background:var(--g-purple); }
.progress.pink span{   background:var(--g-pink); }
.progress.rose span{   background:var(--g-rose); }
.lv-bar > *{ background:var(--g-accent); }
.budget-bar-fill{ background:var(--g-green); }

/* ---------- Tabbar 活力化 ---------- */
#tabbar button{ min-height:var(--tap); padding:6px 4px; }
#tabbar button.active{
  color:#fff; background:var(--g-primary);
  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--primary) 95%, transparent);
}
#tabbar button.active .ic{ filter:none; transform:translateY(-1px) scale(1.06); }
#tabbar button:not(.active):hover{ color:var(--ink-2); background:var(--panel-ins); }

/* ---------- 抽屉活力化 ---------- */
.drawer-nav button{ min-height:var(--tap); }
.drawer-nav button.active{ background:var(--primary-soft); }
.drawer-nav button.active::before{ background:var(--g-primary); box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%, transparent); }
.drawer-header .avatar{ background:var(--g-primary); color:#fff; }

/* ---------- 快速添加条 ---------- */
.quick-add{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.quick-add .input{ flex:1 1 150px; min-height:var(--tap); }
.quick-add select.input{ flex:0 0 auto; width:104px; }
.quick-add .btn{ flex:0 0 auto; }

/* ---------- 小徽标 ---------- */
.tag.green{ background:var(--green-soft); color:var(--green) }
.tag.purple{ background:var(--purple-soft); color:var(--purple) }
.tag.gold{ background:var(--gold-soft); color:var(--gold) }
.tag.teal{ background:var(--teal-soft); color:var(--teal) }
.tag.pink{ background:var(--pink-soft); color:var(--pink) }
.tag.red{ background:var(--red-soft); color:var(--red) }
.tag.rose{ background:var(--rose-soft); color:var(--rose) }
.tag.solid{ background:var(--g-primary); color:#fff }

/* ---------- 折叠块 ---------- */
details.fold{ border-top:1px solid var(--line-2); margin-top:12px; padding-top:10px; }
details.fold > summary{
  cursor:pointer; list-style:none; font-size:13px; font-weight:650; color:var(--ink-3);
  display:flex; align-items:center; gap:6px; min-height:36px;
}
details.fold > summary::-webkit-details-marker{ display:none }
details.fold > summary::after{ content:'▾'; margin-left:auto; transition:transform var(--t-fast); color:var(--muted); }
details.fold[open] > summary::after{ transform:rotate(180deg); }

/* ---------- 触控热区：勾选圈视觉不变，点击范围扩到 44px ---------- */
.check{ position:relative; }
.check::before{ content:''; position:absolute; inset:-10px; border-radius:50%; }
button.tag{ min-height:28px; display:inline-flex; align-items:center; gap:2px; }

/* ---------- 数独：数字键盘（原来只有裸 button，高度仅 15px）---------- */
.num-pad{ margin-top:12px; grid-template-columns:repeat(5,1fr); }
.numbtn{
  min-height:46px; border-radius:12px; background:var(--panel-ins);
  border:1px solid var(--line-1); color:var(--ink-1);
  font-size:18px; font-weight:700; font-feature-settings:"tnum";
  transition:transform var(--t-fast), background var(--t-fast);
}
.numbtn:hover{ background:var(--primary-soft); }
.numbtn:active{ transform:scale(.9); background:var(--primary-soft); color:var(--primary-dark); }
.numbtn:last-child{ background:var(--rose-soft); font-size:16px; }

/* ---------- 英文填字：把 26 个字母排成真正的键盘 ---------- */
.xw-pad{
  margin-top:12px; display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
}
.xw-pad button{
  min-height:40px; border-radius:10px; background:var(--panel-ins);
  border:1px solid var(--line-1); color:var(--ink-1);
  font-size:15px; font-weight:650; text-transform:uppercase;
  transition:transform var(--t-fast), background var(--t-fast);
}
.xw-pad button:hover{ background:var(--primary-soft); }
.xw-pad button:active{ transform:scale(.9); background:var(--primary-soft); color:var(--primary-dark); }
.xw-pad button:last-child{ grid-column:span 2; background:var(--rose-soft); }

/* ---------- 响应式：宽屏双列 ---------- */
@media (max-width:400px){
  .cols-2{ grid-template-columns:1fr; }
  .metric-row{ grid-template-columns:repeat(3,1fr); }
}

/* =====================================================================
   Batch 16 · UI 美化补强 (Calm Growth OS 2.0)
   目标：在不改动结构 / 数据的前提下，让 卡片 / 空状态 / 首页磁贴 / Tab / 我页 / 按钮
        观感更精致、更有层次。全部基于既有设计令牌，向后兼容。
   ===================================================================== */

/* ---- 卡片：克制的悬浮抬升 + 描边高亮（作用于全部页面的 .card） ---- */
.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
  border-color:color-mix(in srgb, var(--primary) 14%, var(--line));
}

/* ---- 按钮：实心按钮加一层柔光，更通透 ---- */
.btn{
  background-image:linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 58%);
}
.btn.outline, .btn.subtle, .btn.ghost, .btn:disabled{ background-image:none; }

/* ---- 空状态：图标入柔光圆，整体更友好（作用于全部 .empty-box） ---- */
.empty-box{
  gap:8px; padding:30px 18px;
  border:1px dashed color-mix(in srgb, var(--primary) 22%, var(--line-1));
  background:radial-gradient(130% 120% at 50% 0%, var(--panel-2), var(--panel-ins) 72%);
  box-shadow:var(--shadow-soft);
}
.empty-box .eb-ic{
  font-size:30px; opacity:1;
  width:54px; height:54px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--panel); box-shadow:var(--shadow-soft);
  margin-bottom:2px;
}
.empty-box .eb-t{ font-size:14px; color:var(--ink-2); }
.empty-box div:last-child{ font-size:12px; color:var(--muted); }

/* ---- 首页磁贴：悬浮抬升 + 右下角前进箭头 / 完成对勾 ---- */
.dash-pill{ border-radius:22px; padding:15px 14px 14px; }
.dash-pill:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.dash-pill::after{
  content:'›'; position:absolute; right:12px; bottom:12px;
  width:22px; height:22px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--c-soft); color:var(--c);
  font-size:17px; font-weight:700; line-height:1;
  opacity:0; transform:translateX(-4px);
  transition:opacity var(--t-fast), transform var(--t-fast);
}
.dash-pill:hover::after{ opacity:1; transform:translateX(0); }
.dash-pill.done::after{ content:'✓'; opacity:1; transform:translateX(0); background:var(--green-soft); color:var(--green); }

/* ---- Tabbar：激活态更轻盈 + 顶部小指示条 ---- */
#tabbar button{ position:relative; }
#tabbar button.active{
  color:var(--primary-dark);
  background:color-mix(in srgb, var(--primary-soft) 78%, transparent);
}
#tabbar button.active::after{
  content:''; position:absolute; top:3px; left:50%; transform:translateX(-50%);
  width:18px; height:3px; border-radius:var(--radius-pill);
  background:var(--primary); opacity:.85;
}
#tabbar button.active .ic{ filter:none; transform:translateY(-1px); }

/* ---- 我 · 个人页（重构 header / 数据条 / 操作列表） ---- */
.me-hero{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:14px;
  padding:18px; margin:4px 0 2px;
  background:linear-gradient(135deg, var(--primary-soft), color-mix(in srgb, var(--purple-soft) 70%, transparent));
  border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.me-hero::before{
  content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px;
  background:radial-gradient(circle, var(--accent-soft), transparent 70%); opacity:.6;
}
.me-avatar{
  flex:0 0 auto; width:60px; height:60px; border-radius:50%;
  display:grid; place-items:center; font-size:30px; position:relative;
  background:var(--panel); border:3px solid var(--primary);
  box-shadow:var(--shadow-soft); cursor:pointer;
}
.me-avatar:active{ transform:scale(.94); }
.me-id{ flex:1; min-width:0; position:relative; }
.me-name{ font-size:17px; font-weight:740; color:var(--ink-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.01em; }
.me-sub{ font-size:12px; color:var(--ink-3); margin-top:2px; }
.me-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
.me-stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 8px; text-align:center; box-shadow:var(--shadow-sm);
}
.me-stat .ms-num{
  font-size:22px; font-weight:760; line-height:1; font-feature-settings:"tnum";
  background:var(--g-primary); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.me-stat .ms-lbl{ font-size:11.5px; color:var(--muted); margin-top:5px; }
.me-actions{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:6px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:2px;
}
.me-action{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:12px 10px; border-radius:var(--radius-sm); cursor:pointer;
  background:transparent; text-align:left; color:var(--ink-1);
  transition:background var(--t-fast), transform var(--t-fast);
}
.me-action:active{ transform:scale(.985); }
.me-action:hover{ background:var(--panel-ins); }
.me-action .ma-ic{
  font-size:20px; flex:0 0 auto; width:34px; height:34px; border-radius:10px;
  display:grid; place-items:center; background:var(--panel-ins);
}
.me-action .ma-t{ flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink-1); display:flex; flex-direction:column; gap:1px; }
.me-action .ma-t small{ font-size:11px; font-weight:400; color:var(--muted); }
.me-action .ma-go{ flex:0 0 auto; color:var(--muted); font-size:18px; }
.me-action.danger .ma-ic{ background:var(--red-soft); }
.me-action.danger .ma-t{ color:var(--red); }
.me-action.danger .ma-go{ display:none; }
.me-action.full{ width:100%; justify-content:flex-start; background:var(--red-soft); border-radius:var(--radius-sm); margin-top:10px; }

/* =====================================================================
   Batch 17 · 全局美化层（一致性 / 细节打磨 · Calm Growth OS 2.1）
   ===================================================================== */

/* —— 学习内容更新提醒（替代旧的报警式边框盒子）—— */
.reminder{
  --c:var(--accent); --c-soft:var(--accent-soft); --c-ink:var(--accent-ink);
  position:relative; display:flex; gap:14px; align-items:flex-start;
  padding:15px 16px 15px 18px; border-radius:var(--radius);
  background:var(--c-soft); border:1px solid color-mix(in srgb,var(--c) 22%, transparent);
  overflow:hidden; transition:transform var(--t-fast), box-shadow var(--t-fast);
}
.reminder::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
.reminder .r-ic{
  flex:0 0 auto; width:38px; height:38px; border-radius:11px;
  display:grid; place-items:center; font-size:19px;
  background:var(--panel); color:var(--c); box-shadow:var(--shadow-sm);
}
.reminder .r-body{ flex:1; min-width:0; }
.reminder .r-title{ font-size:14.5px; font-weight:700; color:var(--ink-1); margin:1px 0 4px; letter-spacing:.01em; }
.reminder .r-sub{ font-size:12.5px; color:var(--ink-3); line-height:1.65; }
.reminder .r-sub strong{ color:var(--c-ink); font-weight:700; }
.reminder.info{ --c:var(--primary); --c-soft:var(--primary-soft); --c-ink:var(--primary-dark); }
.reminder.ok{   --c:var(--green);   --c-soft:var(--green-soft);   --c-ink:var(--green); }
.reminder.warn{ --c:var(--accent);  --c-soft:var(--accent-soft);  --c-ink:var(--accent-ink); }
.reminder.alert{--c:var(--red);     --c-soft:var(--red-soft);     --c-ink:var(--red-ink); }

/* —— 自定义滚动条（克制、贴合主题）—— */
* { scrollbar-width:thin; scrollbar-color:var(--line-1) transparent; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line-1); border-radius:999px; border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover{ background:var(--muted); background-clip:content-box; }

/* —— 清单项：统一悬停反馈 —— */
.item{ transition:background-color var(--t-fast); border-radius:var(--radius-sm); }
.item:hover{ background:var(--panel-ins); }

/* —— 折叠块：标题更清晰 + 悬停反馈 —— */
details.fold > summary{ color:var(--ink-2); border-radius:var(--radius-sm); transition:color var(--t-fast); }
details.fold > summary:hover{ color:var(--ink-1); }

/* —— 选项卡：选中态加层次 —— */
.tabs button.active{ box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 22%, transparent); font-weight:700; }

/* —— 全局文本节奏 / 抗锯齿 —— */
body{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }

/* —— SVG 趋势图标签/坐标轴随主题（覆盖 svgBars 内硬编码中性灰）—— */
.chart text{ fill:var(--muted); }
.chart line{ stroke:var(--line-1); }

/* —— 钢琴内嵌模块：明确边界，与外壳区分 —— */
#pianoFrame{ border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
